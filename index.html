нированный тип. Мальчик начинает задание быстро, не дослушав инструкцию, через 10–15 минут количество ошибок резко растёт, он встаёт, крутится, отвлекает соседей. Учитель жалуется на поведение и считает, что ребёнок «просто не хочет». Дома Джасур делает уроки два часа с постоянными окриками. Мальчик хорошо конструирует, любит подвижные игры, на индивидуальных занятиях с понятной структурой работает заметно лучше.","task":"Спроектируйте фрагмент маршрута: план структурированного наблюдения с вашим электронным листом (2 недели), структура индивидуального занятия (короткие блоки, визуальное расписание, двигательные паузы) и рекомендации учителю и родителям по организации учебной работы."},"trainer":{"match":[["Условный рефлекс","Приобретённая реакция на основе временной связи"],["Внутреннее торможение","Угасание и дифференцировка, основа произвольной регуляции"],["Ретикулярная формация","Поддерживает бодрствование и активацию коры"],["Префронтальная кора","Программирование и контроль деятельности"],["Вторая сигнальная система","Регуляция поведения словом"]],"odd":[{"items":["угасательное","дифференцировочное","запаздывательное","внешнее"],"odd":3,"why":"Внешнее торможение безусловное; остальные - виды внутреннего торможения."},{"items":["сила","уравновешенность","подвижность","острота"],"odd":3,"why":"Острота не относится к свойствам нервных процессов по И.П. Павлову."}],"yesno":[["Безусловные рефлексы врождённые",true],["Диагноз СДВГ ставит дефектолог",false],["Типы высшей нервной деятельности выделил И.П. Павлов",true],["Лобные отделы коры созревают раньше всех",false],["Короткие этапы занятия с паузами соответствуют ограниченной устойчивости внимания",true]]},"atlas":"атлас-таблицы ИвГМА (2012): рис. 48–49 (сагиттальный и горизонтальный разрезы мозга)."},{"id":"t6","module":2,"hours":6,"title":"Возрастная физиология и работоспособность","goal":"Освоить закономерности возрастного развития и динамики работоспособности и научиться строить и интерпретировать кривую работоспособности ребёнка.","tool":"curve","scheme":[["Периоды онтогенеза: новорождённость, грудной, ранний, дошкольный, младший школьный, подростковый","Смена ведущих функциональных систем","Нарушение на раннем этапе отражается на последующем развитии"],["Сенситивные и критические периоды","Повышенная чувствительность к определённым воздействиям","Упущенные сроки снижают эффективность коррекции"],["Гетерохрония созревания: лобные отделы коры созревают позднее всего","Постепенное становление произвольной регуляции","Возрастные ограничения длительности и сложности нагрузки"],["Динамика работоспособности: врабатывание — устойчивая работоспособность — утомление","Основание для дозирования нагрузки","При истощаемости — короткий период устойчивой работы, раннее утомление"],["Школьная зрелость: морфофункциональная и психологическая готовность","Успешное начало систематического обучения","Функциональная незрелость: трудности адаптации, перегрузка"]],"notes":["Гетерохрония — неравномерность созревания функциональных систем: одни системы созревают раньше, другие позже.","Сенситивный период — период наибольшей чувствительности к определённым воздействиям, благоприятный для развития конкретной функции.","К.С. Лебединская выделила варианты задержки психического развития (ЗПР): конституционального, соматогенного, психогенного и церебрально-органического генеза.","При ЗПР церебрально-органического генеза характерны повышенная истощаемость, низкая и неустойчивая работоспособность.","Кривую работоспособности строят по результатам однотипного задания (например, корректурной пробы), выполняемого через равные интервалы времени: учитывают объём и количество ошибок."],"health":"Дозирование нагрузки по кривой работоспособности: сложный материал — в фазе устойчивой работоспособности, смена деятельности и пауза — при первых признаках утомления. Для студента: план работы над темой на 5–7 дней вместо одного вечера.","read":"Пособие, § 2.3 (здоровьесберегающее измерение познавательной деятельности), § 8.3 (психофизиологический уровень здоровьесберегающего блока).","l1":["Составьте таблицу возрастных периодов с ведущими достижениями в развитии моторики, речи и регуляции поведения.","Опишите три фазы динамики работоспособности и признаки каждой, которые педагог видит на занятии."],"l2":["Цифровая диагностика. Во вкладке «Норматив» есть инструмент построения кривой работоспособности. Введите данные корректурной пробы (по умолчанию даны результаты девочки 7 лет по пяти трёхминутным интервалам), постройте кривую и опишите фазы. Определите, на каком интервале начинается утомление.","Предложите режим занятия для ребёнка с такой кривой: длительность этапов, место сложного материала, момент паузы."],"l2check":["Фазы врабатывания, устойчивости и утомления выделены по данным","Учтены и объём работы, и количество ошибок","Режим занятия прямо следует из кривой"],"test":[{"q":"Сенситивный период —","a":["период болезни","период повышенной чувствительности к определённым воздействиям","период отдыха","период полового созревания"],"c":1,"e":"В сенситивный период функция развивается наиболее успешно."},{"q":"Правильная последовательность фаз работоспособности:","a":["утомление — врабатывание — устойчивость","врабатывание — устойчивая работоспособность — утомление","устойчивость — врабатывание — утомление","утомление — устойчивость — врабатывание"],"c":1,"e":"Сначала организм включается в работу, затем работает устойчиво, затем утомляется."},{"q":"Позднее всего созревают","a":["затылочные отделы коры","лобные отделы коры","спинной мозг","ствол мозга"],"c":1,"e":"Поэтому произвольная регуляция поведения формируется долго."},{"q":"Классификацию ЗПР по этиопатогенетическому принципу предложила","a":["К.С. Лебединская","Н.М. Назарова","Л.И. Плаксина","Р.Е. Левина"],"c":0,"e":"Варианты: конституционального, соматогенного, психогенного, церебрально-органического генеза."},{"q":"Для ЗПР церебрально-органического генеза характерна","a":["высокая работоспособность","повышенная истощаемость и низкая работоспособность","отсутствие утомления","нарушение слуха"],"c":1,"e":"Именно поэтому кривая работоспособности — важный диагностический инструмент."},{"q":"Кривую работоспособности строят по результатам","a":["однократного теста","однотипного задания, выполняемого через равные интервалы","беседы с родителями","медицинской карты"],"c":1,"e":"Учитывают объём выполненной работы и количество ошибок в каждом интервале."},{"q":"Гетерохрония —","a":["одновременное созревание всех систем","неравномерность созревания функциональных систем","нарушение слуха","задержка роста"],"c":1,"e":"Разные системы организма созревают в разные сроки."},{"q":"Школьная зрелость —","a":["возраст 7 лет","уровень морфофункционального и психического развития, при котором систематическое обучение не вредит здоровью","умение читать","рост и вес по норме"],"c":1,"e":"Это не только возраст, а функциональная готовность организма."}],"kase":{"title":"Нигора, 7 лет: ЗПР церебрально-органического генеза","norm":["Какие особенности нервной системы объясняют повышенную истощаемость Нигоры?","Почему созревание лобных отделов коры важно для успешного обучения в первом классе?","Что показывает кривая работоспособности девочки и как это использовать?"],"portrait":"Нигора учится в первом классе. Психолого-медико-педагогическая комиссия установила ЗПР церебрально-органического генеза. В начале урока девочка работает старательно, но через 10–12 минут начинает зевать, кладёт голову на парту, ошибки нарастают. Корректурная проба по пяти трёхминутным интервалам: просмотрено знаков — 42, 48, 46, 31, 24; ошибок — 1, 1, 2, 6, 9. Мама переживает за успеваемость и дополнительно занимается с дочерью дома по два часа без перерыва. Нигора любит рисовать и петь.","task":"Спроектируйте фрагмент маршрута на учебную четверть: интерпретация кривой работоспособности, режим индивидуального занятия и учебного дня, рекомендации учителю и консультация для мамы о дозировании домашней нагрузки."},"trainer":{"match":[["Гетерохрония","Неравномерность созревания функциональных систем"],["Сенситивный период","Повышенная чувствительность к определённым воздействиям"],["Врабатывание","Начальная фаза работоспособности"],["Утомление","Снижение работоспособности после периода устойчивой работы"],["Школьная зрелость","Готовность организма к систематическому обучению без ущерба для здоровья"]],"odd":[{"items":["конституционального","соматогенного","психогенного","сенсоневрального"],"odd":3,"why":"Сенсоневральной бывает тугоухость; остальные - варианты ЗПР по К.С. Лебединской."},{"items":["врабатывание","устойчивая работоспособность","утомление","акселерация"],"odd":3,"why":"Акселерация - ускорение роста и развития, а не фаза работоспособности."}],"yesno":[["Кривую работоспособности строят по однотипному заданию через равные интервалы",true],["При ЗПР церебрально-органического генеза работоспособность высокая и устойчивая",false],["Лобные отделы коры созревают позже других",true],["Классификацию ЗПР предложила К.С. Лебединская",true],["Школьная зрелость определяется только возрастом",false]]}},{"id":"t7","module":3,"hours":6,"title":"Опорно-двигательный аппарат","goal":"Связать строение скелета, суставов и мышц с формированием осанки и моторики и научиться учитывать показания и противопоказания при проектировании двигательного режима.","scheme":[["Позвоночник с физиологическими изгибами: шейный и поясничный лордоз, грудной и крестцовый кифоз","Опора, амортизация, защита спинного мозга","Нарушения осанки, сколиоз"],["Суставы и связочный аппарат","Подвижность при сохранении стабильности","Гипермобильность суставов, нестабильность (в том числе атланто-аксиальная)"],["Скелетные мышцы, мышечный тонус","Поддержание позы и движения","Мышечная гипотония: задержка моторного развития, нарушение осанки"],["Свод стопы","Опора и амортизация при ходьбе","Плоскостопие"],["Нервная регуляция движений: кора, мозжечок, проприорецепторы мышц и суставов","Координация, чувство положения тела","Моторная неловкость, нарушение координации"]],"notes":["Изгибы позвоночника формируются постнатально: шейный — когда ребёнок начинает держать голову, грудной — когда садится, поясничный — когда начинает стоять и ходить.","Мышечный тонус — длительное умеренное напряжение мышц в покое, которое поддерживает позу.","Для детей с синдромом Дауна (трисомия по 21-й хромосоме) характерны мышечная гипотония и гипермобильность суставов, часто встречаются врождённые пороки сердца.","У части детей с синдромом Дауна выявляется атланто-аксиальная нестабильность. До решения врача исключают кувырки, стойки на голове и упражнения с нагрузкой на шею.","Профилактика нарушений осанки сочетает укрепление мышечного корсета, правильную рабочую позу, подбор мебели по росту и достаточную двигательную активность.","Кость как орган состоит из костной, хрящевой и соединительной тканей, имеет собственные сосуды и нервы. Её рельеф - бугры, гребни, ямки, борозды - отражает тягу мышц и прилегание соседних органов.","В костномозговой полости трубчатых костей детей находится красный костный мозг, с возрастом замещаемый жёлтым; в губчатом веществе плоских костей красный костный мозг сохраняется всю жизнь.","Соединения костей бывают непрерывными (синдесмозы, синхондрозы, синостозы), прерывными (суставы) и переходными - полусуставами (симфизами). Движения в суставах: вокруг фронтальной оси - сгибание и разгибание, сагиттальной - отведение и приведение, вертикальной - вращение (для конечностей - пронация и супинация).","У новорождённого кости свода черепа соединены соединительнотканными родничками, позвоночник почти не имеет изгибов, многие кости состоят из отдельных частей; окостенение скелета завершается к 20–25 годам."],"health":"Двигательный режим всегда проектируется с учётом показаний и противопоказаний и согласуется с врачом (ортопедом, кардиологом) и инструктором адаптивной физической культуры. Студенту: двигательные перерывы каждые 45–60 минут по 5–10 минут.","read":"Пособие, § 6.2 (опорно-двигательный аппарат как фундамент работы по развитию двигательной сферы), § 8.2 (интеграция с адаптивной физической культурой), кейс 8.3. Конспект практического занятия «Опорно-двигательная система» (строение и классификация костей, соединения).","l1":["Подпишите на схеме позвоночника отделы и физиологические изгибы и укажите возраст их формирования.","Составьте таблицу «вид нарушения осанки — признаки — упражнения для профилактики»."],"l2":["Составьте алгоритм учёта показаний и противопоказаний при проектировании двигательного режима ребёнка: какие медицинские сведения нужны, у кого их запросить, какие упражнения исключить до получения заключения.","Ситуационная задача. Инструктор предлагает включить в занятие кувырки и прыжки на батуте для ребёнка с синдромом Дауна, рентгенологического обследования шейного отдела не было. Оцените предложение с анатомических позиций и предложите безопасную замену."],"l2check":["Алгоритм указывает источники медицинских сведений и ответственных специалистов","Противопоказания обоснованы строением шейного отдела позвоночника и суставов","Предложенные замены сохраняют развивающую цель упражнений"],"test":[{"q":"Физиологические лордозы позвоночника —","a":["грудной и крестцовый","шейный и поясничный","шейный и грудной","только поясничный"],"c":1,"e":"Лордоз — изгиб вперёд, кифоз — назад."},{"q":"Шейный изгиб позвоночника формируется, когда ребёнок","a":["начинает ходить","начинает держать голову","садится","рождается"],"c":1,"e":"Грудной — при сидении, поясничный — при стоянии и ходьбе."},{"q":"Сколиоз —","a":["искривление позвоночника вперёд","боковое искривление позвоночника","уплощение стопы","увеличение грудного кифоза"],"c":1,"e":"Сколиоз — искривление во фронтальной плоскости."},{"q":"Мышечный тонус —","a":["максимальная сила мышцы","длительное умеренное напряжение мышц в покое, поддерживающее позу","скорость сокращения","размер мышцы"],"c":1,"e":"При гипотонии ребёнку труднее удерживать позу."},{"q":"Для детей с синдромом Дауна характерны","a":["спастичность и повышение рефлексов","мышечная гипотония и гипермобильность суставов","атрофия мышц ног","сколиоз у всех детей"],"c":1,"e":"Это определяет особенности моторного развития и осанки."},{"q":"До заключения врача при риске атланто-аксиальной нестабильности исключают","a":["ходьбу","кувырки, стойки на голове и упражнения с нагрузкой на шею","дыхательные упражнения","игры с мячом сидя"],"c":1,"e":"Нестабильность сочленения первого и второго шейных позвонков опасна сдавлением спинного мозга."},{"q":"Плоскостопие —","a":["уплощение сводов стопы","искривление голени","укорочение стопы","вывих стопы"],"c":0,"e":"Своды стопы обеспечивают амортизацию при ходьбе."},{"q":"Профилактика нарушений осанки включает","a":["только ношение корсета","укрепление мышечного корсета, правильную рабочую позу и двигательную активность","ограничение движений","сон на мягкой перине"],"c":1,"e":"Это комплекс мер, а не одно средство."}],"kase":{"title":"Бехзод, 7 лет: синдром Дауна, мышечная гипотония","norm":["Как мышечная гипотония и гипермобильность суставов влияют на осанку и моторику?","Почему при синдроме Дауна нужна осторожность с нагрузкой на шейный отдел позвоночника?","Какие медицинские сведения вам нужны до составления двигательного режима?"],"portrait":"У Бехзода синдром Дауна. В раннем возрасте ему оперировали дефект межпредсердной перегородки, кардиолог разрешил умеренные физические нагрузки. Отмечаются мышечная гипотония, плоскостопие, сутулость, при сидении мальчик быстро «оседает». Рентгенологического обследования шейного отдела позвоночника не проводилось. Бехзод доброжелателен, любит музыку и подражает взрослым, интеллектуальное развитие снижено. Он посещает инклюзивный класс, и инструктор по физкультуре предлагает включить его в общие занятия с кувырками.","task":"Спроектируйте фрагмент маршрута по развитию двигательной сферы и формированию осанки Бехзода с учётом показаний и противопоказаний: что сделать до начала занятий, какие упражнения и игры включить, как организовать рабочее место в классе, как распределить роли с инструктором, кардиологом и ортопедом."},"trainer":{"match":[["Остеон","Структурно-функциональная единица компактного вещества кости"],["Надкостница","Обеспечивает рост кости в толщину и её регенерацию"],["Диафиз","Тело трубчатой кости"],["Эпифиз","Конец трубчатой кости, участвующий в образовании сустава"],["Синдесмоз","Соединение костей плотной соединительной тканью"]],"odd":[{"items":["шейный лордоз","грудной кифоз","поясничный лордоз","сколиоз"],"odd":3,"why":"Сколиоз - боковое искривление, а не физиологический изгиб."},{"items":["связки","суставные диски","синовиальные сумки","сухожилия мышц"],"odd":3,"why":"Сухожилия мышц не входят во вспомогательный аппарат сустава."}],"yesno":[["Шейный изгиб формируется, когда ребёнок начинает держать голову",true],["Швы черепа относятся к синдесмозам",true],["Сколиоз - искривление позвоночника вперёд",false],["Наиболее подвижный отдел позвоночника - шейный",true],["Сгибание и разгибание происходят вокруг сагиттальной оси",false]]},"schemes":["bone","joint","spine"],"atlas":"атлас-таблицы ИвГМА (2012): рис. 1–17, 19–20 (оси и плоскости, строение кости, скелет, позвоночник, суставы, соединения, мышцы)."},{"id":"t8","module":3,"hours":6,"title":"Вестибулярный анализатор и межсенсорное взаимодействие","goal":"Понять, как вестибулярная, зрительная и проприоцептивная системы совместно обеспечивают равновесие, и спроектировать маршрут при сочетанном нарушении.","scheme":[["Преддверие: эллиптический и сферический мешочки с отолитовым аппаратом","Восприятие положения головы и линейных ускорений","Нарушения статического равновесия"],["Три полукружных канала в трёх взаимно перпендикулярных плоскостях","Восприятие угловых ускорений (вращения головы)","Головокружение, нистагм; при двустороннем выпадении — неустойчивость"],["Вестибулярная часть VIII пары, вестибулярные ядра ствола, связи с мозжечком, глазодвигательными ядрами и спинным мозгом","Вестибуло-окулярный и вестибуло-спинальные рефлексы","Нарушение стабилизации взгляда при движении, нарушение позы"],["Межсенсорное взаимодействие: вестибулярная, зрительная и проприоцептивная системы","Совместное обеспечение равновесия и ориентировки в пространстве","При выпадении одной системы компенсация за счёт других; при выпадении двух — грубое нарушение равновесия"]],"notes":["Вестибулярный аппарат и улитка расположены во внутреннем ухе и иннервируются одним — преддверно-улитковым — нервом, поэтому слух и равновесие могут страдать одновременно.","Вестибуло-окулярный рефлекс удерживает изображение на сетчатке при движениях головы.","Нистагм — ритмичные непроизвольные движения глазных яблок.","Ребёнку с двусторонним выпадением вестибулярной функции особенно трудно сохранять равновесие в темноте и на неровной поверхности: остаётся опора только на проприоцепцию.","Бактериальный менингит может повредить внутреннее ухо. После него нужна срочная оценка слуха: возможно окостенение улитки, которое затрудняет кохлеарную имплантацию."],"health":"Безопасная среда для ребёнка с нарушением равновесия: хорошее освещение, поручни на лестнице, нескользкое покрытие, отсутствие препятствий. Упражнения на равновесие выполняются со страховкой и от простого к сложному.","read":"Пособие, § 6.2 (вестибулярный анализатор и его взаимодействие со зрительным и проприоцептивным), § 7.2 (познавательная деятельность в инклюзивной среде).","l1":["Найдите на модели внутреннего уха преддверие, полукружные каналы и улитку. Запишите, какой раздражитель воспринимает каждая структура.","Нарисуйте схему «три системы равновесия» и укажите, какую информацию даёт каждая."],"l2":["Ситуационная задача. Почему ребёнок с двусторонней вестибулярной арефлексией днём ходит почти уверенно, а вечером в полутёмном коридоре падает? Объясните через межсенсорное взаимодействие и предложите изменения среды.","Составьте последовательность из 6–8 упражнений на развитие равновесия с опорой на зрение и проприоцепцию, от простого к сложному, с указанием страховки."],"l2check":["Объяснение называет все три системы равновесия и их вклад","Упражнения выстроены по нарастанию сложности и безопасны","Изменения среды прямо следуют из механизма нарушения"],"test":[{"q":"Вестибулярный аппарат расположен в","a":["среднем ухе","внутреннем ухе","мозжечке","наружном ухе"],"c":1,"e":"Он находится во внутреннем ухе рядом с улиткой."},{"q":"Полукружные каналы воспринимают","a":["звук","угловые ускорения (вращение головы)","свет","давление на стопу"],"c":1,"e":"Каналы расположены в трёх взаимно перпендикулярных плоскостях."},{"q":"Отолитовый аппарат преддверия воспринимает","a":["положение головы и линейные ускорения","вращение","высоту звука","цвет"],"c":0,"e":"Отолиты смещаются под действием силы тяжести и ускорения."},{"q":"Вестибуло-окулярный рефлекс обеспечивает","a":["сужение зрачка","стабилизацию взгляда при движениях головы","слезоотделение","аккомодацию"],"c":1,"e":"Без него при ходьбе мир «прыгает» перед глазами."},{"q":"Равновесие обеспечивается взаимодействием","a":["слуховой и вкусовой систем","вестибулярной, зрительной и проприоцептивной систем","только вестибулярной системы","обонятельной и зрительной систем"],"c":1,"e":"Выпадение одной системы частично компенсируется другими."},{"q":"Ребёнку с двусторонним выпадением вестибулярной функции особенно трудно сохранять равновесие","a":["днём на ровном полу","в темноте и на неровной поверхности","сидя за партой","при чтении"],"c":1,"e":"В темноте выпадает зрение, на неровной поверхности искажается проприоцепция."},{"q":"После бактериального менингита срочная оценка слуха важна, потому что","a":["слух всегда восстанавливается сам","возможно окостенение улитки, затрудняющее кохлеарную имплантацию","это требование школы","нужно проверить зрение"],"c":1,"e":"Сроки имплантации в этом случае имеют решающее значение."},{"q":"Нистагм —","a":["косоглазие","ритмичные непроизвольные движения глазных яблок","помутнение хрусталика","головная боль"],"c":1,"e":"Нистагм часто сопровождает вестибулярные нарушения."}],"kase":{"title":"Шерзод, 6 лет: глухота и вестибулярные нарушения после менингита","norm":["Почему менингит повредил одновременно слух и равновесие?","Какие системы равновесия у Шерзода сохранны и как на них опереться?","Чем отличается слухоречевая реабилитация позднооглохшего ребёнка от работы с ребёнком, не слышавшим с рождения?"],"portrait":"Восемь месяцев назад Шерзод перенёс бактериальный менингит. Развилась двусторонняя глухота, четыре месяца назад выполнена кохлеарная имплантация справа. Обследование выявило двустороннее выпадение вестибулярной функции. До болезни речь мальчика соответствовала возрасту. Сейчас он ходит неуверенно, широко расставляя ноги, падает на неровной поверхности, боится лестниц и тёмных комнат, отказывается от подвижных игр со сверстниками. Речь сохранилась, но стала громкой и менее чёткой. Родители растеряны и очень опекают сына.","task":"Спроектируйте комплексный фрагмент маршрута: слухоречевая работа после имплантации с опорой на сохранную речь, развитие равновесия с опорой на зрение и проприоцепцию, безопасная среда дома и в детском саду, психологическая поддержка семьи, распределение ролей в команде специалистов."},"trainer":{"match":[["Полукружные каналы","Воспринимают угловые ускорения"],["Отолитовый аппарат","Воспринимает положение головы и линейные ускорения"],["Вестибуло-окулярный рефлекс","Стабилизирует взгляд при движениях головы"],["Проприоцепция","Чувство положения и движения частей тела"],["Нистагм","Ритмичные непроизвольные движения глаз"]],"odd":[{"items":["вестибулярная система","зрение","проприоцепция","обоняние"],"odd":3,"why":"Обоняние не участвует в поддержании равновесия."},{"items":["эллиптический мешочек","сферический мешочек","полукружные каналы","барабанная перепонка"],"odd":3,"why":"Барабанная перепонка относится к органу слуха, остальное - к вестибулярному аппарату."}],"yesno":[["Вестибулярный аппарат расположен в среднем ухе",false],["В темноте ребёнку с вестибулярной арефлексией труднее сохранять равновесие",true],["Улитку и вестибулярный аппарат иннервирует одна пара черепных нервов",true],["Полукружные каналы воспринимают звук",false],["После бактериального менингита слух нужно оценить срочно",true]]},"schemes":["ear"],"atlas":"атлас-таблицы ИвГМА (2012): рис. 53, 55 (орган слуха и равновесия, костный лабиринт)."},{"id":"t9","module":3,"hours":8,"final":true,"title":"Итоговый проект: индивидуальный коррекционный маршрут","goal":"Применить общий метод «строение — функция — нарушение» к полному маршруту ребёнка и собрать портфолио курса.","scheme":[],"notes":["Выберите один из портретов курса (кейсы 1–8) или портрет, предложенный преподавателем.","В отличие от кейсов тем 1–8, здесь проектируется полный маршрут: цель, этапы, направления работы всех специалистов, режим, мониторинг.","Итоговый тест составляется случайно из 15 вопросов банка курса. Повторная попытка формирует новый набор.","Портфолио курса формируется во вкладке «Мой прогресс»: результаты тестов, решения кейсов, дневник."],"health":"Итоговый проект выполняется за 7–10 дней. Распределите работу по дням, а не на последний вечер: это требование курса, а не пожелание.","read":"Пособие, § 4.3 (структура кейса), § 6.3 (здоровьесберегающая компетенция), § 7.1–7.3 (инклюзивный контекст).","l1":["Перечитайте свои решения кейсов и отметьте в каждом, что было обосновано анатомо-физиологическим материалом, а что — нет."],"l2":["Составьте карту специалистов для выбранного ребёнка: кто участвует, за что отвечает, как часто вы взаимодействуете."],"l2check":["Карта охватывает медицинских специалистов, педагогов и семью","Для каждого специалиста определена зона ответственности"],"test":[],"kase":{"title":"Полный индивидуальный коррекционный маршрут","norm":["Какое звено какой системы нарушено у выбранного ребёнка и что из этого следует для всех направлений работы?","Какие сопутствующие ограничения здоровья нужно учесть в режиме?"],"portrait":"","task":"Спроектируйте полный индивидуальный коррекционный маршрут выбранного ребёнка на учебный год: цель, этапы, направления работы и задачи, методы, здоровьесберегающий режим, критерии и сроки мониторинга, взаимодействие со специалистами и семьёй. Подготовьте выступление на 7 минут для обсуждения в группе."}}],"anatomyGlossary":[["Аккомодация","Способность глаза фокусироваться на предметах, находящихся на разном расстоянии, за счёт изменения кривизны хрусталика."],["Атаксия","Нарушение координации движений при сохранной мышечной силе; характерна для поражения мозжечка."],["Афферентный нейрон","Чувствительный нейрон, проводящий возбуждение от рецептора в центральную нервную систему."],["Гетерохрония","Неравномерность созревания функциональных систем организма в онтогенезе."],["Гипотония мышечная","Снижение мышечного тонуса; затрудняет удержание позы и замедляет моторное развитие."],["Дизартрия","Нарушение произносительной стороны речи вследствие недостаточной иннервации речевого аппарата."],["Зона Брока","Задние отделы нижней лобной извилины доминантного полушария; обеспечивает моторную организацию речи."],["Зона Вернике","Задние отделы верхней височной извилины доминантного полушария; обеспечивает понимание речи."],["Кортиев орган","Рецепторный аппарат улитки с волосковыми клетками, преобразующими звуковые колебания в нервный импульс."],["Нистагм","Ритмичные непроизвольные движения глазных яблок."],["Пирамидный путь","Корково-спинномозговой путь произвольных движений от прецентральной извилины к мотонейронам спинного мозга."],["Пластичность мозга","Способность нервной системы изменять структуру и функции под влиянием опыта и обучения; наибольшая в раннем возрасте."],["Проприоцепция","Ощущение положения и движения частей тела, обеспечиваемое рецепторами мышц, сухожилий и суставов."],["Рефлекторная дуга","Путь возбуждения от рецептора через центральную нервную систему к рабочему органу."],["Сенсоневральная тугоухость","Снижение слуха вследствие поражения внутреннего уха или слухового нерва."],["Кондуктивная тугоухость","Снижение слуха вследствие нарушения проведения звука в наружном или среднем ухе."],["Спастичность","Повышение мышечного тонуса при поражении центральных двигательных путей."],["Хиазма","Перекрёст волокон зрительных нервов, в котором переходят на противоположную сторону волокна от внутренних половин сетчаток."],["Кривая работоспособности","Графическое отображение динамики объёма и качества работы за равные интервалы времени."],["Атланто-аксиальная нестабильность","Избыточная подвижность в сочленении первого и второго шейных позвонков; требует ограничения нагрузок на шею."]],"pedGlossaryKeep":["Активизация познавательной деятельности","Градуированная ориентировочная основа действия","Здоровьесберегающая компетенция дефектолога","Коррекционно-познавательный кейс","Междисциплинарная интеграция","Познавательная деятельность","Самообразование","Самостоятельная работа","Самостоятельное образование","Скаффолдинг","Телерефлексия","Управляемая самостоятельность","Цифровая гигиена","Цифровая образовательная среда","Эффект обращения экспертности"],"schemes":{"bone":{"title":"Строение трубчатой кости (продольный распил, схема)","labels":["Суставной хрящ","Губчатое вещество эпифиза","Метафиз","Компактное вещество","Диафиз","Костномозговая полость","Надкостница"],"svg":"\u003csvg viewBox=\"0 0 560 430\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\">\u003cdefs>\u003cpattern id=\"sp-bone\" width=\"9\" height=\"9\" patternUnits=\"userSpaceOnUse\">\u003crect width=\"9\" height=\"9\" fill=\"var(--l2-bg)\"/>\u003ccircle cx=\"4.5\" cy=\"4.5\" r=\"1.7\" fill=\"var(--l2)\"/>\u003c/pattern>\u003c/defs>\u003cellipse cx=\"200\" cy=\"78\" rx=\"58\" ry=\"40\" fill=\"url(#sp-bone)\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\u003cpath d=\"M150,62 A58,40 0 0 1 250,62\" fill=\"none\" stroke=\"var(--l1)\" stroke-width=\"8\"/>\u003cpolygon points=\"150,100 250,100 226,142 174,142\" fill=\"url(#sp-bone)\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\u003crect x=\"174\" y=\"142\" width=\"52\" heig вумя неизвестными","Заполните пропуски так, чтобы утверждение стало верным.","___ - рецепторы слуха, а ___ - рецепторы зрения (волосковые клетки; палочки и колбочки)."],["Восстанови смысл чисел","Объясните, что означает каждое число в контексте темы.","33–34, 12, 7, 56–70 дБ, 1,0."],["Цифровой диктант","На каждое утверждение ответьте 1 (да) или 0 (нет), затем сразу проверьте и разберите ошибки.","«Слуховые косточки находятся во внутреннем ухе» - 0."],["Найди смысловую ошибку","Найдите и исправьте ошибку в учебном тексте.","«Остеокласты строят костную ткань» - строят остеобласты, остеокласты её разрушают."],["Назови одним словом","Обобщите несколько понятий одним термином.","Роговица, хрусталик, стекловидное тело - светопреломляющие среды глаза."],["Перевод с научного на понятный","Перескажите научное определение простыми словами так, чтобы его поняли родители ребёнка.","Сенсоневральная тугоухость: «в улитке повреждены клетки, которые превращают звук в сигнал для мозга»."],["Синквейн","Составьте пятистрочие: понятие; два прилагательных; три глагола; фраза; синоним-вывод.","Мозжечок / древний, координирующий / согласует, уточняет, удерживает / без него походка шаткая / равновесие."],["Интеллект-карта","Разместите понятие темы в центре листа и разверните ветви: строение, функция, нарушение, коррекция, профилактика. Затем «прочитайте» карту однокурснику.","Центр - «Речевой аппарат»."],["Свернуть текст в схему","Переведите параграф учебника в таблицу или схему и сделайте вывод.","Путь звука от ушной раковины до коры в виде цепочки."],["Составь задание однокурснику","Придумайте тест, загадку или задачу по теме, предложите её однокурснику, проверьте и объясните ошибки.","Загадка о мозжечке для студентов или о носе для ребёнка."]],"techniquesSource":"Каталог составлен по пособию Н.Л. Галеевой «Сто приёмов учебного успеха ученика на уроках биологии» (М.: 5 за знания, 2006); примеры подобраны к материалу курса.","planner":{"source":"Раздел подготовлен с опорой на задания по самоменеджменту из учебного пособия и рабочей тетради Н.В. Тамарской и И.О. Семёновой «Старшекласснику - будущему педагогу об управлении» (Калининград, 2003).","goals":["Цель 1 на неделю","Цель 2 на неделю","Цель 3 на неделю"],"days":["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"],"errors":["Откладываю работу на последний вечер","Работаю без перерывов больше часа","Отвлекаюсь на телефон и уведомления","Не планирую, с чего начать","Берусь за всё сразу и ничего не довожу до конца","Не проверяю себя после изучения материала","Сижу допоздна и не высыпаюсь"]}};
const PED_GLOSSARY_RU = [["Активизация познавательной деятельности","педагогически проектируемый процесс формирования внутренней структуры познавательной деятельности обучающегося и развёртывания её профессионально-рефлексивного потенциала; переход от внешне регулируемых форм познания к внутренне регулируемым, от репродуктивных уровней к продуктивным и творческим."],["Величина эффекта","статистическая мера практической значимости различий (например, d Коэна), обязательная к сообщению наряду с уровнем статистической значимости; позволяет судить, насколько выявленное различие ощутимо для образовательной практики."],["Градуированная ориентировочная основа действия","принцип, согласно которому полнота предоставляемой студенту ориентировочной схемы является переменной величиной, убывающей по мере роста его подготовленности в предметной области: от полной схемы для новичка к самостоятельному построению схемы на творческом уровне."],["Деятельность","специфическая форма общественно-исторического бытия людей, целенаправленное преобразование ими природной и социальной действительности; мотивированная совокупность закономерно связанных между собой поведенческих актов и последовательно совершаемых действий, направленных на выполнение определённых задач, на достижение тех или иных социально значимых целей. Структурно включает цель, средство, процесс преобразования и результат."],["Здоровьесберегающая компетенция дефектолога","самостоятельная составляющая профессионального портрета дефектолога, имеющая трёхмерную структуру: личностное здоровье специалиста; проектирование здоровьесберегающей коррекционной работы с ребёнком; формирование у ребёнка и его семьи навыков здорового образа жизни."],["Здоровьесберегающая образовательная среда","педагогически организованная образовательная среда, в которой каждое решение проверяется на согласованность с принципом сохранения и развития здоровья обучающегося; включает рациональное распределение учебной нагрузки, эргономику учебных помещений и цифровых рабочих мест, режим учебной работы, физическую активность, психоэмоциональное благополучие и цифровую гигиену."],["Инклюзивное образование","системная трансформация образовательной практики, в которой образовательная среда адаптируется к разнообразию обучающихся (включая лиц с особыми образовательными потребностями) на основе биопсихосоциальной модели функционирования и инвалидности."],["Коннективизм","концепция Дж. Сименса, согласно которой в цифровую эпоху знание распределено в сети, а обучение состоит в установлении связей между узлами информации; в подготовке дефектолога принимается как методология проектирования цифровой среды, не отменяющая прочного усвоения ядра профессиональных знаний."],["Коррекционно-познавательный кейс","авторская дидактическая единица самостоятельного образования будущего дефектолога, интегрирующая в одной учебной ситуации анатомо-физиологический норматив, индивидуально-типологический портрет, проектное действие и профессиональную рефлексию; ведущая методическая единица подготовки дефектолога в условиях цифровизации."],["Междисциплинарная интеграция","дидактический механизм, обеспечивающий связь содержания различных учебных дисциплин в единое предметное поле и формирование у обучающегося целостного профессионального мышления; различают внутрипредметную, межпредметную, метапредметную и профессионально-интегративную связи."],["Познавательная деятельность","сложная интегративная деятельность субъекта, направленная на освоение нового знания, его систематизацию и применение в различных учебных и профессиональных ситуациях; имеет структуру: потребность - мотив - задача - средства - действия - операции."],["Профессиональная компетентность","формирование на базе общего образования профессионально значимых для личности и общества качеств, которые позволяют человеку наиболее полно реализовать себя в конкретных видах трудовой деятельности; для дефектолога включает кластер специальных компетенций - диагностической, коррекционно-развивающей, консультативно-сопроводительной, цифрово-ассистивной, рефлексивной, здоровьесберегающей."],["Профессиональная ориентация","комплекс педагогических мероприятий по содействию молодёжи в профессиональном самоопределении в соответствии с желаниями, склонностями, способностями и с учётом потребности в специалистах и ситуации на рынке труда; деятельность работников системы образования и социальных работников, направленная на оказание консультативной помощи в выборе профессии."],["Профессиональная педагогика","наука, изучающая закономерности образования, воспитания и развития, разрабатывающая принципы обучения и воспитания, информационные и педагогические технологии, обосновывающая типы образовательных учреждений и систему их управления; наука о подготовке человека к профессиональной деятельности."],["Профессиональная подготовка","процесс овладения знаниями, навыками и умениями, позволяющими выполнять работу в определённой области деятельности; имеет целью ускоренное приобретение обучающимся навыков, необходимых для выполнения определённой работы или группы работ."],["Профессиональная самостоятельность","активная деятельность учащихся, их настойчивость и целеустремлённость в практическом овладении профессией или специальностью, применение на практике полученных теоретических знаний, самооценка своих интеллектуальных, эмоциональных и волевых качеств; реализуется в способности самостоятельно выбирать способы выполнения работы, разбираться в производственной обстановке, принимать правильное решение, планировать и контролировать выполняемую работу."],["Самостоятельность в профессиональной деятельности","один из критериев эффективности профессионального обучения, предполагающий безошибочность выбора оптимальной технологии, обеспечивающей высокое качество и производительность труда; способность диагностировать производственную ситуацию, принять целесообразное решение; умение осуществлять регулярный самоконтроль."],["Профессиональная пригодность","совокупность психических и психофизиологических особенностей человека, необходимых и достаточных для эффективной работы в рамках той или иной профессии; не дана человеку изначально, формируется в процессе обучения и последующей профессиональной деятельности при наличии положительной мотивации."],["Профессиональное мастерство","высокая и постоянно совершенствуемая степень овладения определённым видом профессиональной деятельности; результат длительного профессионального становления, опирающегося на освоенные теоретические знания, сформированные практические умения и развитую профессиональную рефлексию."],["Самообразование","систематическая учебная деятельность, построенная на самостоятельном изучении какого-либо вопроса или проблемы с периодическими консультациями у специалиста или без них; в системе непрерывного образования выполняет роль связующего звена между ступенями и стадиями организации учёбы."],["Самообучение","обратная, внутренняя сторона обучения, сущность которой состоит в том, чтобы педагогические приёмы, методы, способы учебной работы перевести во внутренний план личности и превратить совокупности умений и навыков в надёжные способы самостоятельного добывания знаний в течение всей жизни."],["Самоопределение","процесс и результат выбора личностью собственных позиций, целей и средств самоосуществления в конкретных обстоятельствах жизни; основной механизм обретения и проявления человеком внутренней свободы."],["Самооценка","оценка человеком своих собственных целей, интересов и мотивов поведения, на основе которой он строит своё взаимодействие с другими людьми; убеждение в ценности собственной личности; тесно связана с рефлексией."],["Самопознание","познание своего Я в его специфике, условиях и способах реакции, характерных для него предрасположениях и способностях, силах и границах собственного Я; возможно только при помощи действия (И. В. Гёте)."],["Саморазвитие","процесс активного, последовательного и в целом необратимого качественного изменения психологического статуса личности; потребность в самосовершенствовании, самодвижении, в построении себя как личности."],["Самостимулирование","способ обеспечения самообладания, суть которого заключается в том, чтобы за счёт собственных усилий превратить должное и необходимое в желанное и притягательное."],["Самостоятельная домашняя работа","форма обучения, имеющая целью закрепление полученных на уроке знаний, умений и навыков, самостоятельное усвоение доступного материала и дополнительной информации, выполнение творческих работ."],["Самостоятельная работа","форма организации обучения, сущность которой заключается в самостоятельной познавательной деятельности учащегося; одно из важнейших средств подготовки к активной самообразовательной работе; осуществляется как в ходе урочных, так и во внеурочное время."],["Самостоятельное образование","педагогически проектируемый и сопровождаемый процесс, в котором локус контроля постепенно смещается от преподавателя к обучающемуся; занимает промежуточное положение между самостоятельной работой (управляемой преподавателем) и самообразованием (автономно мотивированной деятельностью)."],["Самостоятельность","личностное качество, выраженное в способности мыслить, анализировать ситуацию, вырабатывать собственное мнение, принимать решения и действовать по собственной инициативе, независимо от навязываемых взглядов и способов разрешения проблем."],["Самостоятельность мышления","индивидуальная особенность мышления, умение увидеть и поставить новый вопрос, новую проблему, попытаться решить их особыми путями."],["Самостоятельные наблюдения","метод производственного обучения учащихся, сущность которого состоит в том, что, руководя самостоятельным наблюдением учащегося, мастер помогает выделить для наблюдения определённые моменты, обращает внимание на признаки наблюдаемого процесса."],["Самостоятельный поиск","метод обучения, который позволяет преподавателю, опираясь на имеющийся у учащегося багаж знаний, умений и навыков, на его индивидуальные способности, ставить перед ним задачи возрастающей сложности."],["Скаффолдинг","система временных поддерживающих структур (ориентировочные схемы, этапы решения, критерии самопроверки, наводящие вопросы), предоставляемых обучающемуся при решении задач, превышающих его актуальные возможности, и постепенно снимаемых по мере роста подготовленности (принцип угасающего руководства)."],["Телерефлексия","цифровая видеофиксация деятельности с последующим само- и взаимоанализом как средство качественного изменения рефлексивной практики в условиях цифровизации профессионального образования (Е. Л. Куцеева, 2021)."],["Универсальный дизайн обучения (UDL)","рамка проектирования учебных материалов и образовательной среды, обеспечивающая множественные способы представления информации, действия и выражения, вовлечения (D. Rose, A. Meyer, D. Gordon, 2014; UDL Guidelines 2.2, 2018)."],["Управляемая самостоятельность","характеристика организации самообразования, при которой предоставляемая студенту автономия является переменной величиной, расширяющейся по мере роста подготовленности; самостоятельность рассматривается не как условие, а как результат обучения."],["Цифровая гигиена","комплекс профессионально значимых навыков управления взаимодействием с цифровыми устройствами и информационной средой: эргономика, защита зрения, профилактика гиподинамии, информационная гигиена, психоэмоциональная гигиена."],["Цифровая образовательная среда","педагогически спроектированная цифровая инфраструктура образовательного процесса, интегрирующая четыре функциональных слоя - контентный, коммуникативный, проектный, диагностико-оценочный - в единую среду со сквозной аутентификацией пользователя."],["Цифровизация образования","качественная трансформация образовательной деятельности - изменение её коммуникативной структуры, временной организации, форм взаимодействия преподавателя и студента, способов проектирования содержания, типов обратной связи и форм оценки результата; не сводится к технологическому оснащению образовательного процесса."],["Эффект обращения экспертности","закономерность теории когнитивной нагрузки: приёмы подробного руководства, повышающие результативность новичка, становятся избыточной когнитивной нагрузкой для подготовленного обучающегося и снижают эффективность его учения."],["SAMR","модель оценки глубины использования цифровых технологий в образовательном процессе, выделяющая четыре уровня - замещение, расширение, модификация, преобразование (R. Puentedura)."],["TPACK","рамка интеграции технологического, педагогического и предметно-содержательного знания преподавателя (P. Mishra, M. J. Koehler, 2006)."]];
