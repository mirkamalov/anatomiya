я неизвестными","Заполните пропуски так, чтобы утверждение стало верным.","___ - рецепторы слуха, а ___ - рецепторы зрения (волосковые клетки; палочки и колбочки)."],["Восстанови смысл чисел","Объясните, что означает каждое число в контексте темы.","33–34, 12, 7, 56–70 дБ, 1,0."],["Цифровой диктант","На каждое утверждение ответьте 1 (да) или 0 (нет), затем сразу проверьте и разберите ошибки.","«Слуховые косточки находятся во внутреннем ухе» - 0."],["Найди смысловую ошибку","Найдите и исправьте ошибку в учебном тексте.","«Остеокласты строят костную ткань» - строят остеобласты, остеокласты её разрушают."],["Назови одним словом","Обобщите несколько понятий одним термином.","Роговица, хрусталик, стекловидное тело - светопреломляющие среды глаза."],["Перевод с научного на понятный","Перескажите научное определение простыми словами так, чтобы его поняли родители ребёнка.","Сенсоневральная тугоухость: «в улитке повреждены клетки, которые превращают звук в сигнал для мозга»."],["Синквейн","Составьте пятистрочие: понятие; два прилагательных; три глагола; фраза; синоним-вывод.","Мозжечок / древний, координирующий / согласует, уточняет, удерживает / без него походка шаткая / равновесие."],["Интеллект-карта","Разместите понятие темы в центре листа и разверните ветви: строение, функция, нарушение, коррекция, профилактика. Затем «прочитайте» карту однокурснику.","Центр - «Речевой аппарат»."],["Свернуть текст в схему","Переведите параграф учебника в таблицу или схему и сделайте вывод.","Путь звука от ушной раковины до коры в виде цепочки."],["Составь задание однокурснику","Придумайте тест, загадку или задачу по теме, предложите её однокурснику, проверьте и объясните ошибки.","Загадка о мозжечке для студентов или о носе для ребёнка."]],"techniquesSource":"Каталог составлен по пособию Н.Л. Галеевой «Сто приёмов учебного успеха ученика на уроках биологии» (М.: 5 за знания, 2006); примеры подобраны к материалу курса.","planner":{"source":"Раздел подготовлен с опорой на задания по самоменеджменту из учебного пособия и рабочей тетради Н.В. Тамарской и И.О. Семёновой «Старшекласснику - будущему педагогу об управлении» (Калининград, 2003).","goals":["Цель 1 на неделю","Цель 2 на неделю","Цель 3 на неделю"],"days":["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"],"errors":["Откладываю работу на последний вечер","Работаю без перерывов больше часа","Отвлекаюсь на телефон и уведомления","Не планирую, с чего начать","Берусь за всё сразу и ничего не довожу до конца","Не проверяю себя после изучения материала","Сижу допоздна и не высыпаюсь"]}};
const PED_GLOSSARY = [["Активизация познавательной деятельности","педагогически проектируемый процесс формирования внутренней структуры познавательной деятельности обучающегося и развёртывания её профессионально-рефлексивного потенциала; переход от внешне регулируемых форм познания к внутренне регулируемым, от репродуктивных уровней к продуктивным и творческим."],["Величина эффекта","статистическая мера практической значимости различий (например, d Коэна), обязательная к сообщению наряду с уровнем статистической значимости; позволяет судить, насколько выявленное различие ощутимо для образовательной практики."],["Градуированная ориентировочная основа действия","принцип, согласно которому полнота предоставляемой студенту ориентировочной схемы является переменной величиной, убывающей по мере роста его подготовленности в предметной области: от полной схемы для новичка к самостоятельному построению схемы на творческом уровне."],["Деятельность","специфическая форма общественно-исторического бытия людей, целенаправленное преобразование ими природной и социальной действительности; мотивированная совокупность закономерно связанных между собой поведенческих актов и последовательно совершаемых действий, направленных на выполнение определённых задач, на достижение тех или иных социально значимых целей. Структурно включает цель, средство, процесс преобразования и результат."],["Здоровьесберегающая компетенция дефектолога","самостоятельная составляющая профессионального портрета дефектолога, имеющая трёхмерную структуру: личностное здоровье специалиста; проектирование здоровьесберегающей коррекционной работы с ребёнком; формирование у ребёнка и его семьи навыков здорового образа жизни."],["Здоровьесберегающая образовательная среда","педагогически организованная образовательная среда, в которой каждое решение проверяется на согласованность с принципом сохранения и развития здоровья обучающегося; включает рациональное распределение учебной нагрузки, эргономику учебных помещений и цифровых рабочих мест, режим учебной работы, физическую активность, психоэмоциональное благополучие и цифровую гигиену."],["Инклюзивное образование","системная трансформация образовательной практики, в которой образовательная среда адаптируется к разнообразию обучающихся (включая лиц с особыми образовательными потребностями) на основе биопсихосоциальной модели функционирования и инвалидности."],["Коннективизм","концепция Дж. Сименса, согласно которой в цифровую эпоху знание распределено в сети, а обучение состоит в установлении связей между узлами информации; в подготовке дефектолога принимается как методология проектирования цифровой среды, не отменяющая прочного усвоения ядра профессиональных знаний."],["Коррекционно-познавательный кейс","авторская дидактическая единица самостоятельного образования будущего дефектолога, интегрирующая в одной учебной ситуации анатомо-физиологический норматив, индивидуально-типологический портрет, проектное действие и профессиональную рефлексию; ведущая методическая единица подготовки дефектолога в условиях цифровизации."],["Междисциплинарная интеграция","дидактический механизм, обеспечивающий связь содержания различных учебных дисциплин в единое предметное поле и формирование у обучающегося целостного профессионального мышления; различают внутрипредметную, межпредметную, метапредметную и профессионально-интегративную связи."],["Познавательная деятельность","сложная интегративная деятельность субъекта, направленная на освоение нового знания, его систематизацию и применение в различных учебных и профессиональных ситуациях; имеет структуру: потребность - мотив - задача - средства - действия - операции."],["Профессиональная компетентность","формирование на базе общего образования профессионально значимых для личности и общества качеств, которые позволяют человеку наиболее полно реализовать себя в конкретных видах трудовой деятельности; для дефектолога включает кластер специальных компетенций - диагностической, коррекционно-развивающей, консультативно-сопроводительной, цифрово-ассистивной, рефлексивной, здоровьесберегающей."],["Профессиональная ориентация","комплекс педагогических мероприятий по содействию молодёжи в профессиональном самоопределении в соответствии с желаниями, склонностями, способностями и с учётом потребности в специалистах и ситуации на рынке труда; деятельность работников системы образования и социальных работников, направленная на оказание консультативной помощи в выборе профессии."],["Профессиональная педагогика","наука, изучающая закономерности образования, воспитания и развития, разрабатывающая принципы обучения и воспитания, информационные и педагогические технологии, обосновывающая типы образовательных учреждений и систему их управления; наука о подготовке человека к профессиональной деятельности."],["Профессиональная подготовка","процесс овладения знаниями, навыками и умениями, позволяющими выполнять работу в определённой области деятельности; имеет целью ускоренное приобретение обучающимся навыков, необходимых для выполнения определённой работы или группы работ."],["Профессиональная самостоятельность","активная деятельность учащихся, их настойчивость и целеустремлённость в практическом овладении профессией или специальностью, применение на практике полученных теоретических знаний, самооценка своих интеллектуальных, эмоциональных и волевых качеств; реализуется в способности самостоятельно выбирать способы выполнения работы, разбираться в производственной обстановке, принимать правильное решение, планировать и контролировать выполняемую работу."],["Самостоятельность в профессиональной деятельности","один из критериев эффективности профессионального обучения, предполагающий безошибочность выбора оптимальной технологии, обеспечивающей высокое качество и производительность труда; способность диагностировать производственную ситуацию, принять целесообразное решение; умение осуществлять регулярный самоконтроль."],["Профессиональная пригодность","совокупность психических и психофизиологических особенностей человека, необходимых и достаточных для эффективной работы в рамках той или иной профессии; не дана человеку изначально, формируется в процессе обучения и последующей профессиональной деятельности при наличии положительной мотивации."],["Профессиональное мастерство","высокая и постоянно совершенствуемая степень овладения определённым видом профессиональной деятельности; результат длительного профессионального становления, опирающегося на освоенные теоретические знания, сформированные практические умения и развитую профессиональную рефлексию."],["Самообразование","систематическая учебная деятельность, построенная на самостоятельном изучении какого-либо вопроса или проблемы с периодическими консультациями у специалиста или без них; в системе непрерывного образования выполняет роль связующего звена между ступенями и стадиями организации учёбы."],["Самообучение","обратная, внутренняя сторона обучения, сущность которой состоит в том, чтобы педагогические приёмы, методы, способы учебной работы перевести во внутренний план личности и превратить совокупности умений и навыков в надёжные способы самостоятельного добывания знаний в течение всей жизни."],["Самоопределение","процесс и результат выбора личностью собственных позиций, целей и средств самоосуществления в конкретных обстоятельствах жизни; основной механизм обретения и проявления человеком внутренней свободы."],["Самооценка","оценка человеком своих собственных целей, интересов и мотивов поведения, на основе которой он строит своё взаимодействие с другими людьми; убеждение в ценности собственной личности; тесно связана с рефлексией."],["Самопознание","познание своего Я в его специфике, условиях и способах реакции, характерных для него предрасположениях и способностях, силах и границах собственного Я; возможно только при помощи действия (И. В. Гёте)."],["Саморазвитие","процесс активного, последовательного и в целом необратимого качественного изменения психологического статуса личности; потребность в самосовершенствовании, самодвижении, в построении себя как личности."],["Самостимулирование","способ обеспечения самообладания, суть которого заключается в том, чтобы за счёт собственных усилий превратить должное и необходимое в желанное и притягательное."],["Самостоятельная домашняя работа","форма обучения, имеющая целью закрепление полученных на уроке знаний, умений и навыков, самостоятельное усвоение доступного материала и дополнительной информации, выполнение творческих работ."],["Самостоятельная работа","форма организации обучения, сущность которой заключается в самостоятельной познавательной деятельности учащегося; одно из важнейших средств подготовки к активной самообразовательной работе; осуществляется как в ходе урочных, так и во внеурочное время."],["Самостоятельное образование","педагогически проектируемый и сопровождаемый процесс, в котором локус контроля постепенно смещается от преподавателя к обучающемуся; занимает промежуточное положение между самостоятельной работой (управляемой преподавателем) и самообразованием (автономно мотивированной деятельностью)."],["Самостоятельность","личностное качество, выраженное в способности мыслить, анализировать ситуацию, вырабатывать собственное мнение, принимать решения и действовать по собственной инициативе, независимо от навязываемых взглядов и способов разрешения проблем."],["Самостоятельность мышления","индивидуальная особенность мышления, умение увидеть и поставить новый вопрос, новую проблему, попытаться решить их особыми путями."],["Самостоятельные наблюдения","метод производственного обучения учащихся, сущность которого состоит в том, что, руководя самостоятельным наблюдением учащегося, мастер помогает выделить для наблюдения определённые моменты, обращает внимание на признаки наблюдаемого процесса."],["Самостоятельный поиск","метод обучения, который позволяет преподавателю, опираясь на имеющийся у учащегося багаж знаний, умений и навыков, на его индивидуальные способности, ставить перед ним задачи возрастающей сложности."],["Скаффолдинг","система временных поддерживающих структур (ориентировочные схемы, этапы решения, критерии самопроверки, наводящие вопросы), предоставляемых обучающемуся при решении задач, превышающих его актуальные возможности, и постепенно снимаемых по мере роста подготовленности (принцип угасающего руководства)."],["Телерефлексия","цифровая видеофиксация деятельности с последующим само- и взаимоанализом как средство качественного изменения рефлексивной практики в условиях цифровизации профессионального образования (Е. Л. Куцеева, 2021)."],["Универсальный дизайн обучения (UDL)","рамка проектирования учебных материалов и образовательной среды, обеспечивающая множественные способы представления информации, действия и выражения, вовлечения (D. Rose, A. Meyer, D. Gordon, 2014; UDL Guidelines 2.2, 2018)."],["Управляемая самостоятельность","характеристика организации самообразования, при которой предоставляемая студенту автономия является переменной величиной, расширяющейся по мере роста подготовленности; самостоятельность рассматривается не как условие, а как результат обучения."],["Цифровая гигиена","комплекс профессионально значимых навыков управления взаимодействием с цифровыми устройствами и информационной средой: эргономика, защита зрения, профилактика гиподинамии, информационная гигиена, психоэмоциональная гигиена."],["Цифровая образовательная среда","педагогически спроектированная цифровая инфраструктура образовательного процесса, интегрирующая четыре функциональных слоя - контентный, коммуникативный, проектный, диагностико-оценочный - в единую среду со сквозной аутентификацией пользователя."],["Цифровизация образования","качественная трансформация образовательной деятельности - изменение её коммуникативной структуры, временной организации, форм взаимодействия преподавателя и студента, способов проектирования содержания, типов обратной связи и форм оценки результата; не сводится к технологическому оснащению образовательного процесса."],["Эффект обращения экспертности","закономерность теории когнитивной нагрузки: приёмы подробного руководства, повышающие результативность новичка, становятся избыточной когнитивной нагрузкой для подготовленного обучающегося и снижают эффективность его учения."],["SAMR","модель оценки глубины использования цифровых технологий в образовательном процессе, выделяющая четыре уровня - замещение, расширение, модификация, преобразование (R. Puentedura)."],["TPACK","рамка интеграции технологического, педагогического и предметно-содержательного знания преподавателя (P. Mishra, M. J. Koehler, 2006)."]];
</script>
<script>
(function(){
"use strict";
const KEY="anat-defect-course-v1";
let S={};
try{ S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ S={}; }
S.t=S.t||{}; S.view=S.view||{v:"home"}; S.tr=S.tr||{}; S.p=S.p||{}; S.plan=S.plan||{}; S.sch=S.sch||{};
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} },300); }
function saveNow(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function T(id){ return S.t[id]||(S.t[id]={test:{best:0,attempts:0},l1:{},l2:{},l2checks:[],l2done:false,norm:{},project:{},refl:{},rate:0,caseDone:false,diary:{}}); }
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const themes=COURSE.themes;
const byId=id=>themes.find(t=>t.id===id);
const PASS=6, FINAL_N=15, FINAL_PASS=11;
let DL=null;
try{ if(window.claude&&typeof window.claude.use==="function") window.claude.use("downloads").then(d=>{ DL=d; }).catch(()=>{}); }catch(e){}

// ---------- логика доступа ----------
function testPassed(t){ const st=T(t.id); return t.final ? (st.test.best>=FINAL_PASS) : (st.test.best>=PASS); }
function l2Open(t){ return S.teacher || t.final || testPassed(t); }
function caseOpen(t){ return S.teacher || T(t.id).l2done; }
function ladderHTML(t){ const st=T(t.id); return `<span class="ladder" aria-label="Уровни: ${testPassed(t)?"тест сдан":"тест не сдан"}, ${st.l2done?"второй уровень выполнен":"второй уровень не выполнен"}, ${st.caseDone?"кейс выполнен":"кейс не выполнен"}"><i class="${testPassed(t)?"on":""}"></i><i class="${st.l2done?"on":""}"></i><i class="${st.caseDone?"on":""}"></i></span>`; }

// ---------- навигация ----------
function go(v){ S.view=v; save(); render(); const m=$("#main"); m.focus({preventScroll:true}); window.scrollTo(0,0); }
function renderNav(){
  const cur=S.view;
  const b=(v,label,extra)=>`<button class="navbtn" data-go='${JSON.stringify(v)}' ${(cur.v===v.v&&(cur.id||"")===(v.id||""))?'aria-current="page"':""}><span>${label}</span>${extra||""}</button>`;
  let h=b({v:"home"},"Как работать с курсом");
  COURSE.modules.forEach(m=>{
    h+=`<div class="modlabel">Модуль ${m.n}. ${esc(m.title)}</div>`;
    themes.filter(t=>t.module===m.n).forEach((t,i)=>{ h+=b({v:"theme",id:t.id,tab:"norm"},`${themes.indexOf(t)+1}. ${esc(t.title)}`,ladderHTML(t)); });
  });
  h+=`<div class="modlabel">Опорный практикум по анатомии</div>`;
  COURSE.practicum.forEach(p=>{ const st=P(p.id); h+=b({v:"prac",id:p.id,tab:"q"},esc(p.title),st.test.attempts?`<span class="pbadge">${st.test.best}/${p.test.length}</span>`:""); });
  h+=`<hr class="navsep">`+b({v:"learn"},"Как учиться самостоятельно")+b({v:"progress"},"Мой прогресс и отчёт")+b({v:"gloss"},"Глоссарий")+b({v:"teacher"},"Для преподавателя");
  $("#side").innerHTML=h;
  // мобильный список
  let o=`<option value='{"v":"home"}'>Как работать с курсом</option>`;
  themes.forEach((t,i)=>{ o+=`<option value='${JSON.stringify({v:"theme",id:t.id,tab:"norm"})}' ${cur.v==="theme"&&cur.id===t.id?"selected":""}>${i+1}. ${esc(t.title)}</option>`; });
  COURSE.practicum.forEach(p=>{ o+=`<option value='${JSON.stringify({v:"prac",id:p.id,tab:"q"})}' ${cur.v==="prac"&&cur.id===p.id?"selected":""}>Практикум: ${esc(p.title)}</option>`; });
  o+=`<option value='{"v":"learn"}' ${cur.v==="learn"?"selected":""}>Как учиться самостоятельно</option>`;
  o+=`<option value='{"v":"progress"}' ${cur.v==="progress"?"selected":""}>Мой прогресс и отчёт</option><option value='{"v":"gloss"}' ${cur.v==="gloss"?"selected":""}>Глоссарий</option><option value='{"v":"teacher"}' ${cur.v==="teacher"?"selected":""}>Для преподавателя</option>`;
  $("#mnav").innerHTML=o;
}
$("#side").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) go(JSON.parse(b.dataset.go)); });
$("#mnav").addEventListener("change",e=>go(JSON.parse(e.target.value)));

// ---------- страницы ----------
function stairsHTML(small, t){
  return `<div class="stairs ${small?"small":""}">`+COURSE.levels.map((l,i)=>{
    let locked=false, state="";
    if(t){ if(i===1) locked=!l2Open(t); if(i===2) locked=!caseOpen(t);
      const st=T(t.id); const done=[testPassed(t),st.l2done,st.caseDone][i]; state=done?" — выполнено":(locked?" — закрыт":""); }
    return `<div class="step ${locked?"locked":""}"><h3>${i+1}. ${l.name}${state}</h3>${small?"":`<p>${esc(l.ood)}</p>`}</div>`;
  }).join("")+`</div>`;
}

// ---------- инструмент: кривая работоспособности ----------
function curveData(t){ const st=T(t.id); if(!st.curve) st.curve={v:[42,48,46,31,24],e:[1,1,2,6,9]}; return st.curve; }
function curveTool(t){
  const d=curveData(t);
  let rows=`<tr><th>Интервал (3 мин)</th>${d.v.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr>`;
  rows+=`<tr><td>Просмотрено знаков</td>${d.v.map((x,i)=>`<td><input type="number" min="0" data-curve="v" data-i="${i}" value="${x}" aria-label="Объём, интервал ${i+1}"></td>`).join("")}</tr>`;
  rows+=`<tr><td>Ошибок</td>${d.e.map((x,i)=>`<td><input type="number" min="0" data-curve="e" data-i="${i}" value="${x}" aria-label="Ошибки, интервал ${i+1}"></td>`).join("")}</tr>`;
  return `<div class="block curve"><h3>Инструмент: кривая работоспособности</h3><p class="small">Введите результаты корректурной пробы по интервалам. График обновляется сразу. Интерпретацию сделайте сами в задании второго уровня.</p><div class="scroll"><table>${rows}</table></div><div id="curvesvg">${curveSVG(d)}</div></div>`;
}
function curveSVG(d){
  const W=600,H=260,pl=48,pr=48,pt=16,pb=40,n=d.v.length;
  const maxV=Math.max(10,...d.v.map(Number)), maxE=Math.max(5,...d.e.map(Number));
  const x=i=>pl+(W-pl-pr)*(n===1?0:i/(n-1)), yv=v=>pt+(H-pt-pb)*(1-v/maxV), ye=v=>pt+(H-pt-pb)*(1-v/maxE);
  const pv=d.v.map((v,i)=>`${x(i)},${yv(+v)}`).join(" "), pe=d.e.map((v,i)=>`${x(i)},${ye(+v)}`).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Кривая работоспособности: объём и ошибки по интервалам">`;
  s+=`<line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--line)"/>`;
  d.v.forEach((_,i)=>{ s+=`<text x="${x(i)}" y="${H-pb+22}" font-size="13" text-anchor="middle" fill="var(--muted)">${i+1}</text>`; });
  s+=`<text x="${pl-8}" y="${pt+10}" font-size="12" text-anchor="end" fill="var(--l1)">${maxV}</text><text x="${W-pr+8}" y="${pt+10}" font-size="12" fill="var(--l3)">${maxE}</text>`;
  s+=`<polyline points="${pv}" fill="none" stroke="var(--l1)" stroke-width="3"/><polyline points="${pe}" fill="none" stroke="var(--l3)" stroke-width="3" stroke-dasharray="6 5"/>`;
  d.v.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${yv(+v)}" r="4.5" fill="var(--l1)"/><circle cx="${x(i)}" cy="${ye(+d.e[i])}" r="4" fill="var(--l3)"/>`; });
  s+=`<text x="${(W)/2}" y="${H-4}" font-size="13" text-anchor="middle" fill="var(--muted)">Интервалы по 3 минуты</text></svg>`;
  s+=`<p class="small"><span style="color:var(--l1);font-weight:700">Сплошная линия</span> — объём работы, <span style="color:var(--l3);font-weight:700">пунктир</span> — ошибки (отдельная шкала справа).</p>`;
  return s;
}
// ---------- тест ----------
const session={order:{},result:{},final:null,finalResult:null};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sameSet(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }
function isCorrect(q,ans){ return Array.isArray(q.c) ? sameSet(ans||[],q.c) : ans===q.c; }
function qBlock(q,qi,ord,res,name){
  const multi=Array.isArray(q.c);
  const chosen=oi=> res ? (multi ? (res.ans[qi]||[]).includes(oi) : res.ans[qi]===oi) : false;
  const right=oi=> multi ? q.c.includes(oi) : oi===q.c;
  return `<div class="q"><fieldset><legend>${qi+1}. ${esc(q.q)}</legend>`+ord.map(oi=>{
    let cls=""; if(res){ if(right(oi)) cls="right"; else if(chosen(oi)) cls="wrong"; }
    return `<label class="opt ${cls}"><input type="${multi?"checkbox":"radio"}" name="${name}${qi}" value="${oi}" ${chosen(oi)?"checked":""} ${res?"disabled":""}><span>${esc(q.a[oi])}</span></label>`;
  }).join("")+(res?`<p class="expl">${isCorrect(q,res.ans[qi])?'<b class="ok">Верно.</b>':'<b>Неверно.</b>'} ${esc(q.e)}</p>`:"")+`</fieldset></div>`;
}
function collectAnswers(qs,name){ return qs.map((q,qi)=>{ if(Array.isArray(q.c)) return [...main.querySelectorAll(`input[name="${name}${qi}"]:checked`)].map(x=>+x.value); const c=main.querySelector(`input[name="${name}${qi}"]:checked`); return c?+c.value:-1; }); }
function tabTest(t){
  const st=T(t.id);
  if(!session.order[t.id]) session.order[t.id]=t.test.map(q=>shuffle([0,1,2,3]));
  const res=session.result[t.id];
  let h=`<div class="block l1"><span class="lvtag">Первый уровень</span><h3>Тест по нормативу темы</h3><p class="small meta">Лучший результат: ${st.test.best} из ${t.test.length}. Попыток: ${st.test.attempts}. Порог для второго уровня: ${PASS} из ${t.test.length}.</p>`;
  h+=t.test.map((q,qi)=>qBlock(q,qi,session.order[t.id][qi],res,"q")).join("");
  if(res){ h+=`<p class="score">${res.score} из ${t.test.length}. ${res.score>=PASS?'<span class="ok">Второй уровень открыт.</span>':"Повторите норматив и пройдите тест ещё раз."}</p><div class="row"><button class="btn ghost" data-act="retest">Пройти тест заново</button>${res.score>=PASS?'<button class="btn" data-tabgo="tasks">Перейти к заданиям</button>':'<button class="btn" data-tabgo="norm">Вернуться к нормативу</button>'}</div>`; }
  else h+=`<p class="mt"><button class="btn" data-act="submit-test">Проверить ответы</button></p>`;
  return h+`</div>`;
}
function bank(){ const b=[]; themes.filter(t=>!t.final).forEach(t=>t.test.forEach(q=>b.push(q))); return b; }
function tabFinalTest(t){
  const st=T(t.id);
  if(!session.final){ const qs=shuffle(bank()).slice(0,FINAL_N); session.final={qs, ord:qs.map(()=>shuffle([0,1,2,3]))}; }
  const F=session.final, res=session.finalResult;
  let h=`<div class="block l1"><span class="lvtag">Итоговый контроль</span><h3>Итоговый тест: ${FINAL_N} случайных вопросов из банка курса</h3><p class="small meta">Лучший результат: ${st.test.best} из ${FINAL_N}. Попыток: ${st.test.attempts}. Зачётный порог: ${FINAL_PASS} из ${FINAL_N}.</p>`;
  h+=F.qs.map((q,qi)=>qBlock(q,qi,F.ord[qi],res,"f")).join("");
  if(res) h+=`<p class="score">${res.score} из ${FINAL_N}. ${res.score>=FINAL_PASS?'<span class="ok">Итоговый тест сдан.</span>':"Порог не достигнут: повторите темы, в которых были ошибки."}</p><button class="btn ghost" data-act="refinal">Новый набор вопросов</button>`;
  else h+=`<p class="mt"><button class="btn" data-act="submit-final">Проверить ответы</button></p>`;
  return h+`</div>`;
}

     `<p class="field">Готовность выполнить такое действие в реальной ситуации</p><div class="rate" role="radiogroup" aria-label="Самооценка готовности от 1 до 5">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="rate" value="${n}" ${st.rate===n?"checked":""} data-rate="1">${n}</label>`).join("")}</div><p class="small meta">1 — не готов(а), 5 — готов(а) самостоятельно.</p>`;

function trainerCheck(key){ const tr=trainerFor(key), st=TRS(key); let s=0;

  let h=`<div class="block"><h3>Подпишите немую схему: ${esc(sc.title)}</h3><div class="schemewrap">${sc.svg}</div><div class="schemegrid">`;
  h+=sc.labels.map((l,i)=>{ const v=st.v[i]; const ok=String(v)===String(i);
    return `<div class="trrow ${res?(ok?"right":"wrong"):""}"><span class="num">${i+1}</span><select data-sch="${key}" data-i="${i}" aria-label="Подпись к цифре ${i+1}" ${res?"disabled":""}><option value="">— выберите —</option>${ord.map(j=>`<option value="${j}" ${String(v)===String(j)?"selected":""}>${esc(sc.labels[j])}</option>`).join("")}</select>${res&&!ok?`<span class="trfix">Верно: ${esc(l)}</span>`:""}</div>`; }).join("");
  h+=`</div>`+(res ? `<p class="score">${res.score} из ${sc.labels.length}</p><button class="btn ghost" data-act="sch-reset" data-key="${key}">Пройти заново</button>`
                   : `<p class="mt"><button class="btn" data-act="sch-check" data-key="${key}" data-sid="${sid}">Проверить подписи</button> ${st.best!=null?`<span class="small meta">Лучший результат: ${st.best} из ${sc.labels.length}</span>`:""}</p>`);
  return h+`</div>`;
}
// ---------- опорный практикум ----------
function P(id){ return S.p[id]||(S.p[id]={checked:[],notes:"",test:{best:0,attempts:0}}); }
function pagePrac(p,tab){
  const st=P(p.id), idx=COURSE.practicum.indexOf(p);
  const tabs=[["q","Вопросы"],["test","Тест"]]; if(p.schemes) tabs.push(["sch","Немые схемы"]); if(p.trainer) tabs.push(["tr","Тренажёр"]);
  let h=`<p class="meta">Опорный практикум по анатомии человека · раздел ${idx+1} из ${COURSE.practicum.length}</p><h1>${esc(p.title)}</h1><p class="lead">Повторение анатомической основы курса: вопросы для самоподготовки, тест повышенной сложности${p.schemes?", немые схемы":""}${p.trainer?" и тренажёр":""}. В тесте встречаются вопросы с двумя правильными ответами.</p>`;
  h+=`<div class="tabs" role="tablist">`+tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-ptab="${k}">${l}</button>`).join("")+`</div>`;
  if(tab==="q"){
    h+=`<div class="block"><h3>Вопросы для самоподготовки</h3><p class="small meta">Отметьте вопросы, на которые можете ответить без учебника. Остальные изучите по учебнику и атласу.</p><div class="checks">`+
       p.questions.map((q,i)=>`<label><input type="checkbox" data-pq="${p.id}" data-i="${i}" ${st.checked[i]?"checked":""}><span>${esc(q)}</span></label>`).join("")+
       `</div><p class="small meta" id="pqcount">Отмечено: ${st.checked.filter(Boolean).length} из ${p.questions.length}</p><label class="field" for="pn">Мои заметки по разделу</label><textarea id="pn" data-pn="${p.id}">${esc(st.notes||"")}</textarea></div>`;
  }
  if(tab==="test"){
    session.pOrd=session.pOrd||{}; session.pRes=session.pRes||{};
    if(!session.pOrd[p.id]) session.pOrd[p.id]=p.test.map(()=>shuffle([0,1,2,3]));
    const res=session.pRes[p.id];
    h+=`<div class="block l1"><h3>Тест повышенной сложности</h3><p class="small meta">Лучший результат: ${st.test.best} из ${p.test.length}. Попыток: ${st.test.attempts}. Вопрос с двумя ответами засчитывается, только если отмечены оба верных ответа.</p>`+
       p.test.map((q,qi)=>qBlock(q,qi,session.pOrd[p.id][qi],res,"pq")).join("")+
       (res?`<p class="score">${res.score} из ${p.test.length}</p><button class="btn ghost" data-act="reprac">Пройти тест заново</button>`:`<p class="mt"><button class="btn" data-act="submit-prac">Проверить ответы</button></p>`)+`</div>`;
  }
  if(tab==="sch") h+=p.schemes.map(sid=>schemeHTML(p.id+"-"+sid,sid)).join("");
  if(tab==="tr") h+=`<div class="block l1"><h3>Тренажёр</h3>${trainerHTML(p.id,p.trainer)}</div>`;
  return h;
}
// ---------- как учиться ----------
function pageLearn(){
  const pl=S.plan, PL=COURSE.planner;
  let h=`<h1>Как учиться самостоятельно</h1><p class="lead">Приёмы, которые превращают чтение учебника в активную работу, и планировщик недели для здоровьесберегающего режима.</p>`;
  h+=`<div class="block"><h3>Копилка приёмов самостоятельной работы</h3><dl class="tech">`+COURSE.techniques.map(([n,d,ex])=>`<dt>${esc(n)}</dt><dd>${esc(d)} <i>Пример:</i> ${esc(ex)}</dd>`).join("")+`</dl><p class="small meta">${esc(COURSE.techniquesSource)}</p></div>`;
  h+=`<div class="block"><h3>Мои цели на неделю</h3>`+PL.goals.map((g,i)=>`<label class="field" for="g${i}">${esc(g)}</label><input type="text" id="g${i}" data-pk="goal${i}" value="${esc(pl["goal"+i]||"")}" style="width:100%">`).join("")+`</div>`;
  h+=`<div class="block"><h3>План работы по дням</h3><p class="small meta">Распределите тему на 5–7 дней по 45–60 минут: что именно вы делаете в этот день - норматив, тест, задания, кейс или дневник.</p>`+PL.days.map((d,i)=>`<label class="field" for="dd${i}">${esc(d)}</label><input type="text" id="dd${i}" data-pk="day${i}" value="${esc(pl["day"+i]||"")}" style="width:100%">`).join("")+`</div>`;
  h+=`<div class="block"><h3>Мои ошибки в самоорганизации</h3><div class="checks">`+PL.errors.map((e,i)=>`<label><input type="checkbox" data-pk="err${i}" ${pl["err"+i]?"checked":""}><span>${esc(e)}</span></label>`).join("")+`</div>`+
     `<label class="field" for="fix">Что я изменю на этой неделе</label><textarea id="fix" data-pk="fix">${esc(pl.fix||"")}</textarea>`+
     `<label class="field" for="deal">Договор с собой</label><textarea id="deal" data-pk="deal" placeholder="Я обязуюсь…">${esc(pl.deal||"")}</textarea><p class="small meta">${esc(PL.source)}</p></div>`;
  return h;
}
// ---------- общий рендер ----------
function render(){
  renderNav();
  const v=S.view, m=$("#main");
  if(v.v==="theme"){ const t=byId(v.id)||themes[0]; m.innerHTML=pageTheme(t,v.tab||"norm"); }
  else if(v.v==="prac"){ const p=COURSE.practicum.find(x=>x.id===v.id)||COURSE.practicum[0]; m.innerHTML=pagePrac(p,v.tab||"q"); }
  else if(v.v==="learn") m.innerHTML=pageLearn();
  else if(v.v==="progress") m.innerHTML=pageProgress();
  else if(v.v==="gloss") m.innerHTML=pageGloss();
  else if(v.v==="teacher") m.innerHTML=pageTeacher();
  else m.innerHTML=pageHome();
}
function setPath(t,path,val){ const st=T(t.id); const [a,b]=path.split("."); st[a]=st[a]||{}; st[a][b]=val; save(); }
const main=$("#main");
main.addEventListener("input",e=>{
  const el=e.target, v=S.view, t=v.v==="theme"?byId(v.id):null;
  if(el.dataset.path&&t){ setPath(t,el.dataset.path,el.value);
    // обновить состояние кнопок без перерисовки
    if(el.dataset.path.startsWith("l2.")||el.dataset.path.startsWith("project.")||el.dataset.path.startsWith("refl.")) refreshButtons(t);
  }
  if(el.dataset.k){ S[el.dataset.k]=el.value; save(); if(el.dataset.k==="gq"){ const pos=el.selectionStart; render(); const g=$("#gq"); g.focus(); g.setSelectionRange(pos,pos);} }
  if(el.dataset.pn){ P(el.dataset.pn).notes=el.value; save(); }
  if(el.dataset.pk&&el.type!=="checkbox"){ S.plan[el.dataset.pk]=el.value; save(); }
  if(el.dataset.curve&&t){ const d=curveData(t); d[el.dataset.curve][+el.dataset.i]=Math.max(0,+el.value||0); save(); $("#curvesvg").innerHTML=curveSVG(d); }
});
function refreshButtons(t){
  const st=T(t.id);
  const b2=main.querySelector('[data-act="l2done"]'); if(b2){ const ok=t.l2check.every((_,i)=>st.l2checks[i])&&t.l2.every((_,i)=>(st.l2[i]||"").trim().length>20); b2.disabled=!ok; }
  const b3=main.querySelector('[data-act="casedone"]'); if(b3){ const ok=COURSE.projectFields.every(f=>(st.project[f.k]||"").trim().length>20)&&COURSE.reflectionFields.every(f=>(st.refl[f.k]||"").trim().length>10)&&st.rate>0&&(!t.final||st.pick); b3.disabled=!ok; }
}
main.addEventListener("change",e=>{
  const el=e.target, v=S.view, t=v.v==="theme"?byId(v.id):null;
  if(el.dataset.check&&t){ T(t.id).l2checks[+el.dataset.check]=el.checked; save(); refreshButtons(t); }
  if(el.dataset.rate&&t){ T(t.id).rate=+el.value; save(); refreshButtons(t); }
  if(el.dataset.pick&&t){ T(t.id).pick=el.value; save(); render(); }
  if(el.dataset.tr){ const st=TRS(el.dataset.tr); st[el.dataset.kind][+el.dataset.i]=el.value; save(); }
  if(el.dataset.sch){ SCS(el.dataset.sch).v[+el.dataset.i]=el.value; save(); }
  if(el.dataset.pq){ const st=P(el.dataset.pq); st.checked[+el.dataset.i]=el.checked; save(); const pc=$("#pqcount"); if(pc){ const p=COURSE.practicum.find(x=>x.id===el.dataset.pq); pc.textContent=`Отмечено: ${st.checked.filter(Boolean).length} из ${p.questions.length}`; } renderNav(); }
  if(el.dataset.pk&&el.type==="checkbox"){ S.plan[el.dataset.pk]=el.checked; save(); }
  if(el.dataset.act==="teacher"){ S.teacher=el.checked; saveNow(); renderNav(); }
});
main.addEventListener("click",e=>{
  const el=e.target.closest("button"); if(!el) return;
  const v=S.view, t=v.v==="theme"?byId(v.id):null;
  if(el.dataset.go){ go(JSON.parse(el.dataset.go)); return; }
  if(el.dataset.tab){ go({v:"theme",id:t.id,tab:el.dataset.tab}); return; }
  if(el.dataset.tabgo){ go({v:"theme",id:t.id,tab:el.dataset.tabgo}); return; }
  if(el.dataset.ptab){ go({v:"prac",id:v.id,tab:el.dataset.ptab}); return; }
  const act=el.dataset.act;
  if(act==="tr-check"){ trainerCheck(el.dataset.key); render(); return; }
  if(act==="tr-reset"){ delete session.trRes[el.dataset.key]; S.tr[el.dataset.key]={m:{},o:{},y:{},best:TRS(el.dataset.key).best}; session.trOrd[el.dataset.key]=null; saveNow(); render(); return; }
  if(act==="sch-check"){ const key=el.dataset.key, sc=COURSE.schemes[el.dataset.sid], st=SCS(key); let s=0; sc.labels.forEach((_,i)=>{ if(String(st.v[i])===String(i)) s++; }); session.schRes[key]={score:s}; st.best=Math.max(st.best||0,s); saveNow(); render(); return; }
  if(act==="sch-reset"){ const key=el.dataset.key; delete session.schRes[key]; S.sch[key]={v:{},best:SCS(key).best}; session.schOrd[key]=null; saveNow(); render(); return; }
  if(act==="submit-prac"){ const p=COURSE.practicum.find(x=>x.id===v.id), ans=collectAnswers(p.test,"pq");
    const un=unanswered(ans); if(un&&needSecondClick(el,"prac-"+p.id,`Без ответа: ${un}. Нажмите «Проверить ответы» ещё раз, чтобы проверить всё равно.`)) return;
    const score=ans.reduce((s,a,qi)=>s+(isCorrect(p.test[qi],a)?1:0),0); const st=P(p.id); st.test.attempts++; st.test.best=Math.max(st.test.best,score); saveNow(); session.pRes[p.id]={ans,score}; render(); return; }
  if(act==="reprac"){ delete session.pRes[v.id]; session.pOrd[v.id]=null; render(); return; }
  if(act==="submit-test"||act==="submit-final"){
    const fin=act==="submit-final", qs=fin?session.final.qs:t.test, name=fin?"f":"q";
    const ans=collectAnswers(qs,name);
    const un=unanswered(ans); if(un&&needSecondClick(el,act+"-"+t.id,`Без ответа: ${un}. Нажмите «Проверить ответы» ещё раз, чтобы проверить всё равно.`)) return;
    const score=ans.reduce((s,a,qi)=>s+(isCorrect(qs[qi],a)?1:0),0);
    const st=T(t.id); st.test.attempts++; st.test.best=Math.max(st.test.best,score); saveNow();
    if(fin) session.finalResult={ans,score}; else session.result[t.id]={ans,score};
    render(); return;
  }
  if(act==="retest"){ delete session.result[t.id]; session.order[t.id]=t.test.map(()=>shuffle([0,1,2,3])); render(); return; }
  if(act==="refinal"){ session.final=null; session.finalResult=null; render(); return; }
  if(act==="l2done"){ T(t.id).l2done=true; saveNow(); render(); return; }
  if(act==="l2undo"){ T(t.id).l2done=false; saveNow(); render(); return; }
  if(act==="casedone"){ T(t.id).caseDone=true; saveNow(); render(); return; }
  if(act==="caseundo"){ T(t.id).caseDone=false; saveNow(); render(); return; }
  if(act==="copy"){ const txt=report(), box=$("#reportbox"); box.style.display="block"; box.value=txt;
    const done=()=>{ $("#copymsg").textContent="Отчёт скопирован. Вставьте его в сообщение преподавателю или в задание на платформе."; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>{ box.select(); try{document.execCommand("copy"); done();}catch(err){ $("#copymsg").textContent="Выделите текст в поле и скопируйте вручную."; } }); }
    else { box.select(); try{document.execCommand("copy"); done();}catch(err){ $("#copymsg").textContent="Выделите текст в поле и скопируйте вручную."; } }
    return; }
  if(act==="download"){ const txt=report(), fname="Отчёт_"+(S.name||"студент").replace(/\s+/g,"_")+".txt", msg=$("#copymsg");
    if(DL){ DL.save({filename:fname,data:txt}).then(()=>{ msg.textContent="Отчёт сохранён."; }).catch(e=>{ msg.textContent= e&&e.code==="declined" ? "Сохранение отменено." : "Сохранить файл здесь не удалось. Скопируйте отчёт кнопкой «Скопировать отчёт»."; }); return; }
    if(window.claude){ const box=$("#reportbox"); box.style.display="block"; box.value=txt; box.select(); msg.textContent="Сохранение файла здесь недоступно. Текст отчёта выделен: скопируйте его и отправьте преподавателю."; return; }
    const blob=new Blob([txt],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); return; }
  if(act==="reset"){ if(needSecondClick(el,"reset","Все ответы курса в этом браузере будут удалены без возможности восстановления. Нажмите кнопку ещё раз, чтобы подтвердить.")) return; S={t:{},view:{v:"home"},tr:{},p:{},plan:{},sch:{}}; saveNow(); render(); return; }
});

// ---------- таймер здоровьесбережения ----------
let elapsed=0, running=true, last20=0, last45=0;
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return `${m}:${String(ss).padStart(2,"0")}`; }
function drawTimer(){ $("#timer").innerHTML=`<span class="lbl">Время занятия</span> <b>${fmt(elapsed)}</b> <button class="btn ghost" style="padding:4px 10px" id="tbtn">${running?"Пауза":"Продолжить"}</button>`; }
document.addEventListener("click",e=>{ if(e.target.id==="tbtn"){ running=!running; drawTimer(); } });
function toast(html,actions){ const box=$("#toastbox"); box.innerHTML=`<div class="toast" role="status">${html}<div class="row">${actions||""}<button class="btn ghost" data-close="1">Понятно</button></div></div>`; }
$("#toastbox").addEventListener("click",e=>{ if(e.target.dataset.close) $("#toastbox").innerHTML=""; if(e.target.dataset.pause){ running=false; drawTimer(); $("#toastbox").innerHTML=""; toast("<p>Двигательная пауза. Встаньте, пройдитесь, сделайте несколько упражнений для спины и шеи. Нажмите «Продолжить» на таймере, когда вернётесь.</p>"); } });
setInterval(()=>{ if(!running||document.hidden) return; elapsed++; 
  if(elapsed-last20>=20*60){ last20=elapsed; toast("<p><b>Правило «20-20-20».</b> Посмотрите 20 секунд на предмет примерно в 6 метрах от вас.</p>"); }
  if(elapsed-last45>=45*60){ last45=elapsed; toast("<p><b>45 минут работы.</b> Сделайте двигательную паузу 5–10 минут.</p>",'<button class="btn" data-pause="1">Начать паузу</button>'); }
  if(elapsed%5===0||elapsed<3) drawTimer(); else $("#timer b")&&($("#timer b").textContent=fmt(elapsed));
},1000);
drawTimer();
render();
window.addEventListener("pagehide",saveNow);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveNow(); });
})();
</script>
</body>
</html>
