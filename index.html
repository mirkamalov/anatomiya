{"q": "Elektroensefalogrammaning alfa- va beta-ritmi çastotasi mos ravişda:", "a": ["0,5–3 va 4–7 Gs", "8–13 va 14–35 Gs", "4–7 va 0,5–3 Gs", "14–35 va 8–13 Gs"], "c": 1, "e": "Alfa-ritm közlar yumilgan holda xotirjam bedorlik holatida qayd etiladi."}, {"q": "Kiprikli muşak va köz qoraçiğini toraytiruvçi muşakni qaysi nerv innervatsiya qiladi?", "a": ["Köruv nervi", "Uzoqlaştiruvçi nerv", "Közni harakatlantiruvçi nerv", "Ğaltak nervi"], "c": 2, "e": "Bu közni harakatlantiruvçi nervning (III juft) parasimpatik tolalari."}, {"q": "Himoya reflekslari (yötal, aksiriş, qusiş) markazlari qayerda joylaşgan?", "a": ["Orqa miyada", "Uzunçoq miyada", "Örta miyada", "Miyaçada"], "c": 1, "e": "Uzunçoq miyada nafas va tomir harakatlantiruvçi markazlar ham joylaşgan."}, {"q": "Köz yoşi, jağ osti va til osti bezlarini qaysi nerv innervatsiya qiladi?", "a": ["Til-halqum nervi", "Adaşgan nerv", "Yuz nervi", "Til osti nervi"], "c": 2, "e": "Quloq oldi bezini til-halqum nervi innervatsiya qiladi."}, {"q": "Vegetativ nerv tizimi nimani taʼminlaydi?", "a": ["Taʼsirlanişlarni idrok etişni", "Skelet muşaklarining qisqarişini", "Içki organlar funksiyalarini boşqariş, moslaşuv va trofikani", "Oliy nerv faoliyatini"], "c": 2, "e": "Skelet muşaklarini somatik nerv tizimi innervatsiya qiladi."}, {"q": "Har bir simpatik ustundagi tugunlar soni", "a": ["10–15", "15–20", "20–25", "25–30"], "c": 2, "e": "Simpatik ustunlar umurtqa poğonasining yon tomonlarida yotadi."}, {"q": "Parasimpatik tolalar qaysi nervlar tarkibida ötadi?", "a": ["Boş miya nervlarining I, II, V, VI juftlari", "Boş miya nervlarining III, VII, IX, X juftlari va çanoq içki aʼzolari nervlari", "Boş miya nervlarining II, V, VIII, XI juftlari", "Boş miya nervlarining IV, V, VI, VIII juftlari"], "c": 1, "e": "Parasimpatik qism kranial va dumğaza bölimlariga ega."}, {"q": "Içki organlar devoridagi mikroganglionar tuzilmalar majmuasi qanday ataladi?", "a": ["Simpatik nerv tizimi", "Metasimpatik nerv tizimi", "Parasimpatik nerv tizimi", "Somatik nerv tizimi"], "c": 1, "e": "Metasimpatik tizim özining motor faolligiga ega."}]}, {"id": "p9", "title": "Analizatorlar", "schemes": ["eye", "ear"], "questions": ["I.P. Pavlov böyiça analizator qanday bölimlardan iborat?", "Terining tuzilişini tasvirlang.", "Köriş analizatorining tuzilişini tasvirlang.", "Eşitiş analizatorining tuzilişini tasvirlang.", "Vestibulyar analizatorning tuzilişini tasvirlang.", "Hid biliş va taʼm biliş analizatorlarini tasvirlang."], "test": [{"q": "I.P. Pavlov böyiça analizator qaysi bölimni öz içiga olmaydi?", "a": ["Periferik (retseptor) bölim", "Ötkazuvçi bölim", "Markaziy (pöstloq) bölim", "Visseral bölim"], "c": 3, "e": "Analizator retseptor, ötkazuvçi va pöstloq bölimlaridan iborat."}, {"q": "Taʼsirlovçi bilan aloqasi va tuzilişiga köra retseptorlar qanday böladi? (ikki javob)", "a": ["Distant va kontakt", "Birlamçi va ikkilamçi", "Faqat termoretseptorlar", "Faqat mexanoretseptorlar"], "c": [0, 1], "e": "Termoretseptorlar va mexanoretseptorlar taʼsirlovçi turiga köra ajratiladi."}, {"q": "Epidermisning muguzlaniş zonasiga kirmaydi (ikki javob):", "a": ["Yaltiroq qavat", "Donador qavat", "Tikanli qavat", "Bazal qavat"], "c": [2, 3], "e": "Bazal va tikanli qavatlar ösiş zonasini hosil qiladi."}, {"q": "Derma qavatlari (ikki javob):", "a": ["Yaltiroq", "Sörğiçli", "Törsimon", "Muguz"], "c": [1, 2], "e": "Yaltiroq va muguz qavatlar — epidermis qavatlari."}, {"q": "Tör parda fotoretseptorlari — tayoqçalar va kolbaçalar soni:", "a": ["Taxminan 130 mln va 6–7 mln", "50 mln va 10 mln", "20 mln va 5 mln", "110 mln va 20 mln"], "c": 0, "e": "Kolbaçalar markaziy çuqurçada, tayoqçalar esa periferiyada töplangan."}, {"q": "Köz yoşining bakteritsid moddasi:", "a": ["Mutsin", "Ptialin", "Amilaza", "Lizotsim"], "c": 3, "e": "Lizotsim bakteriyalarning hujayra devorini yemiradi."}]}, {"id": "p10", "title": "Endokrin tizim", "questions": ["Endokrin bezlar tuzilişining umumiy xususiyatlarini ayting.", "Gipofizning tuzilişi, joylaşuvi va gormonlarini tasvirlang.", "Epifizning tuzilişini tasvirlang.", "Qalqonsimon va qalqonsimon oldi bezlarining tuzilişini tasvirlang.", "Buyrak usti bezlarining tuzilişi va gormonlarini tasvirlang.", "Qaysi bezlar aralaş sekretsiya bezlariga kiradi?"], "test": [{"q": "Kimyoviy tabiatiga köra gormonlar qaysi guruhga kirmaydi?", "a": ["Oqsillar va peptidlar", "Aminokislotalar hosilalari", "Steroidlar", "Uglevodlar"], "c": 3, "e": "Steroid gormonlar — jinsiy gormonlar va buyrak usti bezi pöstloği gormonlari."}, {"q": "Epifizning hujayra elementlari (ikki javob)", "a": ["Pinealotsitlar", "Pituitsitlar", "Paratirotsitlar", "Gliotsitlar"], "c": [0, 3], "e": "Pituitsitlar — gipofiz orqa bölagining, paratirotsitlar esa qalqonsimon oldi bezlarining hujayralari."}, {"q": "Qalqonsimon bezning massasi va joylaşuvi:", "a": ["1 g; ponasimon suyakning turk egari", "20–40 g; böyinning oldingi sohasi, hiqildoq va traxeya boşlanişi sathida", "10 g; kökrak böşliği, töş suyagi dastasi orqasida", "15 g; böyin, III–V böyin umurtqalari sathida"], "c": 1, "e": "Turk egarida gipofiz, töş suyagi orqasida esa timus joylaşgan."}, {"q": "Buyrak usti bezi pöstloğining zonasi hisoblanmaydi:", "a": ["Koptokçali", "Tutamli", "Follikul böşliği", "Törsimon"], "c": 2, "e": "Follikullar qalqonsimon bez uçun xos."}, {"q": "Buyrak usti bezining mağiz moddasida nimalar bor? (ikki javob)", "a": ["Epinefrotsitlar", "Nefronlar", "Norepinefrotsitlar", "Gassal tanaçalari"], "c": [0, 2], "e": "Ular adrenalin va noradrenalin işlab çiqaradi; Gassal tanaçalari esa timusda böladi."}, {"q": "Buyrak gormonlari (ikki javob)", "a": ["Adrenalin", "Testosteron", "Renin", "Eritropoetin"], "c": [2, 3], "e": "Renin bosimni, eritropoetin esa qon hosil bölişini boşqarişda iştirok etadi."}, {"q": "Gipotalamusning liberinlari va statinlari gipofizning oldingi bölagiga qanday yöl bilan tuşadi?", "a": ["Aksonlar orqali", "Dendritlar orqali", "Miyelin qobiq orqali", "Gipofiz portal tizimi tomirlari orqali"], "c": 3, "e": "Orqa bölakka gipotalamus gormonlari aksonlar orqali tuşadi."}, {"q": "Epitalamusda nima joylaşgan?", "a": ["Timus", "Qarağaysimon tana (epifiz)", "Gipofiz", "Sörğiçsimon tanaçalar"], "c": 1, "e": "Gipofiz va sörğiçsimon tanaçalar gipotalamusga kiradi."}]}], "techniques": [["Ortiqçasini top", "Tuşunçalar röyxatidan ortiqçasini tanlang va tanlaş tamoyilini tuşuntiring.", "Bolğaça, sandon, uzangi, çiğanoq."], ["Mazmuniy proporsiya", "Munosabatning yetişmayotgan aʼzosini tiklang.", "Neyron : nerv töqimasi = osteon : ? (suyakning ziç moddasi)."], ["Ikki nomaʼlumli mazmuniy tenglama", "Tasdiq töğri bölişi uçun böş joylarni töldiring.", "___ – eşitiş retseptorlari, ___ esa köriş retseptorlari (tukli hujayralar; tayoqçalar va kolbaçalar)."], ["Sonlar maʼnosini tikla", "Har bir son mavzu doirasida nimani anglatişini tuşuntiring.", "33–34, 12, 7, 56–70 dB, 1,0."], ["Raqamli diktant", "Har bir tasdiqqa 1 (ha) yoki 0 (yöq) deb javob bering, söng darhol tekşiring va xatolarni tahlil qiling.", "«Eşitiş suyakçalari içki quloqda joylaşgan» – 0."], ["Mazmuniy xatoni top", "Öquv matnidagi xatoni toping va tuzating.", "«Osteoklastlar suyak töqimasini quradi» – uni osteoblastlar quradi, osteoklastlar esa yemiradi."], ["Bir söz bilan ayt", "Bir neçta tuşunçani bitta atama bilan umumlaştiring.", "Şox parda, gavhar, şişasimon tana – közning nur sindiruvçi muhitlari."], ["Ilmiy tildan tuşunarli tilga", "Ilmiy taʼrifni bolaning ota-onasi tuşunadigan qilib oddiy sözlar bilan qayta sözlab bering.", "Sensonevral quloq oğirligi: «çiğanoqda tovuşni miya uçun signalga aylantiradigan hujayralar şikastlangan»."], ["Sinkveyn", "Beş qatorli şeʼr tuzing: tuşunça; ikki sifat; uç feʼl; ibora; sinonim-xulosa.", "Miyaça / qadimiy, muvofiqlaştiruvçi / moslaştiradi, aniqlaştiradi, uşlab turadi / usiz yuriş beqaror / muvozanat."], ["Intellekt-xarita", "Mavzu tuşunçasini varaq markaziga joylaştiring va şoxlarini yoying: tuziliş, funksiya, buziliş, korreksiya, profilaktika. Söng xaritani kursdoşingizga «öqib» bering.", "Markazda – «Nutq apparati»."], ["Matnni çizmaga aylantir", "Darslik paragrafini jadval yoki çizmaga aylantiring va xulosa çiqaring.", "Tovuşning quloq suprasidan pöstloqqaça bölgan yöli zanjir körinişida."], ["Kursdoşingga topşiriq tuz", "Mavzu böyiça test, topişmoq yoki masala öylab toping, uni kursdoşingizga taklif qiling, tekşiring va xatolarni tuşuntiring.", "Talabalar uçun miyaça haqida yoki bola uçun burun haqida topişmoq."]], "techniquesSource": "Katalog N.L. Galeevaning «Сто приёмов учебного успеха ученика на уроках биологии» (М.: 5 за знания, 2006) qöllanmasi asosida tuzilgan; misollar kurs materialiga moslab tanlangan.", "planner": {"source": "Bölim N.V. Tamarskaya va I.O. Semyonovaning «Старшекласснику - будущему педагогу об управлении» (Калининград, 2003) öquv qöllanmasi va iş daftaridagi özini özi boşqariş topşiriqlari asosida tayyorlangan.", "goals": ["Haftalik 1-maqsad", "Haftalik 2-maqsad", "Haftalik 3-maqsad"], "days": ["Duşanba", "Seşanba", "Çorşanba", "Payşanba", "Juma", "Şanba", "Yakşanba"], "errors": ["Işni oxirgi keçaga qoldiraman", "Bir soatdan ortiq tanaffussiz işlayman", "Telefon va bildirişnomalarga çalğiyman", "Nimadan boşlaşni rejalaştirmayman", "Hammasini birdaniga boşlayman va heç birini oxiriga yetkazmayman", "Materialni örgangaç özimni tekşirmayman", "Keç yotaman va uyqum töymaydi"]}};
const PED_GLOSSARY_UZ = [["Biliş faoliyatini faollaştiriş", "taʼlim oluvçi biliş faoliyatining içki tuzilmasini şakllantiriş va uning kasbiy-refleksiv salohiyatini yoyişning pedagogik jihatdan loyihalanadigan jarayoni; bilişning taşqi boşqariladigan şakllaridan içki boşqariladigan şakllariga, reproduktiv darajalardan produktiv va ijodiy darajalarga ötiş."], ["Harakatning darajalangan möljal asosi", "talabaga beriladigan möljal çizmasining töliqligi özgaruvçan kattalik bölib, uning fan sohasidagi tayyorgarligi ortib borişi bilan kamayib boradi, degan tamoyil: yangi boşlovçi uçun töliq çizmadan ijodiy darajada çizmani mustaqil tuzişgaça."], ["Defektologning salomatlikni saqlaş kompetensiyasi", "defektolog kasbiy portretining uç ölçamli tuzilişga ega mustaqil tarkibiy qismi: mutaxassisning şaxsiy salomatligi; salomatlikni saqlovçi korreksion işni bola bilan loyihalaş; bola va uning oilasida soğlom turmuş tarzi könikmalarini şakllantiriş."], ["Korreksion-biliş keysi", "bölajak defektolog mustaqil taʼlimining mualliflik didaktik birligi bölib, bitta öquv vaziyatida anatomik-fiziologik meʼyor, individual-tipologik portret, loyihaviy harakat va kasbiy refleksiyani birlaştiradi; raqamlaştiriş şaroitida defektolog tayyorlaşning yetakçi metodik birligi."], ["Fanlararo integratsiya", "öquv fanlari mazmunini yagona predmet maydoniga boğlaşni va taʼlim oluvçida yaxlit kasbiy tafakkurni şakllantirişni taʼminlovçi didaktik mexanizm; fan içidagi, fanlararo, metapredmet va kasbiy-integrativ aloqalar farqlanadi."], ["Biliş faoliyati", "yangi bilimni özlaştiriş, uni tizimlaştiriş va turli öquv hamda kasbiy vaziyatlarda qöllaşga yönaltirilgan subyektning murakkab integrativ faoliyati; tuzilişi: ehtiyoj — motiv — vazifa — vositalar — harakatlar — operatsiyalar."], ["Öz-özini öqitiş", "biror masala yoki muammoni mutaxassis bilan vaqti-vaqti bilan maslahatlaşib yoki maslahatsiz mustaqil örganişga asoslangan tizimli öquv faoliyati; uzluksiz taʼlim tizimida taʼlim bosqiçlari va poğonalari örtasida boğlovçi böğin vazifasini bajaradi."], ["Mustaqil iş", "mohiyati öquvçining mustaqil biliş faoliyatidan iborat bölgan taʼlimni taşkil etiş şakli; faol öz-özini öqitiş işiga tayyorlaşning eng muhim vositalaridan biri; dars davomida ham, darsdan taşqari vaqtda ham amalga oşiriladi."], ["Mustaqil taʼlim", "nazorat lokusi asta-sekin öqituvçidan taʼlim oluvçiga ötib boradigan, pedagogik jihatdan loyihalanadigan va kuzatib boriladigan jarayon; mustaqil iş (öqituvçi boşqaradigan) va öz-özini öqitiş (avtonom motivlaşgan faoliyat) örtasida oraliq örinni egallaydi."], ["Skaffolding", "taʼlim oluvçiga uning joriy imkoniyatlaridan yuqori bölgan masalalarni yeçişda beriladigan va tayyorgarligi ortib borişi bilan asta-sekin olib taşlanadigan vaqtinçalik qöllab-quvvatlovçi tuzilmalar tizimi (möljal çizmalari, yeçim bosqiçlari, öz-özini tekşiriş mezonlari, yönaltiruvçi savollar) (sönib boruvçi rahbarlik tamoyili)."], ["Telerefleksiya", "kasbiy taʼlimni raqamlaştiriş şaroitida refleksiv amaliyotni sifat jihatidan özgartiriş vositasi sifatida faoliyatni raqamli videoqayd etiş va keyinçalik uni mustaqil hamda özaro tahlil qiliş (Ye. L. Kutseyeva, 2021)."], ["Boşqariladigan mustaqillik", "öz-özini öqitişni taşkil etiş xususiyati bölib, unda talabaga beriladigan avtonomiya tayyorgarligi ortib borişi bilan kengayib boruvçi özgaruvçan kattalikdir; mustaqillik şart sifatida emas, balki taʼlim natijasi sifatida qaraladi."], ["Raqamli gigiyena", "raqamli qurilmalar va axborot muhiti bilan özaro taʼsirni boşqarişning kasbiy ahamiyatli könikmalari majmui: ergonomika, körişni himoya qiliş, gipodinamiyaning oldini oliş, axborot gigiyenasi, ruhiy-hissiy gigiyena."], ["Raqamli taʼlim muhiti", "törtta funksional qatlam — kontent, kommunikativ, loyihaviy va diagnostik-baholaş qatlamlarini foydalanuvçining yagona autentifikatsiyasi bilan yagona muhitga birlaştiruvçi, taʼlim jarayonining pedagogik jihatdan loyihalangan raqamli infratuzilmasi."], ["Ekspertlikning teskari effekti", "kognitiv yuklama nazariyasi qonuniyati: yangi boşlovçining natijadorligini oşiradigan batafsil rahbarlik usullari tayyorgarligi yuqori taʼlim oluvçi uçun ortiqça kognitiv yuklamaga aylanadi va uning öqiş samaradorligini pasaytiradi."]];

// ---------- инструмент: кривая работоспособности ----------
function curveData(t){ const st=T(t.id); if(!st.curve) st.curve={v:[42,48,46,31,24],e:[1,1,2,6,9]}; return st.curve; }
function curveTool(t){
  const d=curveData(t);
  let rows=`<tr><th>${ui("Интервал (3 мин)")}</th>${d.v.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr>`;
  rows+=`<tr><td>${ui("Просмотрено знаков")}</td>${d.v.map((x,i)=>`<td><input type="number" min="0" data-curve="v" data-i="${i}" value="${x}" aria-label="${ui("Объём, интервал")} ${i+1}"></td>`).join("")}</tr>`;
  rows+=`<tr><td>${ui("Ошибок")}</td>${d.e.map((x,i)=>`<td><input type="number" min="0" data-curve="e" data-i="${i}" value="${x}" aria-label="${ui("Ошибки, интервал")} ${i+1}"></td>`).join("")}</tr>`;
  return `<div class="block curve"><h3>${ui("Инструмент: кривая работоспособности")}</h3><p class="small">${ui("Введите результаты корректурной пробы по интервалам. График обновляется сразу. Интерпретацию сделайте сами в задании второго уровня.")}</p><div class="scroll"><table>${rows}</table></div><div id="curvesvg">${curveSVG(d)}</div></div>`;
}
function curveSVG(d){
  const W=600,H=260,pl=48,pr=48,pt=16,pb=40,n=d.v.length;
  const maxV=Math.max(10,...d.v.map(Number)), maxE=Math.max(5,...d.e.map(Number));
  const x=i=>pl+(W-pl-pr)*(n===1?0:i/(n-1)), yv=v=>pt+(H-pt-pb)*(1-v/maxV), ye=v=>pt+(H-pt-pb)*(1-v/maxE);
  const pv=d.v.map((v,i)=>`${x(i)},${yv(+v)}`).join(" "), pe=d.e.map((v,i)=>`${x(i)},${ye(+v)}`).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ui("Кривая работоспособности: объём и ошибки по интервалам")}">`;
  s+=`<line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--line)"/>`;
  d.v.forEach((_,i)=>{ s+=`<text x="${x(i)}" y="${H-pb+22}" font-size="13" text-anchor="middle" fill="var(--muted)">${i+1}</text>`; });
  s+=`<text x="${pl-8}" y="${pt+10}" font-size="12" text-anchor="end" fill="var(--l1)">${maxV}</text><text x="${W-pr+8}" y="${pt+10}" font-size="12" fill="var(--l3)">${maxE}</text>`;
  s+=`<polyline points="${pv}" fill="none" stroke="var(--l1)" stroke-width="3"/><polyline points="${pe}" fill="none" stroke="var(--l3)" stroke-width="3" stroke-dasharray="6 5"/>`;
  d.v.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${yv(+v)}" r="4.5" fill="var(--l1)"/><circle cx="${x(i)}" cy="${ye(+d.e[i])}" r="4" fill="var(--l3)"/>`; });
  s+=`<text x="${(W)/2}" y="${H-4}" font-size="13" text-anchor="middle" fill="var(--muted)">${ui("Интервалы по 3 минуты")}</text></svg>`;
  s+=`<p class="small"><span style="color:var(--l1);font-weight:700">${ui("Сплошная линия")}</span> — ${ui("объём работы,")} <span style="color:var(--l3);font-weight:700">${ui("пунктир")}</span> — ${ui("ошибки (отдельная шкала справа).")}</p>`;
  return s;
}
// ---------- тест ----------
const session={order:{},result:{},final:null,finalResult:null};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sameSet(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }
function isCorrect(q,ans){ return Array.isArray(q.c) ? sameSet(ans||[],q.c) : ans===q.c; }
function qBlock(q,qi,ord,res,name){
  const multi=Array.isArray(q.c);
  const chosen=oi=> res ? (multi ? (res.ans[qi]||[]).includes(oi) : res.ans[qi]===oi) : false;
  const right=oi=> multi ? q.c.includes(oi) : oi===q.c;
  return `<div class="q"><fieldset><legend>${qi+1}. ${esc(q.q)}</legend>`+ord.map(oi=>{
    let cls=""; if(res){ if(right(oi)) cls="right"; else if(chosen(oi)) cls="wrong"; }
    return `<label class="opt ${cls}"><input type="${multi?"checkbox":"radio"}" name="${name}${qi}" value="${oi}" ${chosen(oi)?"checked":""} ${res?"disabled":""}><span>${esc(q.a[oi])}</span></label>`;
  }).join("")+(res?`<p class="expl">${isCorrect(q,res.ans[qi])?'<b class="ok">'+ui("Верно.")+'</b>':'<b>'+ui("Неверно.")+'</b>'} ${esc(q.e)}</p>`:"")+`</fieldset></div>`;
}
function collectAnswers(qs,name){ return qs.map((q,qi)=>{ if(Array.isArray(q.c)) return [...main.querySelectorAll(`input[name="${name}${qi}"]:checked`)].map(x=>+x.value); const c=main.querySelector(`input[name="${name}${qi}"]:checked`); return c?+c.value:-1; }); }
function tabTest(t){
  const st=T(t.id);
  if(!session.order[t.id]) session.order[t.id]=t.test.map(q=>shuffle([0,1,2,3]));
  const res=session.result[t.id];
  let h=`<div class="block l1"><span class="lvtag">${ui("Первый уровень")}</span><h3>${ui("Тест по нормативу темы")}</h3><p class="small meta">${ui("Лучший результат:")} ${st.test.best} ${ui("из")} ${t.test.length}. ${ui("Попыток:")} ${st.test.attempts}. ${ui("Порог для второго уровня:")} ${PASS} ${ui("из")} ${t.test.length}.</p>`;
  h+=t.test.map((q,qi)=>qBlock(q,qi,session.order[t.id][qi],res,"q")).join("");
  if(res){ h+=`<p class="score">${res.score} ${ui("из")} ${t.test.length}. ${res.score>=PASS?'<span class="ok">'+ui("Второй уровень открыт.")+'</span>':ui("Повторите норматив и пройдите тест ещё раз.")}</p><div class="row"><button class="btn ghost" data-act="retest">${ui("Пройти тест заново")}</button>${res.score>=PASS?'<button class="btn" data-tabgo="tasks">'+ui("Перейти к заданиям")+'</button>':'<button class="btn" data-tabgo="norm">'+ui("Вернуться к нормативу")+'</button>'}</div>`; }
  else h+=`<p class="mt"><button class="btn" data-act="submit-test">${ui("Проверить ответы")}</button></p>`;
  return h+`</div>`;
}
function bank(){ const b=[]; themes.filter(t=>!t.final).forEach(t=>t.test.forEach(q=>b.push(q))); return b; }
function tabFinalTest(t){
  const st=T(t.id);
  if(!session.final){ const qs=shuffle(bank()).slice(0,FINAL_N); session.final={qs, ord:qs.map(()=>shuffle([0,1,2,3]))}; }
  const F=session.final, res=session.finalResult;

  h+=F.qs.map((q,qi)=>qBlock(q,qi,F.ord[qi],res,"f")).join("");
  if(res) h+=`<p class="score">${res.score} ${ui("из")} ${FINAL_N}. ${res.score>=FINAL_PASS?'<span class="ok">'+ui("Итоговый тест сдан.")+'</span>':ui("Порог не достигнут: повторите темы, в которых были ошибки.")}</p><button class="btn ghost" data-act="refinal">${ui("Новый набор вопросов")}</button>`;
  else h+=`<p class="mt"><button class="btn" data-act="submit-final">${ui("Проверить ответы")}</button></p>`;
  return h+`</div>`;
}

function report(){
  const L=[]; const d=new Date();
  L.push(ui("Электронный курс «Анатомия и физиология» для будущих дефектологов — отчёт студента"));
  L.push(ui("Студент:")+" "+(S.name||ui("не указано"))+(S.group?", "+ui("группа")+" "+S.group:"")); L.push(ui("Дата:")+" "+d.toLocaleDateString(LANG==="uz"?"uz-UZ":"ru-RU")); L.push("");
  themes.forEach((t,i)=>{ const st=T(t.id);
    L.push("=".repeat(60)); L.push(`${ui("Тема")} ${i+1}. ${t.title}`);
    L.push(`${ui("Тест:")} ${st.test.attempts?`${ui("лучший результат")} ${st.test.best} ${ui("из")} ${t.final?FINAL_N:t.test.length}, ${ui("попыток")} ${st.test.attempts}`:ui("не проходился")}`);
    L.push(`${ui("Уровень 2:")} ${st.l2done?ui("выполнен"):ui("не выполнен")}; ${ui("кейс:")} ${st.caseDone?ui("выполнен"):ui("не выполнен")}`);
    const add=(title,val)=>{ if((val||"").trim()) { L.push(""); L.push("— "+title); L.push(val.trim()); } };
    t.l1.forEach((x,j)=>add(`${ui("Уровень 1, задание")} ${j+1}: ${x}`,st.l1[j]));
    t.l2.forEach((x,j)=>add(`${ui("Уровень 2, задание")} ${j+1}: ${x}`,st.l2[j]));
    if(t.final&&st.pick) { L.push(""); L.push("— "+ui("Выбранный ребёнок:")+" "+byId(st.pick).kase.title); }
    t.kase.norm.forEach((x,j)=>add(`${ui("Кейс, норматив")} ${j+1}: ${x}`,st.norm[j]));
    COURSE.projectFields.forEach(f=>add(ui("Кейс, проект:")+" "+f.label,st.project[f.k]));
    COURSE.reflectionFields.forEach(f=>add(ui("Рефлексия:")+" "+f.label,st.refl[f.k]));
    if(st.rate){ L.push(""); L.push("— "+ui("Самооценка готовности:")+" "+st.rate+" "+ui("из 5")); }
    COURSE.diaryFields.forEach(f=>add(ui("Дневник:")+" "+f.label,st.diary[f.k]));
    if(t.trainer&&S.tr[t.id]&&S.tr[t.id].best!=null){ L.push(""); L.push(`— ${ui("Тренажёр: лучший результат")} ${S.tr[t.id].best} ${ui("из")} ${trTotal(t.trainer)}`); }
    (t.schemes||[]).forEach(sid=>{ const s=S.sch[t.id+"-"+sid]; if(s&&s.best!=null){ L.push(`— ${ui("Немая схема «")}${COURSE.schemes[sid].title}»: ${s.best} ${ui("из")} ${COURSE.schemes[sid].labels.length}`); } });
    if(t.tool==="curve"&&st.curve){ L.push(""); L.push("— "+ui("Кривая работоспособности: объём")+" "+st.curve.v.join(", ")+"; "+ui("ошибки")+" "+st.curve.e.join(", ")); }
    L.push("");
  });
  L.push("=".repeat(60)); L.push(ui("Опорный практикум по анатомии"));
  COURSE.practicum.forEach((p,i)=>{ const st=P(p.id); const sch=(p.schemes||[]).map(sid=>{ const s=S.sch[p.id+"-"+sid]; return s&&s.best!=null?`${COURSE.schemes[sid].title}: ${s.best}/${COURSE.schemes[sid].labels.length}`:null; }).filter(Boolean);
    L.push(`${i+1}. ${p.title}: ${ui("вопросы")} ${st.checked.filter(Boolean).length}/${p.questions.length}; ${ui("тест")} ${st.test.attempts?`${st.test.best}/${p.test.length}, ${ui("попыток")} ${st.test.attempts}`:ui("не проходился")}${p.trainer?`; ${ui("тренажёр")} ${S.tr[p.id]&&S.tr[p.id].best!=null?`${S.tr[p.id].best}/${trTotal(p.trainer)}`:ui("не выполнялся")}`:""}${sch.length?"; "+ui("схемы:")+" "+sch.join("; "):""}`);
    if((st.notes||"").trim()) L.push("   "+ui("Заметки:")+" "+st.notes.trim()); });
  const pl=S.plan, PL=COURSE.planner;
  if(Object.keys(pl).some(k=>pl[k])){ L.push(""); L.push("=".repeat(60)); L.push(ui("Планировщик недели"));
    PL.goals.forEach((g,i)=>{ if((pl["goal"+i]||"").trim()) L.push(`${g}: ${pl["goal"+i].trim()}`); });
    PL.days.forEach((d,i)=>{ if((pl["day"+i]||"").trim()) L.push(`${d}: ${pl["day"+i].trim()}`); });
    const errs=PL.errors.filter((e,i)=>pl["err"+i]); if(errs.length) L.push(ui("Отмеченные ошибки самоорганизации:")+" "+errs.join("; "));
    if((pl.fix||"").trim()) L.push(ui("Что изменю:")+" "+pl.fix.trim());
    if((pl.deal||"").trim()) L.push(ui("Договор с собой:")+" "+pl.deal.trim()); }
  return L.join("\n");
}

// ---------- подтверждение без всплывающих окон ----------
function needSecondClick(el,key,text){ session.confirm=session.confirm||{}; if(session.confirm[key]){ session.confirm[key]=false; return false; }
  session.confirm[key]=true; let w=el.parentNode.querySelector(".warn"); if(!w){ w=document.createElement("p"); w.className="warn small"; el.insertAdjacentElement("afterend",w); } w.textContent=text; return true; }
const unanswered=ans=>ans.filter(a=>a===-1||(Array.isArray(a)&&a.length===0)).length;
// ---------- тренажёры ----------
function TRS(key){ return S.tr[key]||(S.tr[key]={m:{},o:{},y:{},best:null}); }
function trTotal(tr){ return (tr.match||[]).length+(tr.odd||[]).length+(tr.yesno||[]).length; }
function trainerFor(key){ const t=byId(key); if(t&&t.trainer) return t.trainer; const p=COURSE.practicum.find(x=>x.id===key); return p?p.trainer:null; }
function trainerHTML(key,tr){
  const st=TRS(key); session.trOrd=session.trOrd||{}; session.trRes=session.trRes||{};
  if(!session.trOrd[key]) session.trOrd[key]=tr.match?shuffle(tr.match.map((_,i)=>i)):[];
  const ord=session.trOrd[key], res=session.trRes[key];
  let h=`<div class="trainer">`;
  if(tr.match){ h+=`<h4>${ui("Соотнесите понятие и определение")}</h4>`+tr.match.map((p,i)=>{ const v=st.m[i]; const ok=String(v)===String(i);
    return `<div class="trrow ${res?(ok?"right":"wrong"):""}"><span class="trterm"><b>${esc(p[0])}</b></span><select data-tr="${key}" data-kind="m" data-i="${i}" aria-label="${ui("Определение для:")} ${esc(p[0])}" ${res?"disabled":""}><option value="">— ${ui("выберите —")}</option>${ord.map(j=>`<option value="${j}" ${String(v)===String(j)?"selected":""}>${esc(tr.match[j][1])}</option>`).join("")}</select>${res&&!ok?`<span class="trfix">${ui("Верно:")} ${esc(p[1])}</span>`:""}</div>`; }).join(""); }
  if(tr.odd){ h+=`<h4>${ui("Найдите лишнее")}</h4>`+tr.odd.map((o,i)=>{ const v=st.o[i]; const ok=v!==undefined&&v!==""&&Number(v)===o.odd;
    return `<div class="trrow ${res?(ok?"right":"wrong"):""}"><fieldset><legend class="sr">${ui("Набор")} ${i+1}</legend>${o.items.map((it,j)=>`<label class="trchip"><input type="radio" name="odd-${key}-${i}" data-tr="${key}" data-kind="o" data-i="${i}" value="${j}" ${v!==undefined&&v!==""&&Number(v)===j?"checked":""} ${res?"disabled":""}> ${esc(it)}</label>`).join("")}</fieldset>${res?`<span class="trfix">${ok?ui("Верно."):ui("Неверно.")} ${esc(o.why)}</span>`:""}</div>`; }).join(""); }
  if(tr.yesno){ h+=`<h4>${ui("Верно или неверно?")}</h4>`+tr.yesno.map((y,i)=>{ const v=st.y[i]; const ok=v===(y[1]?"1":"0");
    return `<div class="trrow ${res?(ok?"right":"wrong"):""}"><span class="trterm">${esc(y[0])}</span><span>${["1","0"].map(val=>`<label class="trchip"><input type="radio" name="yn-${key}-${i}" data-tr="${key}" data-kind="y" data-i="${i}" value="${val}" ${v===val?"checked":""} ${res?"disabled":""}> ${val==="1"?ui("Верно"):ui("Неверно")}</label>`).join("")}</span>${res&&!ok?`<span class="trfix">${ui("Правильный ответ:")} ${y[1]?ui("верно"):ui("неверно")}.</span>`:""}</div>`; }).join(""); }
  const total=trTotal(tr);
  h+= res ? `<p class="score">${res.score} ${ui("из")} ${total}</p><button class="btn ghost" data-act="tr-reset" data-key="${key}">${ui("Пройти заново")}</button>`
          : `<p class="mt"><button class="btn" data-act="tr-check" data-key="${key}">${ui("Проверить")}</button> ${st.best!=null?`<span class="small meta">${ui("Лучший результат:")} ${st.best} ${ui("из")} ${total}</span>`:""}</p>`;
  return h+`</div>`;
}
function trainerCheck(key){ const tr=trainerFor(key), st=TRS(key); let s=0;
  (tr.match||[]).forEach((p,i)=>{ if(String(st.m[i])===String(i)) s++; });
  (tr.odd||[]).forEach((o,i)=>{ if(st.o[i]!==undefined&&st.o[i]!==""&&Number(st.o[i])===o.odd) s++; });
  (tr.yesno||[]).forEach((y,i)=>{ if(st.y[i]===(y[1]?"1":"0")) s++; });
  session.trRes[key]={score:s}; st.best=Math.max(st.best||0,s); saveNow(); }
// ---------- немые схемы ----------
function SCS(key){ return S.sch[key]||(S.sch[key]={v:{},best:null}); }
function schemeHTML(key,sid){
  const sc=COURSE.schemes[sid], st=SCS(key); session.schOrd=session.schOrd||{}; session.schRes=session.schRes||{};
  if(!session.schOrd[key]) session.schOrd[key]=shuffle(sc.labels.map((_,i)=>i));
  const ord=session.schOrd[key], res=session.schRes[key];
  let h=`<div class="block"><h3>${ui("Подпишите немую схему:")} ${esc(sc.title)}</h3><div class="schemewrap">${sc.svg}</div><div class="schemegrid">`;
  h+=sc.labels.map((l,i)=>{ const v=st.v[i]; const ok=String(v)===String(i);
    return `<div class="trrow ${res?(ok?"right":"wrong"):""}"><span class="num">${i+1}</span><select data-sch="${key}" data-i="${i}" aria-label="${ui("Подпись к цифре")} ${i+1}" ${res?"disabled":""}><option value="">— ${ui("выберите —")}</option>${ord.map(j=>`<option value="${j}" ${String(v)===String(j)?"selected":""}>${esc(sc.labels[j])}</option>`).join("")}</select>${res&&!ok?`<span class="trfix">${ui("Верно:")} ${esc(l)}</span>`:""}</div>`; }).join("");
  h+=`</div>`+(res ? `<p class="score">${res.score} ${ui("из")} ${sc.labels.length}</p><button class="btn ghost" data-act="sch-reset" data-key="${key}">${ui("Пройти заново")}</button>`
                   : `<p class="mt"><button class="btn" data-act="sch-check" data-key="${key}" data-sid="${sid}">${ui("Проверить подписи")}</button> ${st.best!=null?`<span class="small meta">${ui("Лучший результат:")} ${st.best} ${ui("из")} ${sc.labels.length}</span>`:""}</p>`);
  return h+`</div>`;
}
// ---------- опорный практикум ----------
function P(id){ return S.p[id]||(S.p[id]={checked:[],notes:"",test:{best:0,attempts:0}}); }
function pagePrac(p,tab){
  const st=P(p.id), idx=COURSE.practicum.indexOf(p);
  const tabs=[["q",ui("Вопросы")],["test",ui("Тест")]]; if(p.schemes) tabs.push(["sch",ui("Немые схемы")]); if(p.trainer) tabs.push(["tr",ui("Тренажёр")]);
  let h=`<p class="meta">${ui("Опорный практикум по анатомии человека · раздел")} ${idx+1} ${ui("из")} ${COURSE.practicum.length}</p><h1>${esc(p.title)}</h1><p class="lead">${ui("Повторение анатомической основы курса: вопросы для самоподготовки, тест повышенной сложности")}${p.schemes?", "+ui("немые схемы"):""}${p.trainer?" "+ui("и тренажёр"):""}. ${ui("В тесте встречаются вопросы с двумя правильными ответами.")}</p>`;
  h+=`<div class="tabs" role="tablist">`+tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-ptab="${k}">${l}</button>`).join("")+`</div>`;
  if(tab==="q"){
    h+=`<div class="block"><h3>${ui("Вопросы для самоподготовки")}</h3><p class="small meta">${ui("Отметьте вопросы, на которые можете ответить без учебника. Остальные изучите по учебнику и атласу.")}</p><div class="checks">`+
       p.questions.map((q,i)=>`<label><input type="checkbox" data-pq="${p.id}" data-i="${i}" ${st.checked[i]?"checked":""}><span>${esc(q)}</span></label>`).join("")+
       `</div><p class="small meta" id="pqcount">${ui("Отмечено:")} ${st.checked.filter(Boolean).length} ${ui("из")} ${p.questions.length}</p><label class="field" for="pn">${ui("Мои заметки по разделу")}</label><textarea id="pn" data-pn="${p.id}">${esc(st.notes||"")}</textarea></div>`;
  }
  if(tab==="test"){
    session.pOrd=session.pOrd||{}; session.pRes=session.pRes||{};
    if(!session.pOrd[p.id]) session.pOrd[p.id]=p.test.map(()=>shuffle([0,1,2,3]));
    const res=session.pRes[p.id];
    h+=`<div class="block l1"><h3>${ui("Тест повышенной сложности")}</h3><p class="small meta">${ui("Лучший результат:")} ${st.test.best} ${ui("из")} ${p.test.length}. ${ui("Попыток:")} ${st.test.attempts}. ${ui("Вопрос с двумя ответами засчитывается, только если отмечены оба верных ответа.")}</p>`+
       p.test.map((q,qi)=>qBlock(q,qi,session.pOrd[p.id][qi],res,"pq")).join("")+
       (res?`<p class="score">${res.score} ${ui("из")} ${p.test.length}</p><button class="btn ghost" data-act="reprac">${ui("Пройти тест заново")}</button>`:`<p class="mt"><button class="btn" data-act="submit-prac">${ui("Проверить ответы")}</button></p>`)+`</div>`;
  }
  if(tab==="sch") h+=p.schemes.map(sid=>schemeHTML(p.id+"-"+sid,sid)).join("");
  if(tab==="tr") h+=`<div class="block l1"><h3>${ui("Тренажёр")}</h3>${trainerHTML(p.id,p.trainer)}</div>`;
  return h;
}

     `<label class="field" for="deal">${ui("Договор с собой")}</label><textarea id="deal" data-pk="deal" placeholder="${ui("Я обязуюсь…")}">${esc(pl.deal||"")}</textarea><p class="small meta">${esc(PL.source)}</p></div>`;
  return h;

// ---------- общий рендер ----------
function render(){
  renderNav();
  const v=S.view, m=$("#main");
  if(v.v==="theme"){ const t=byId(v.id)||themes[0]; m.innerHTML=pageTheme(t,v.tab||"norm"); }
  else if(v.v==="prac"){ const p=COURSE.practicum.find(x=>x.id===v.id)||COURSE.practicum[0]; m.innerHTML=pagePrac(p,v.tab||"q"); }
  else if(v.v==="learn") m.innerHTML=pageLearn();
  else if(v.v==="progress") m.innerHTML=pageProgress();
  else if(v.v==="gloss") m.innerHTML=pageGloss();
  else if(v.v==="teacher") m.innerHTML=pageTeacher();
  else m.innerHTML=pageHome();
}
function setPath(t,path,val){ const st=T(t.id); const [a,b]=path.split("."); st[a]=st[a]||{}; st[a][b]=val; save(); }
const main=$("#main");
main.addEventListener("input",e=>{
  const el=e.target, v=S.view, t=v.v==="theme"?byId(v.id):null;
  if(el.dataset.path&&t){ setPath(t,el.dataset.path,el.value);
    // обновить состояние кнопок без перерисовки
    if(el.dataset.path.startsWith("l2.")||el.dataset.path.startsWith("project.")||el.dataset.path.startsWith("refl.")) refreshButtons(t);
  }
  if(el.dataset.k){ S[el.dataset.k]=el.value; save(); if(el.dataset.k==="gq"){ const pos=el.selectionStart; render(); const g=$("#gq"); g.focus(); g.setSelectionRange(pos,pos);} }
  if(el.dataset.pn){ P(el.dataset.pn).notes=el.value; save(); }
  if(el.dataset.pk&&el.type!=="checkbox"){ S.plan[el.dataset.pk]=el.value; save(); }
  if(el.dataset.curve&&t){ const d=curveData(t); d[el.dataset.curve][+el.dataset.i]=Math.max(0,+el.value||0); save(); $("#curvesvg").innerHTML=curveSVG(d); }
});
function refreshButtons(t){
  const st=T(t.id);
  const b2=main.querySelector('[data-act="l2done"]'); if(b2){ const ok=t.l2check.every((_,i)=>st.l2checks[i])&&t.l2.every((_,i)=>(st.l2[i]||"").trim().length>20); b2.disabled=!ok; }
  const b3=main.querySelector('[data-act="casedone"]'); if(b3){ const ok=COURSE.projectFields.every(f=>(st.project[f.k]||"").trim().length>20)&&COURSE.reflectionFields.every(f=>(st.refl[f.k]||"").trim().length>10)&&st.rate>0&&(!t.final||st.pick); b3.disabled=!ok; }
}
main.addEventListener("change",e=>{
  const el=e.target, v=S.view, t=v.v==="theme"?byId(v.id):null;
  if(el.dataset.check&&t){ T(t.id).l2checks[+el.dataset.check]=el.checked; save(); refreshButtons(t); }
  if(el.dataset.rate&&t){ T(t.id).rate=+el.value; save(); refreshButtons(t); }
  if(el.dataset.pick&&t){ T(t.id).pick=el.value; save(); render(); }
  if(el.dataset.tr){ const st=TRS(el.dataset.tr); st[el.dataset.kind][+el.dataset.i]=el.value; save(); }
  if(el.dataset.sch){ SCS(el.dataset.sch).v[+el.dataset.i]=el.value; save(); }
  if(el.dataset.pq){ const st=P(el.dataset.pq); st.checked[+el.dataset.i]=el.checked; save(); const pc=$("#pqcount"); if(pc){ const p=COURSE.practicum.find(x=>x.id===el.dataset.pq); pc.textContent=`${ui("Отмечено:")} ${st.checked.filter(Boolean).length} ${ui("из")} ${p.questions.length}`; } renderNav(); }
  if(el.dataset.pk&&el.type==="checkbox"){ S.plan[el.dataset.pk]=el.checked; save(); }
  if(el.dataset.act==="teacher"){ S.teacher=el.checked; saveNow(); renderNav(); }
});
main.addEventListener("click",e=>{
  const el=e.target.closest("button"); if(!el) return;
  const v=S.view, t=v.v==="theme"?byId(v.id):null;
  if(el.dataset.go){ go(JSON.parse(el.dataset.go)); return; }
  if(el.dataset.tab){ go({v:"theme",id:t.id,tab:el.dataset.tab}); return; }
  if(el.dataset.tabgo){ go({v:"theme",id:t.id,tab:el.dataset.tabgo}); return; }
  if(el.dataset.ptab){ go({v:"prac",id:v.id,tab:el.dataset.ptab}); return; }
  const act=el.dataset.act;
  if(act==="tr-check"){ trainerCheck(el.dataset.key); render(); return; }
  if(act==="tr-reset"){ delete session.trRes[el.dataset.key]; S.tr[el.dataset.key]={m:{},o:{},y:{},best:TRS(el.dataset.key).best}; session.trOrd[el.dataset.key]=null; saveNow(); render(); return; }
  if(act==="sch-check"){ const key=el.dataset.key, sc=COURSE.schemes[el.dataset.sid], st=SCS(key); let s=0; sc.labels.forEach((_,i)=>{ if(String(st.v[i])===String(i)) s++; }); session.schRes[key]={score:s}; st.best=Math.max(st.best||0,s); saveNow(); render(); return; }
  if(act==="sch-reset"){ const key=el.dataset.key; delete session.schRes[key]; S.sch[key]={v:{},best:SCS(key).best}; session.schOrd[key]=null; saveNow(); render(); return; }
  if(act==="submit-prac"){ const p=COURSE.practicum.find(x=>x.id===v.id), ans=collectAnswers(p.test,"pq");
    const un=unanswered(ans); if(un&&needSecondClick(el,"prac-"+p.id,`${ui("Без ответа:")} ${un}. ${ui("Нажмите «Проверить ответы» ещё раз, чтобы проверить всё равно.")}`)) return;
    const score=ans.reduce((s,a,qi)=>s+(isCorrect(p.test[qi],a)?1:0),0); const st=P(p.id); st.test.attempts++; st.test.best=Math.max(st.test.best,score); saveNow(); session.pRes[p.id]={ans,score}; render(); return; }
  if(act==="reprac"){ delete session.pRes[v.id]; session.pOrd[v.id]=null; render(); return; }
  if(act==="submit-test"||act==="submit-final"){
    const fin=act==="submit-final", qs=fin?session.final.qs:t.test, name=fin?"f":"q";
    const ans=collectAnswers(qs,name);
    const un=unanswered(ans); if(un&&needSecondClick(el,act+"-"+t.id,`${ui("Без ответа:")} ${un}. ${ui("Нажмите «Проверить ответы» ещё раз, чтобы проверить всё равно.")}`)) return;
    const score=ans.reduce((s,a,qi)=>s+(isCorrect(qs[qi],a)?1:0),0);
    const st=T(t.id); st.test.attempts++; st.test.best=Math.max(st.test.best,score); saveNow();
    if(fin) session.finalResult={ans,score}; else session.result[t.id]={ans,score};
    render(); return;
  }
  if(act==="retest"){ delete session.result[t.id]; session.order[t.id]=t.test.map(()=>shuffle([0,1,2,3])); render(); return; }
  if(act==="refinal"){ session.final=null; session.finalResult=null; render(); return; }
  if(act==="l2done"){ T(t.id).l2done=true; saveNow(); render(); return; }
  if(act==="l2undo"){ T(t.id).l2done=false; saveNow(); render(); return; }
  if(act==="casedone"){ T(t.id).caseDone=true; saveNow(); render(); return; }
  if(act==="caseundo"){ T(t.id).caseDone=false; saveNow(); render(); return; }
  if(act==="copy"){ const txt=report(), box=$("#reportbox"); box.style.display="block"; box.value=txt;
    const done=()=>{ $("#copymsg").textContent=ui("Отчёт скопирован. Вставьте его в сообщение преподавателю или в задание на платформе."); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>{ box.select(); try{document.execCommand("copy"); done();}catch(err){ $("#copymsg").textContent=ui("Выделите текст в поле и скопируйте вручную."); } }); }
    else { box.select(); try{document.execCommand("copy"); done();}catch(err){ $("#copymsg").textContent=ui("Выделите текст в поле и скопируйте вручную."); } }
    return; }
  if(act==="download"){ const txt=report(), fname=ui("Отчёт_")+(S.name||ui("студент")).replace(/\s+/g,"_")+".txt", msg=$("#copymsg");
    if(DL){ DL.save({filename:fname,data:txt}).then(()=>{ msg.textContent=ui("Отчёт сохранён."); }).catch(e=>{ msg.textContent= e&&e.code==="declined" ? ui("Сохранение отменено.") : ui("Сохранить файл здесь не удалось. Скопируйте отчёт кнопкой «Скопировать отчёт»."); }); return; }
    if(window.claude){ const box=$("#reportbox"); box.style.display="block"; box.value=txt; box.select(); msg.textContent=ui("Сохранение файла здесь недоступно. Текст отчёта выделен: скопируйте его и отправьте преподавателю."); return; }
    const blob=new Blob([txt],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); return; }
  if(act==="reset"){ if(needSecondClick(el,"reset",ui("Все ответы курса в этом браузере будут удалены без возможности восстановления. Нажмите кнопку ещё раз, чтобы подтвердить."))) return; S={t:{},view:{v:"home"},tr:{},p:{},plan:{},sch:{}}; saveNow(); render(); return; }
});

// ---------- таймер здоровьесбережения ----------
let elapsed=0, running=true, last20=0, last45=0;
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return `${m}:${String(ss).padStart(2,"0")}`; }
function drawTimer(){ $("#timer").innerHTML=`<span class="lbl">${ui("Время занятия")}</span> <b>${fmt(elapsed)}</b> <button class="btn ghost" style="padding:4px 10px" id="tbtn">${running?ui("Пауза"):ui("Продолжить")}</button>`; }
document.addEventListener("click",e=>{ if(e.target.id==="tbtn"){ running=!running; drawTimer(); } });
function toast(html,actions){ const box=$("#toastbox"); box.innerHTML=`<div class="toast" role="status">${html}<div class="row">${actions||""}<button class="btn ghost" data-close="1">${ui("Понятно")}</button></div></div>`; }
$("#toastbox").addEventListener("click",e=>{ if(e.target.dataset.close) $("#toastbox").innerHTML=""; if(e.target.dataset.pause){ running=false; drawTimer(); $("#toastbox").innerHTML=""; toast("<p>"+ui("Двигательная пауза. Встаньте, пройдитесь, сделайте несколько упражнений для спины и шеи. Нажмите «Продолжить» на таймере, когда вернётесь.")+"</p>"); } });
setInterval(()=>{ if(!running||document.hidden) return; elapsed++; 
  if(elapsed-last20>=20*60){ last20=elapsed; toast("<p><b>"+ui("Правило «20-20-20».")+"</b> "+ui("Посмотрите 20 секунд на предмет примерно в 6 метрах от вас.")+"</p>"); }
  if(elapsed-last45>=45*60){ last45=elapsed; toast("<p><b>"+ui("45 минут работы.")+"</b> "+ui("Сделайте двигательную паузу 5–10 минут.")+"</p>",'<button class="btn" data-pause="1">'+ui("Начать паузу")+'</button>'); }
  if(elapsed%5===0||elapsed<3) drawTimer(); else $("#timer b")&&($("#timer b").textContent=fmt(elapsed));
},1000);
// ---------- переключатель языка / til almashtirgich ----------
const STATIC={
  ru:{title:"Анатомия и физиология — курс самостоятельной работы",brand:"Анатомия и физиология",sub:"Курс самостоятельной работы для будущих дефектологов",mnav:"Раздел курса",side:"Содержание курса",lang:"Язык курса"},
  uz:{title:"Anatomiya va fiziologiya — mustaqil iş kursi",brand:"Anatomiya va fiziologiya",sub:"Kelajakdagi defektologlar uçun mustaqil iş kursi",mnav:"Kurs bölimi",side:"Kurs mundarijasi",lang:"Kurs tili"}};
function applyStatic(){ const t=STATIC[LANG];
  document.documentElement.lang=LANG==="uz"?"uz-Latn":"ru"; document.title=t.title;
  $("#brandname").textContent=t.brand; $("#brandsub").textContent=t.sub; $("#mnavlbl").textContent=t.mnav;
  $("#side").setAttribute("aria-label",t.side); $("#langsw").setAttribute("aria-label",t.lang);
  document.querySelectorAll("#langsw [data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG))); }
function setLang(l){ if((l!=="uz"&&l!=="ru")||l===LANG) return;
  const oldBank=bank(), fIdx=session.final?session.final.qs.map(q=>oldBank.indexOf(q)):null;
  LANG=l; COURSE=l==="uz"?COURSE_UZ:COURSE_RU; PED_GLOSSARY=l==="uz"?PED_GLOSSARY_UZ:PED_GLOSSARY_RU; themes=COURSE.themes;
  if(fIdx){ const nb=bank(); session.final.qs=fIdx.map(i=>nb[i]); }
  try{ localStorage.setItem(LANG_KEY,l); }catch(e){}
  applyStatic(); drawTimer(); render(); }
$("#langsw").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang); });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h==="uz"||h==="ru") setLang(h); });
applyStatic();
drawTimer();
render();
window.addEventListener("pagehide",saveNow);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveNow(); });
})();
</script>
