[{"k": "understood", "label": "Mavzu böyiça nimani tuşundim"}, {"k": "difficult", "label": "Nima qiyinçilik tuğdirdi va uni qanday yengdim"}, {"k": "ai_h", "label": "SI, 1-qadam. Modelga murojaat qilişdan oldingi gipotezam", "ai": true}, {"k": "ai_q", "label": "SI, 2-qadam. Modelga bergan savolim", "ai": true}, {"k": "ai_v", "label": "SI, 3-qadam. Darslik yoki atlas böyiça nimani tekşirdim va qanday tafovutlar topdim", "ai": true}, {"k": "ai_r", "label": "SI, 4-qadam. Tuşunçamda nima özgardi", "ai": true}, {"k": "load", "label": "Yuklama: mavzu neça kun va neça daqiqa vaqt oldi, tanaffuslarga rioya qilindimi"}], "rubric": ["Yeçim anatomik-fiziologik meʼyorga tayanadi, buziliş mexanizmi töğri nomlangan", "Korreksion vazifalar aniq, tekşirib böladigan va buziliş mexanizmidan kelib çiqadi", "Usullar va şakllar asoslangan hamda bolaning yoşi va holatiga mos", "Maşğulot salomatlikni saqlaş talablariga köra taşkil etilgan: meʼyorlaş, almaşinuv, tanaffuslar, qarşi körsatmalar", "Prognoz real, natija mezonlari kuzatib böladigan", "Mutaxassislar va oila bilan hamkorlik közda tutilgan"], "literature": null, "themes": [{"id": "t1", "module": 1, "hours": 6, "title": "Nerv tizimi va refleks tamoyili", "goal": "Nerv tizimining tuzilişi bolaning harakatlari va xulq-atvorini qanday belgilaşini hamda uning turli böğinlari şikastlanişi nega turli harakat buzilişlariga olib kelişini tuşuniş.", "scheme": [["Neyron: tana, dendritlar, akson, sinaps", "Qözğalişni qabul qiliş, ötkaziş va uzatiş", "Neyronlarning nobud bölişi, miyelinlanişning buzilişi: funksiyalarning yöqolişi, ötkazişning sekinlaşuvi"], ["Refleks yoyi: retseptor, afferent, oraliq, efferent neyron, effektor", "Taʼsirlanişga reflektor javob", "Istalgan böğinning şikastlanişi: refleksning yöqolişi yoki ğayritabiiy özgarişi"], ["Orqa miya", "Reflektor va ötkazuvçi funksiyalar", "Şikastlaniş darajasidan pastda harakat va sezgining buzilişi"], ["Piramida (pöstloq-orqa miya) yöli: markaz oldi puştasi — uzunçoq miyada kesişiş — oldingi şoxlar motoneyronlari", "Ixtiyoriy harakatlar", "Markaziy (spastik) parez: tonus va pay reflekslarining oşişi, patologik reflekslar"], ["Miyaça", "Harakatlar koordinatsiyasi, muvozanat, tonusni boşqariş", "Ataksiya, beqarorlik, intension titraş"], ["Pöstloq osti (bazal) yadrolari", "Avtomatlaşgan harakatlar, tonusni boşqariş", "Giperkinezlar, tonusning özgarib turişi"], ["Katta yarim şarlar pöstloğining bölaklari", "Peşona bölagi — dasturlaş va nazorat, motor pöstloq; tepa bölagi — teri-muşak sezgisi; çakka bölagi — eşitiş; ensa bölagi — köriş", "Şikastlaniş sohasiga boğliq öziga xos buzilişlar"]], "notes": ["Markaziy nerv tizimini boş miya va orqa miya, periferik nerv tizimini esa nervlar va nerv tugunlari hosil qiladi. Funksiyasiga köra somatik va vegetativ nerv tizimi farqlanadi.", "Refleks — organizmning nerv tizimi iştirokida taʼsirlanişga javob reaksiyasi. Refleksning moddiy asosi — refleks yoyi.", "Nerv tolalarining miyelinlanişi bolalik va ösmirlik davri davomida davom etadi, şuning uçun bolalarda harakatlarning tezligi va aniqligi asta-sekin ortib boradi.", "Miya plastikligi erta yoşda eng yuqori böladi. Bu korreksion işni erta boşlaşning fiziologik asosidir.", "Bolalar serebral falaji (BSF) — rivojlanayotgan miyaning homila davrida, tuğruq paytida yoki erta postnatal davrda şikastlanişi natijasida yuzaga keladigan, zörayib bormaydigan harakat buzilişlari guruhi.", "Spastik diplegiya — çala tuğilgan bolalarda BSFning köp uçraydigan şakli. Uning odatiy sababi — periventrikulyar leykomalyatsiya: yon qorinçalar atrofidagi, oyoqlarga boruvçi tolalar ötadigan oq moddaning şikastlanişi. Şuning uçun oyoqlar qöllarga qaraganda köproq zararlanadi."], "health": "Öquv mehnati psixogigiyenasi: bola va talabaning nerv tizimi yuklama bilan dam olişning almaşinib turişiga muhtoj. BSF bölgan bolada keskin va ortiqça zöriqiş, sovuq va hissiy taranglik spastiklikni kuçaytiradi, şuning uçun maşğulotlar xotirjam surʼatda, tananing töğri holatida va tanaffuslar bilan taşkil etiladi.", "read": "Qöllanma, 6.2-§ (neyroanatomiya — kompetensiyalar poydevori), 8.2-§ (moslaştirilgan jismoniy tarbiya bilan integratsiya).", "l1": ["Mavzuning möljal çizmasini örganing va atlas yoki uç ölçamli modelda unda nomlangan barça tuzilmalarni toping. Boş miyaning kontur rasmida pöstloq bölaklari, miyaça, miya ustuni va markaz oldi puştasini belgilang.", "Tizza refleksining refleks yoyini çizing va uning barça böğinlarini belgilang. Muşak soğlom bölgani holda refleks yuzaga kelmasa, qaysi böğin şikastlanganini körsating.", "Mavzu böyiça qisqa taʼriflari bilan 10 ta atamadan iborat glossariy tuzing."], "l2": ["«Şikastlaniş darajasi — buzilişning namoyon bölişi» vaziyatli masalasi. Ikki holatni taqqoslang: bir bolada oyoq muşaklari tonusi oşgan va tizza reflekslari kuçaygan, ikkinçisida yurişi beqaror, barmoq-burun sinamasida möljalga tegmaydi, tonus pasaygan. Har bir holatda harakat tizimining qaysi böğini şikastlangan bölişi mumkinligini aniqlang va xulosani mavzu çizmasi asosida asoslang.", "Mavzu tuşunçalarini umumlaştiring: peşona pöstloğidagi niyatdan muşak qisqarişigaça bölgan ixtiyoriy harakat funksional tizimi çizmasini tuzing, unga miyaça va pöstloq osti yadrolarini boşqaruv böğinlari sifatida kiriting."], "l2check": ["Buzilişning har bir körinişi muayyan tuzilma bilan boğlangan", "Xulosa faqat kasallik nomi bilan emas, yölning tuzilişi yoki tuzilma funksiyasi bilan asoslangan", "Funksional tizim çizmasi dasturlaş, bajariş va nazorat böğinlarini öz içiga oladi"], "test": [{"q": "Nerv tizimining tuzilmaviy-funksional birligi — bu", "a": ["neyron", "nefron", "sinaps", "miyelin qobiq"], "c": 0, "e": "Neyron qözğalişni qabul qiladi, ötkazadi va uzatadi. Sinaps — neyronlarning aloqa joyi, mustaqil birlik emas."}, {"q": "Qözğalişni retseptordan markaziy nerv tizimiga uzatuvçi —", "a": ["efferent (harakatlantiruvçi) neyron", "afferent (sezuvçi) neyron", "oraliq neyron", "effektor"], "c": 1, "e": "Afferent neyron qözğalişni markazga, efferent neyron esa markazdan işçi organga ötkazadi."}, {"q": "Ixtiyoriy harakatlarni taʼminlovçi tuzilma —", "a": ["piramida (pöstloq-orqa miya) yöli", "köruv yöli", "retikulyar formatsiya", "adaşgan nerv"], "c": 0, "e": "Piramida yöli markaz oldi puştasida boşlanib, orqa miya oldingi şoxlarining motoneyronlarida tugaydi."}, {"q": "Markaziy (spastik) parez uçun xos belgi —", "a": ["tonusning pasayişi va reflekslarning yöqligi", "tonus va pay reflekslarining oşişi", "muşaklar atrofiyasi va tolalarning tortişib turişi", "faqat sezgining buzilişi"], "c": 1, "e": "Piramida yöli şikastlanganda spinal reflekslar pöstloq nazoratidan ozod böladi: tonus va reflekslar oşadi."}, {"q": "Harakatlar koordinatsiyasi va muvozanatni avvalo taʼminlovçi tuzilma —", "a": ["uzunçoq miya", "miyaça", "ensa bölagi", "gipofiz"], "c": 1, "e": "Miyaça şikastlanişi ataksiyaga olib keladi: harakatlar beqaror, noaniq va nomutanosib böladi."}, {"q": "Pöstloqning harakat (motor) sohasi qayerda joylaşgan?", "a": ["markaz orti puştasida", "peşona bölagining markaz oldi puştasida", "yuqori çakka puştasida", "pixsimon egatda"], "c": 1, "e": "Markaz orti puştasi — teri-muşak sezgisi sohasi, yuqori çakka puştasi — eşitiş sohasi, pixsimon egat — köriş sohasi."}, {"q": "Çala tuğilgan bolalarda spastik diplegiyada odatda qaysi tuzilma şikastlanadi?", "a": ["periventrikulyar oq modda", "miyaça", "oyoqlarning periferik nervlari", "oyoq muşaklari"], "c": 0, "e": "Periventrikulyar leykomalyatsiya oyoqlarga boruvçi tolalarni zararlaydi, şuning uçun oyoqlar qöllarga qaraganda köproq zararlanadi."}, {"q": "Korreksion işni erta boşlaşning fiziologik asosi —", "a": ["tuğiliş paytigaça miyelinlanişning tugallanişi", "erta yoşda miyaning yuqori plastikligi", "çaqaloqda reflekslarning yöqligi", "peşona bölaklarining erta yetilişi"], "c": 1, "e": "Bolada miyelinlaniş hali tugallanmagan, miya plastikligi esa erta yoşda eng yuqori böladi."}], "kase": {"title": "Aziz, 6 yoş: spastik diplegiya", "norm": ["Piramida yölining borişini kuzating va u şikastlanganda muşaklar tonusi nega oşişini tuşuntiring.", "Nega periventrikulyar leykomalyatsiyada oyoqlar qöllarga qaraganda köproq zararlanadi?", "Qanday şaroitlar spastiklikni kuçaytiradi va buni maşğulotda qanday hisobga oliş kerak?"], "portrait": "Aziz homiladorlikning 32-haftasida tuğilgan. Neyrosonografiya maʼlumotlariga köra — periventrikulyar leykomalyatsiya, nevrolog BSF, spastik diplegiya şakli taşxisini qöygan. Hozir bolaga 6 yoş, u inklyuziv bolalar boğçasining tayyorlov guruhiga qatnaydi. Kattalarning qöliga tayanib yuradi: oyoq uçida, oyoqlarini çaliştirib. Qöllari harakatlarda iştirok etadi, ammo mayda harakatlar (tugma qadaş, qalam bilan işlaş) noaniq va sekin. Intellektual rivojlanişi yoş meʼyoriga yaqin, nutqida yengil dizartrik belgilar bor. Maşğulotning örtasiga kelib Aziz çarçaydi va çalğiy boşlaydi. Onasi juda faol va «yoz davomida uni yurişga örgatişni» söraydi. Bola davolaş jismoniy tarbiyasi yöriqçisi bilan şuğullanadi.", "task": "Aziz uçun davolaş jismoniy tarbiyasi yöriqçisining işi bilan muvofiqlaştirilgan, harakat sohasi va maişiy mustaqillikni rivojlantirişga qaratilgan 2–3 oylik individual marşrut fragmentini loyihalang. Onasiga real maqsadlarni qanday tuşuntirişni alohida öylab çiqing."}, "trainer": {"match": [["Neyron", "Nerv tizimining tuzilmaviy-funksional birligi"], ["Sinaps", "Qözğaliş uzatiladigan neyronlararo aloqa joyi"], ["Afferent neyron", "Qözğalişni retseptordan MNTga ötkazadi"], ["Efferent neyron", "Qözğalişni MNTdan işçi organga ötkazadi"], ["Miyaça", "Harakatlar koordinatsiyasi va muvozanat"]], "odd": [{"items": ["peşona bölagi", "tepa bölagi", "miyaça", "ensa bölagi"], "odd": 2, "why": "Miyaça katta yarim şarlar pöstloğining bölagi emas."}, {"items": ["retseptor", "afferent neyron", "effektor", "gipofiz"], "odd": 3, "why": "Gipofiz — endokrin bez, refleks yoyining böğini emas."}], "yesno": [["Markaziy nerv tizimini boş miya va orqa miya hosil qiladi", true], ["Piramida yöli uzunçoq miyada kesişadi", true], ["Miyaça şikastlanganda spastik parez rivojlanadi", false], ["Nerv tolalarining miyelinlanişi tuğiliş paytigaça tugaydi", false], ["Harakat pöstloği markaz oldi puştasida joylaşgan", true]]}, "schemes": ["reflex", "brain"], "atlas": "IvGMA atlas-jadvallari (2012): 45–51-rasmlar (refleks yoyi, orqa miya, boş miya kesimlari, boş miya nervlari, çigallar)."}, {"id": "t2", "module": 1, "hours": 6, "title": "Eşitiş analizatori", "goal": "Quloq bölimlari va eşitiş yölining tuzilişini eşitiş buzilişlari turlari hamda surdopedagogik iş yönalişlarini tanlaş bilan boğlaş.", "scheme": [["Taşqi quloq: quloq suprasi, taşqi eşitiş yöli", "Tovuş tölqinlarini tutiş va ötkaziş", "Quloq kiri tiqini, eşitiş yöli atreziyasi: eşitişning konduktiv pasayişi"], ["Örta quloq: noğora parda, bolğaça, sandon, uzangi; eşitiş (Yevstaxiy) nayi", "Tovuş tebranişlarini ötkaziş va kuçaytiriş, bosimni tenglaştiriş", "Otit, ekssudat, parda şikastlanişi: konduktiv quloq oğirligi"], ["Içki quloq: çiğanoq, tukli hujayralarga ega Korti organi", "Mexanik tebranişlarni nerv impulsiga aylantiriş", "Tukli hujayralarning şikastlanişi: sensonevral quloq oğirligi"], ["Dahliz-çiğanoq nervining (VIII juft) çiğanoq qismi, miya ustunining eşitiş yöllari", "Impulsni miyaga ötkaziş", "Eşitiş neyropatiyasi, retrokoxlear buzilişlar"], ["Çakka bölagi: köndalang puştalar (birlamçi eşitiş pöstloği), Vernike sohasi", "Tovuşlarni tahlil qiliş, nutqni tuşuniş", "Eşitiş saqlangan holda nutqni tuşunişning buzilişi"]], "notes": ["Inson taxminan 16 dan 20 000 Gs gaça çastotali tovuşlarni idrok etadi. Nutqni tuşuniş uçun taxminan 500–4000 Gs diapazoni ayniqsa muhim.", "Nutq diapazonidagi örtaça eşitiş yöqotilişiga köra quloq oğirligi darajalari: I — 26–40 dB, II — 41–55 dB, III — 56–70 dB, IV — 71–90 dB, 90 dB dan ortiq — karlik.", "Konduktiv quloq oğirligi taşqi yoki örta quloqda tovuş ötkazilişining buzilişi bilan boğliq va köpinça davolanadi. Sensonevral quloq oğirligi içki quloq yoki eşitiş nervining şikastlanişi bilan boğliq va odatda qaytmas böladi.", "Eşitiş apparati tovuşni kuçaytiradi. Koxlear implant şikastlangan tukli hujayralarni çetlab ötib, eşitiş nervi tolalarini elektr bilan qözğatadi.", "Eşitiş buzilişini erta aniqlaş (çaqaloqlarning audiologik skriningi) va erta eşitiş protezlaş yordami nutq rivojlanişi imkoniyatlarini belgilaydi."], "health": "Eşitiş gigiyenasi: şovqindan himoyalaniş, quloqçinlar ovozi 60% dan oşmasligi va ketma-ket 60 daqiqadan uzoq işlatilmasligi, otitlarni öz vaqtida davolaş, ototoksik dorilar bilan ehtiyotkorlik (faqat şifokor tayinlaganda). Defektologning özi uçun eşitişida buzilişi bölgan bolalar bilan işlaş yuqori ovoz yuklamasini anglatadi.", "read": "Qöllanma, 4.3-§ («Eşitiş analizatori» keysi namunasi), 8.3-§ (eşitiş analizatori misolida integrativ salomatlikni saqlaş bloki).", "l1": ["Uç ölçamli model yoki atlas böyiça tovuşning quloq suprasidan pöstloqqaça bölgan yölini kuzating. 8–10 böğindan iborat ketma-ketlikni yozing.", "Möljal çizmasi namunasida «quloq bölimi — tuzilmalar — funksiya» jadvalini töldiring.", "Eşitiş suyakçalarini tebraniş uzatiliş tartibida eslab qoliş uçun mnemonik ibora tuzing."], "l2": ["Vaziyatli masala. 1-bola: eşitiş yöqotilişi 35 dB, tez-tez otit bilan oğriydi, davolanişdan keyin eşitişi yaxşilanadi. 2-bola: tuğilgandan 65 dB eşitiş yöqotilişi, suyak va havo ötkazuvçanligi bir xilda pasaygan. Har bir bolada eşitiş buzilişining turi va darajasini hamda eşitiş analizatorining qaysi böğini şikastlangan bölişi mumkinligini aniqlang.", "III darajali sensonevral quloq oğirligi bölgan bolaga şunçaki baland ovozda gapiriş nega yetarli emasligini va buning örniga qanday texnik vositalar va pedagogik usullar kerakligini tuşuntiring."], "l2check": ["Buziliş turi analizator böğini orqali aniqlangan (ötkaziş yoki idrok etiş)", "Buziliş darajasi detsibellardagi tasnif böyiça aniqlangan", "Pedagogik xulosalar mexanizmdan kelib çiqadi, ixtiyoriy tarzda aytilmagan"], "test": [{"q": "Tovuş tebranişlari qayerda nerv impulsiga aylanadi?", "a": ["noğora pardada", "eşitiş suyakçalarida", "Korti organining tukli hujayralarida", "eşitiş nayida"], "c": 2, "e": "Korti organining tukli hujayralari — eşitiş analizatorining retseptorlari."}, {"q": "Eşitiş suyakçalari qayerda joylaşgan?", "a": ["taşqi quloqda", "örta quloqda", "içki quloqda", "çakka bölagida"], "c": 1, "e": "Bolğaça, sandon va uzangi tebranişlarni noğora pardadan dahliz darçasiga uzatadi."}, {"q": "Konduktiv quloq oğirligida nima buziladi?", "a": ["taşqi yoki örta quloqda tovuşning ötkazilişi", "tukli hujayralarning işi", "eşitiş nervi böylab ötkaziş", "pöstloqda tovuşlarni tahlil qiliş"], "c": 0, "e": "Konduktiv — «ötkazmoq» maʼnosidagi sözdan: tovuş içki quloqqa yaxşi yetib bormaydi."}, {"q": "Sensonevral quloq oğirligi avvalo nima bilan boğliq?", "a": ["quloq kiri tiqini", "tukli hujayralar yoki eşitiş nervining şikastlanişi", "örta quloqning yalliğlanişi", "parda perforatsiyasi"], "c": 1, "e": "Tovuşni idrok etiş buzilgan, şuning uçun tovuşni oddiygina kuçaytiriş nutqning aniq eşitilişini töliq tiklamaydi."}, {"q": "Birlamçi eşitiş pöstloği qayerda joylaşgan?", "a": ["ensa bölagida", "çakka bölagida", "markaz oldi puştasida", "miyaçada"], "c": 1, "e": "Bu lateral egat çuqurligidagi köndalang çakka puştalari."}, {"q": "III darajali quloq oğirligi qanday eşitiş yöqotilişiga töğri keladi?", "a": ["26–40 dB", "41–55 dB", "56–70 dB", "90 dB dan ortiq"], "c": 2, "e": "I — 26–40, II — 41–55, III — 56–70, IV — 71–90 dB, 90 dB dan ortiq — karlik."}, {"q": "Koxlear implant", "a": ["taşqi eşitiş yölida tovuşni kuçaytiradi", "eşitiş suyakçalarining örnini bosadi", "eşitiş nervi tolalarini elektr bilan qözğatadi", "tukli hujayralarni tiklaydi"], "c": 2, "e": "Implant şikastlangan tukli hujayralarni çetlab ötadi va signalni töğridan-töğri eşitiş nerviga uzatadi."}, {"q": "Şovqin tufayli quloq oğirligining oldini oliş böyiça tavsiya:", "a": ["quloqçinlar ovozi 60% dan oşmasligi va ketma-ket 60 daqiqadan uzoq işlatilmasligi", "quloqçinlarni faqat tunda işlatiş", "eşitiş yölini har kuni paxtali tayoqça bilan tozalaş", "profilaktika uçun tomçi tomiziş"], "c": 0, "e": "«60/60» qoidasi tukli hujayralarga tuşadigan şovqin yuklamasini kamaytiradi."}], "kase": {"title": "Kamila, 5 yoş: III darajali sensonevral quloq oğirligi", "norm": ["Sensonevral quloq oğirligida qaysi tuzilmalar şikastlanadi va nega bu buziliş qaytmas?", "Nutqni tuşuniş uçun qaysi çastota diapazoni muhim va 60 dB eşitiş yöqotilişida bola nimani yöqotadi?", "Eşitiş apparatining yordami koxlear implant yordamidan nimasi bilan farq qiladi?"], "portrait": "Kamilada ikki tomonlama III darajali sensonevral quloq oğirligi bor (audiometriya maʼlumotlariga köra — har ikki quloqda taxminan 65 dB). Buziliş keç aniqlangan, qizça eşitiş apparatlarini 3 yoşdan beri taqadi, çarçaganda baʼzan ularni yeçib qöyadi. Nutqida alohida sözlar va qisqa iboralar bor, unga qaratilgan nutqni lablardan öqiş va vaziyatga tayanib tuşunadi. Qizça bilan asosan buvisi şuğullanadi, ota-onasi işlaydi. Kamila kirişimli, rasm çizişni yaxşi köradi, ammo muloqotda omadsizlikka uçrasa tez xafa böladi. Oila koxlear implantatsiya kerakmi, deb söramoqda.", "task": "Kamilaning eşitiş-nutq idrokini rivojlantiriş va talaffuz könikmalarini şakllantiriş böyiça korreksion marşrut fragmentini loyihalang. Şuningdek, buvisi uçun tuşunarli izoh tayyorlang: quloqda aynan nima «işlamayapti» va bola nega apparatlarni doimo taqib yurişi kerak."}, "trainer": {"match": [["Noğora parda", "Taşqi quloqni örta quloqdan ajratadi va tebranişlarni suyakçalarga uzatadi"], ["Eşitiş nayi", "Örta quloqni burun-halqum bilan tutaştiradi va bosimni tenglaştiradi"], ["Çiğanoq", "Korti organini öz içiga oladi"], ["Tukli hujayralar", "Eşitiş analizatorining retseptorlari"], ["Köndalang çakka puştalari", "Birlamçi eşitiş pöstloği"]], "odd": [{"items": ["bolğaça", "sandon", "uzangi", "çiğanoq"], "odd": 3, "why": "Çiğanoq — içki quloqning qismi, qolganlari — eşitiş suyakçalari."}, {"items": ["konduktiv quloq oğirligi", "sensonevral quloq oğirligi", "aralaş quloq oğirligi", "katarakta"], "odd": 3, "why": "Katarakta — gavharning xiralaşişi, bu köriş buzilişi."}], "yesno": [["Eşitiş suyakçalari içki quloqda joylaşgan", false], ["III darajali quloq oğirligi 56–70 dB eşitiş yöqotilişiga töğri keladi", true], ["Koxlear implant eşitiş suyakçalarining örnini bosadi", false], ["Sensonevral quloq oğirligi odatda qaytmas böladi", true], ["Nutqni tuşuniş uçun 500–4000 Gs diapazoni ayniqsa muhim", true]]}, "schemes": ["ear"], "atlas": "IvGMA atlas-jadvallari (2012): 53–56-rasmlar (eşitiş va muvozanat organi, eşitiş suyakçalari, labirint, tovuş tebranişlarining uzatilişi)."}, {"id": "t3", "module": 1, "hours": 6, "title": "Köriş analizatori", "goal": "Optik tizim, tör parda va köruv yölining tuzilişini köriş buzilişlari turlari hamda bolaning köriş muhitiga qöyiladigan talablar bilan boğlaş.", "scheme": [["Şox parda, gavhar, kiprikli muşak, şişasimon tana", "Yoruğlikning sinişi va tasvirning tör pardada fokuslanişi, akkomodatsiya", "Yaqindan köriş, uzoqdan köriş, astigmatizm; katarakta — gavharning xiralaşişi"], ["Tör parda: tayoqçalar va kolbaçalar, markaziy çuqurçali sariq doğ", "Fotoretseptsiya: kolbaçalar — ötkirlik va rang, tayoqçalar — ğira-şira yoruğlikda köriş", "Tör parda distrofiyalari, çala tuğilganlar retinopatiyasi, rangni seziş buzilişlari"], ["Köruv nervi, xiazma (tolalarning qisman kesişişi), köruv trakti", "Impulsni ötkaziş", "Köruv nervi atrofiyasi: köriş ötkirligining pasayişi, köriş maydonlarining torayişi"], ["Ensa bölagi (pixsimon egat sohasi)", "Köriş tasvirini tahlil qiliş", "Serebral (pöstloq) köriş buzilişlari"], ["Közning taşqi muşaklari (innervatsiyasi: boş miya nervlarining III, IV, VI juftlari)", "Közlarning muvofiqlaşgan harakatlari, binokulyar köriş", "Ğilaylik, ambliopiya"]], "notes": ["Meʼyorda köriş ötkirligi — 1,0. Tiflopedagogikada yaxşiroq köradigan közida korreksiya bilan köriş ötkirligi 0,05–0,2 bölgan (asoratlangan va zörayib boruvçi şakllarda 0,4 gaça) bolalar zaif köruvçi, 0 dan 0,04 gaça bölganlar esa közi ojiz hisoblanadi.", "Köriş ötkirligi yagona körsatkiç emas: köruv nervi atrofiyasi va glaukomada köriş maydonlarining torayişi muhim, u möljal olişni qiyinlaştiradi.", "Köriş tizimi erta bolalikda yetiladi. Ambliopiya erta va maktabgaça yoşda eng muvaffaqiyatli korreksiya qilinadi.", "Miopiyada tasvir tör parda oldida, gipermetropiyada esa uning orqasida fokuslanadi.", "Iş joyining yoritilganligi kamida 300 lyuks bölişi va yaltiraş bölmasligi kerak; zaif köruvçi bolalar uçun kontrast va obyektlar ölçami muhim."], "health": "Köriş gigiyenasi: ekran bilan işlaşda «20-20-20» qoidasi (har 20 daqiqada taxminan 6 m masofadagi narsaga 20 soniya qaraş), kitobgaça masofa 30–35 sm, köz gimnastikasi, kunduzgi yoruğlikda böliş — bu bolalarda yaqindan köriş rivojlanişi xavfini kamaytiradi.", "read": "Qöllanma, 6.2-§ (köriş analizatori — tiflopedagogika poydevori), 5.3-§ (ekran bilan işlaşda köriş gigiyenasi).", "l1": ["Köz modeli böyiça yoruğlik nurining şox pardadan tör pardagaça, söng impulsning ensa bölagigaça bölgan yölini kuzating. Böğinlar ketma-ketligini yozing.", "Xiazmali köruv yöli çizmasini çizing va qaysi tolalar kesişişini belgilang.", "Köz gimnastikasi majmuasini bajaring va har bir maşq közning qaysi tuzilmalariga qaratilganini tasvirlang."], "l2": ["Vaziyatli masala. 1-bola: har ikki közda köriş ötkirligi 0,1, köriş maydonlari toraygan. 2-bola: har ikki közda ötkirlik 0,6, uzoqni yomon köradi, közoynak tanlangaç — 1,0. Har bir holatda köriş analizatorining qaysi böğini buzilganini aniqlang va pedagogik xulosalar çiqaring.", "Qoldiq markaziy körişi bor bola va köriş maydonlari toraygan bola uçun köriş muhitiga qöyiladigan talablarni taqqoslang: sinfda joylaştiriş, yoritiş, materialning ölçami va kontrasti."], "l2check": ["Buziliş muayyan böğin bilan boğlangan (optika, tör parda, ötkazuvçi yöl, pöstloq)", "Köriş ötkirligi ham, köriş maydonlari ham hisobga olingan", "Muhitga qöyiladigan talablar buziliş mexanizmidan kelib çiqadi"], "test": [{"q": "Akkomodatsiya qaysi tuzilma egriligining özgarişi hisobiga taʼminlanadi?", "a": ["şox parda", "gavhar", "tör parda", "şişasimon tana"], "c": 1, "e": "Kiprikli muşak gavhar egriligini özgartiradi va köz yaqin yoki uzoqdagi narsalarga fokuslanadi."}, {"q": "Körişning eng yuqori ötkirligi qayerda taʼminlanadi?", "a": ["kör doğda", "sariq doğning markaziy çuqurçasida", "tör parda çetida", "xiazmada"], "c": 1, "e": "Markaziy çuqurçada kolbaçalar töplangan."}, {"q": "Tör pardaning tayoqçalari nimani taʼminlaydi?", "a": ["rangli körişni", "ğira-şira yoruğlikda körişni", "akkomodatsiyani", "binokulyar körişni"], "c": 1, "e": "Tayoqçalar kuçsiz yoruğlikka öta sezgir, ammo ranglarni farqlamaydi."}, {"q": "Yaqindan körişda (miopiyada) tasvir qayerda fokuslanadi?", "a": ["tör pardada", "tör parda oldida", "tör parda orqasida", "gavharda"], "c": 1, "e": "Şuning uçun uzoqdagi narsalar xira körinadi; korreksiya — soçuvçi linzalar."}, {"q": "Birlamçi köriş pöstloği qayerda joylaşgan?", "a": ["peşona bölagida", "çakka bölagida", "ensa bölagida", "tepa bölagida"], "c": 2, "e": "Ensa bölagining pixsimon egat sohasida."}, {"q": "Köruv nervlari tolalarining qisman kesişişi qayerda sodir böladi?", "a": ["tör pardada", "xiazmada", "köriş pöstloğida", "gavharda"], "c": 1, "e": "Xiazmada tör pardalarning içki (burun tomondagi) yarmidan keladigan tolalar kesişadi."}, {"q": "Zaif köruvçi bolaning köriş ötkirligi (yaxşiroq köradigan közda, korreksiya bilan) qança?", "a": ["0,5–0,8", "0,05–0,2 (asoratlangan şakllarda 0,4 gaça)", "0–0,04", "1,0"], "c": 1, "e": "0 dan 0,04 gaça — körlik, 0,05–0,2 — zaif köriş."}, {"q": "Ambliopiya qaysi yoşda eng muvaffaqiyatli korreksiya qilinadi?", "a": ["ösmirlik yoşida", "erta va maktabgaça yoşda", "kattalarda", "istalgan yoşda bir xil"], "c": 1, "e": "Bu köriş tizimining yetiliş davri."}], "kase": {"title": "Madina, 7 yoş: köruv nervlarining qisman atrofiyasi", "norm": ["Köruv nervi atrofiyasida köriş analizatorining qaysi böğini şikastlanadi va nega közoynak meʼyoriy ötkirlikni qaytarmaydi?", "Köriş maydonlarining torayişi möljal oliş va öqişga qanday taʼsir qiladi?", "Madina uçun köriş yuklamasiga qöyiladigan qaysi gigiyenik talablar ayniqsa muhim?"], "portrait": "Madinada perinatal gipoksiya oqibatida köruv nervlarining qisman atrofiyasi bor. Har ikki közning korreksiya bilan köriş ötkirligi — 0,1, köriş maydonlari toraygan. Qizça inklyuziv maktabning birinçi sinfiga qabul qilingan. U matnni közlariga yaqin tutib, yirik şriftni öqiydi, tez çarçaydi, közlarini işqalaydi, dars oxiriga kelib xato qila boşlaydi. Yangi xonada işonçsiz harakatlanadi, yon tomondagi narsalarga urilib ketadi. Madina tirişqoq va izzattalab, yordam söraşni yoqtirmaydi. Sinf öqituvçisi zaif köruvçi bola bilan birinçi marta işlamoqda.", "task": "Madinaning birinçi çorak uçun korreksion marşruti fragmentini loyihalang: köriş muhiti va iş joyini taşkil etiş, köriş yuklamasi rejimi, köriş idroki va möljal olişni rivojlantiriş, sinf öqituvçisi uçun tavsiyalar."}, "trainer": {"match": [["Şox parda", "Köz taşqi qobiğining tiniq oldingi qismi"], ["Gavhar", "Akkomodatsiyada egriligini özgartiradi"], ["Kolbaçalar", "Rangli köriş va ötkirlikni taʼminlaydi"], ["Tayoqçalar", "Ğira-şira yoruğlikda körişni taʼminlaydi"], ["Xiazma", "Köruv nervlarining qisman kesişiş joyi"]], "odd": [{"items": ["şox parda", "gavhar", "şişasimon tana", "köruv nervi"], "odd": 3, "why": "Köruv nervi impulslarni ötkazadi va közning nur sindiruvçi muhitlariga kirmaydi."}, {"items": ["miopiya", "gipermetropiya", "astigmatizm", "ambliopiya"], "odd": 3, "why": "Ambliopiya — körişning funksional pasayişi, refraksiya anomaliyasi emas."}], "yesno": [["Kör doğ — köruv nervining çiqiş joyi, u yerda fotoretseptorlar yöq", true], ["Köriş pöstloği çakka bölagida joylaşgan", false], ["Miopiyada tasvir tör parda orqasida fokuslanadi", false], ["Meʼyorda köriş ötkirligi 1,0 ga teng", true], ["Tayoqçalar ranglarni farqlaydi", false]]}, "schemes": ["eye"], "atlas": "IvGMA atlas-jadvallari (2012): 52-rasm (köz olmasining tuzilişi)."}, {"id": "t4", "module": 2, "hours": 6, "title": "Nutq apparati va nutqning markaziy mexanizmlari", "goal": "Logopedik maşqlarni nutq apparatining tuzilişi va innervatsiyasi bilan asoslaşni hamda raqamli qayd etiladigan tekşiruv bayonnomasini tuzişni örganiş.", "scheme": [["Nafas bölimi: öpkalar, bronxlar, diafragma, qovurğalararo muşaklar", "Nutq nafasi: qisqa nafas oliş, çözilgan ravon nafas çiqariş", "Yuzaki nafas, qisqa nutqiy nafas çiqariş"], ["Fonatsion bölim: hiqildoq, ovoz burmalari", "Ovoz hosil bölişi", "Ovoz buzilişlari (disfoniyalar); zöriqişda ovoz burmalarida tugunçalar"], ["Artikulyatsion bölim: til, lablar, yumşoq tanglay, pastki jağ", "Nutq tovuşlarining hosil bölişi", "Innervatsiya saqlangan holda dislaliya; tanglay yoriğida rinolaliya"], ["Boş miya nervlari: V (çaynov muşaklari), VII (mimika muşaklari, lablar), IX va X (tanglay, halqum, hiqildoq), XII (til)", "Artikulyatsiya muşaklarining innervatsiyasi", "Miya ustuni yadrolarining şikastlanişi — bulbar dizartriya; pöstloq-yadro yöllarining şikastlanişi — psevdobulbar dizartriya"], ["Broka sohasi (pastki peşona puştasining orqa qismlari), Vernike sohasi (yuqori çakka puştasining orqa qismlari), yoysimon tutam; dominant yarim şar", "Nutqning motor taşkil etilişi; nutqni tuşuniş", "Nutqning motor va sensor buzilişlari (afaziyalar; erta şikastlangan bolalarda — alaliya)"]], "notes": ["Nutq apparati markaziy (pöstloqning nutq sohalari, pöstloq osti yadrolari, ötkazuvçi yöllar, miya ustuni yadrolari) va periferik (nafas, fonatsion, artikulyatsion bölimlar) böğinlardan iborat.", "Dizartriya — nutq apparati innervatsiyasining yetişmasligi oqibatida nutqning talaffuz tomonining buzilişi.", "Psevdobulbar dizartriyada artikulyatsiya muşaklarining tonusi odatda oşgan (spastiklik), halqum refleksi saqlangan yoki kuçaygan, köpinça sölak oqişi kuzatiladi.", "Bulbar dizartriyada — periferik parez: tonus pasaygan, muşaklar atrofiyaga uçraydi, reflekslar sönadi.", "Önaqaylarning köpçiligida nutq sohalari çap yarim şarda joylaşgan.", "Tovuş talaffuzini korreksiya qilişda tayyorgarlik bosqiçi, tovuşni qöyiş (çaqiriş), uni avtomatlaştiriş — ketma-ket böğinlarda, sözlarda, gaplarda va boğlanişli nutqda — hamda öxşaş tovuşlardan farqlaş bosqiçlari ajratiladi. Avtomatlaştiriş bosqiçida ota-onalarning bola bilan muntazam şuğullanişi zarur.", "Rus tilida sözlaşuvçi bolalar köpinça asosiy qator tovuşlarini buzib talaffuz qiladi: Ль, С, Сь, З, Зь, Ц, Ш, Ж, Ч, Щ, Л, Р, Рь. Asosiy tovuşlar S, Ş, L, R hisoblanadi: ularning artikulyatsiyasi butun tovuş guruhlari uçun boşlanğiç bölib xizmat qiladi, şuning uçun ular eng uzoq şakllanadi.", "Tovuşlar yoki eşitişda ham, talaffuzda ham (R – L, S – Ş, Z – J), yoki faqat eşitişda (Ş – J, rus tilidagi С – Сь, Р – Рь) aralaştiriladi. Farqlaş böyiça iş hajmi şunga boğliq."], "health": "Bola va defektolog uçun ovoz gigiyenasi: baqirmaslik va zöriqib piçirlamaslik, uzoq nutqiy yuklamada suv içiş, ovoz tanaffuslari qiliş. Spastikligi bor bolada artikulyatsion gimnastikadan oldin tonusni meʼyorlaştiriş kerak, aks holda zör berib bajarilgan maşqlar notöğri harakatlarni mustahkamlaydi. Defektolog ovozining kundalik maşqi: burun orqali xotirjam nafas oliş va [s] yoki [ş] tovuşida ravon çöziladigan nafas çiqariş; unlilarda tovuşning yumşoq hujumi; burun va lablar sohasida tebranişni his qilib mönğillaş; tez aytişlarni sekin va aniq talaffuz qiliş. Maqsad — hiqildoqni zöriqtiriş örniga nafasga tayaniş.", "read": "Qöllanma, 6.2-§ (nutqning markaziy va periferik mexanizmlari), 8.2-§ (logopediya bilan integratsiya), 6.2 va 8.1-keyslar. T.A. Tkaçenko. «Логопедическая энциклопедия» (2008): tovuş talaffuzini korreksiya qiliş bosqiçlari, asosiy tovuşlar, farqlaş.", "l1": ["Çizmada nutq apparati bölimlarini belgilang va har birining funksiyasini ayting.", "Til, lablar, yumşoq tanglay va pastki jağ uçun «artikulyatsiya muşagi yoki organi — innervatsiya qiluvçi boş miya nervi» jadvalini tuzing.", "Miya modelida Broka va Vernike sohalarini hamda yoysimon tutamni toping."], "l2": ["Raqamli diagnostika. Videoqayd bilan artikulyatsion motorikani tekşiriş bayonnomasini tuzing (8–10 ta sinama: lablar, til, yumşoq tanglay, pastki jağ). Har bir sinama uçun yozuv nimani qayd etişini va bajarilişini qaysi belgiga köra baholaşingizni körsating. Ota-onalarning videoyozuvga yozma roziligi va yozuvlarni saqlaş haqida band qöşing.", "Vaziyatli masala. 1-bolada til taranglaşgan, harakatlari çeklangan, halqum refleksi kuçaygan; 2-bolada til böşaşgan, ingiçkalaşgan, halqum refleksi pasaygan. Har bir holatda dizartriya şakli va şikastlaniş darajasini aniqlang.", "Temur bilan R tovuşi ustida işlaş ketma-ketligini tayyorgarlik bosqiçidan R – L farqlaşgaça tuzing. Nega dizartriyada tayyorgarlik bosqiçi dislaliyaga qaraganda uzoqroq davom etişini innervatsiyaga tayanib tuşuntiring."], "l2check": ["Bayonnomaning har bir sinamasi muayyan muşak va uning innervatsiyasi bilan boğlangan", "Baholaş mezonlari videoyozuvda kuzatib böladigan", "Ota-onalarning roziligi va şaxsiy maʼlumotlarni himoya qiliş hisobga olingan"], "test": [{"q": "Ovoz burmalari qayerda joylaşgan?", "a": ["halqumda", "hiqildoqda", "traxeyada", "burun böşliğida"], "c": 1, "e": "Hiqildoq — nutq apparatining fonatsion bölimi."}, {"q": "Til muşaklarini qaysi nerv innervatsiya qiladi?", "a": ["yuz nervi (VII)", "uç şoxli nerv (V)", "til osti nervi (XII)", "köruv nervi (II)"], "c": 2, "e": "Til osti nervi — tilning harakatlantiruvçi nervi."}, {"q": "Broka sohasi qayerda joylaşgan?", "a": ["pastki peşona puştasining orqa qismlarida", "yuqori çakka puştasida", "ensa bölagida", "miyaçada"], "c": 0, "e": "U nutqning motor taşkil etilişiga javob beradi; odatda çap yarim şarda joylaşgan."}, {"q": "Eşitiş saqlangan holda nutqni tuşunişning buzilişi nimaning şikastlanişi bilan boğliq?", "a": ["Broka sohasi", "Vernike sohasi", "til osti nervi", "ovoz burmalari"], "c": 1, "e": "Vernike sohasi nutq tovuşlarini tahlil qiliş va nutqni tuşunişni taʼminlaydi."}, {"q": "Dizartriya — bu", "a": ["nutq surʼatining buzilişi", "nutq apparati innervatsiyasining yetişmasligi tufayli nutqning talaffuz tomonining buzilişi", "innervatsiya meʼyorida bölgan holda tovuş talaffuzining buzilişi", "eşitiş saqlangan holda nutqning yöqligi"], "c": 1, "e": "Innervatsiya meʼyorida bölgan holdagi tovuş talaffuzi buzilişlari dislaliya deb ataladi."}, {"q": "Psevdobulbar dizartriya uçun nima xos?", "a": ["artikulyatsiya muşaklarining spastikligi va saqlangan yoki kuçaygan halqum refleksi", "til atrofiyasi va reflekslarning sönişi", "faqat nutqni tuşunişning buzilişi", "meʼyoriy tonus va surʼatning buzilişi"], "c": 0, "e": "Pöstloq-yadro yöllari şikastlangan, şuning uçun markaziy (spastik) parez rivojlanadi."}, {"q": "Nutq nafasi qanday xususiyatga ega?", "a": ["uzun nafas oliş va qisqa nafas çiqariş", "qisqa nafas oliş va çözilgan ravon nafas çiqariş", "teng nafas oliş va nafas çiqariş", "faqat burun orqali nafas oliş"], "c": 1, "e": "Nutq nafas çiqarişda tuziladi, şuning uçun u çözilgan böladi."}, {"q": "Rinolaliya nima bilan boğliq?", "a": ["Vernike sohasining şikastlanişi", "tanglayning anatomik nuqsonlari va tanglay-halqum yopilişining buzilişi", "eşitişning pasayişi", "miyaçaning şikastlanişi"], "c": 1, "e": "Masalan, tanglay yoriğida havo burunga ötib ketadi, nutq dimoğdan çiqqandek eşitiladi."}], "kase": {"title": "Temur, 6 yoş: psevdobulbar dizartriya", "norm": ["Psevdobulbar dizartriyada innervatsiyaning qaysi darajasi şikastlanadi va bu artikulyatsion motorikada qanday namoyon böladi?", "Siz maşq qildiradigan muşaklarni qaysi boş miya nervlari innervatsiya qiladi?", "Nega artikulyatsion gimnastikadan oldin tonusni meʼyorlaştiriş kerak?"], "portrait": "Temurning anamnezida markaziy nerv tizimining perinatal şikastlanişi bor, yaqqol harakat buzilişlari yöq. Nevrolog va logoped örta darajadagi psevdobulbar dizartriyani qayd etadi. Tili taranglaşgan, orqaga tortilgan, harakatlari çeklangan, tilni yuqoriga kötarişga urinişda titraş paydo böladi. Sölak oqişi kuzatiladi, nutqi noaniq, dimoğdan çiqqandek. Huştaksimon, şivillovçi va sonor tovuşlar talaffuzi buzilgan. Maşğulot boşlanganidan 10 daqiqa ötib nutqi yanada tuşunarsiz bölib qoladi. Logoped talabadan maşqlar tanlovini anatomiya va innervatsiya bilan asoslaşni hamda dinamikani qayd etiş usulini taklif qilişni söraydi.", "task": "Logopedik işning tayyorgarlik bosqiçi marşruti fragmentini loyihalang: tonusni meʼyorlaştiriş, innervatsiya böyiça asoslangan nafas va artikulyatsion maşqlar. Dinamikani raqamli qayd etiş rejasini kiriting (bayonnomangiz böyiça har 3–4 haftada sinamalarni videoyozuvga oliş)."}, "trainer": {"match": [["Hiqildoq", "Ovoz hosil bölişi"], ["Til osti nervi (XII)", "Til muşaklarini innervatsiya qiladi"], ["Yuz nervi (VII)", "Mimika muşaklari va lab muşaklarini innervatsiya qiladi"], ["Broka sohasi", "Nutqning motor taşkil etilişi"], ["Vernike sohasi", "Nutqni tuşuniş"]], "odd": [{"items": ["lablar", "til", "yumşoq tanglay", "traxeya"], "odd": 3, "why": "Traxeya artikulyatsion bölimga emas, nafas bölimiga kiradi."}, {"items": ["dislaliya", "dizartriya", "rinolaliya", "miopiya"], "odd": 3, "why": "Miopiya — köriş buzilişi, qolganlari — nutqning talaffuz tomoni buzilişlari."}], "yesno": [["Nutq nafas çiqarişda tuziladi", true], ["Ovoz burmalari halqumda joylaşgan", false], ["Bulbar dizartriyada artikulyatsiya muşaklarining tonusi pasaygan", true], ["Broka sohasi çakka bölagida joylaşgan", false], ["Guruhlarning asosiy tovuşlari S, Ş, L, R hisoblanadi", true]]}, "schemes": ["brain"], "atlas": "IvGMA atlas-jadvallari (2012): 23, 28, 29–31-rasmlar (oğiz böşliği va halqum, tanglay, nafas yöllari, hiqildoq), 50-rasm (boş miya nervlari)."}, {"id": "t5", "module": 2, "hours": 6, "title": "Oliy nerv faoliyati va xulq-atvorni boşqariş", "goal": "Diqqat, tormozlaniş va ixtiyoriy boşqaruvning fiziologik asoslarini tuşuniş hamda tuzilmalaştirilgan pedagogik kuzatuvni taşkil etişni örganiş.", "scheme": [["Şartli refleks (I.P. Pavlov)", "Vaqtinçalik boğlanişning hosil bölişi — örganiş va könikmalar asosi", "Nerv tizimi tez toliqqanda könikmalarni hosil qiliş va mustahkamlaşdagi qiyinçiliklar"], ["Qözğaliş va tormozlaniş jarayonlari; içki (şartli) tormozlaniş", "Differensirovka, keraksiz reaksiyalarning sönişi, körsatmani yodda tutiş", "Tormozlanişning sustligi: impulsivlik, çalğuvçanlik"], ["Nerv tizimining xossalari: kuç, muvozanat, harakatçanlik; oliy nerv faoliyati tiplari", "Individual surʼat, yuklamaga çidamlilik", "Tabaqalaştirilgan yuklama va surʼat zarurati"], ["Pöstloqning peşona (prefrontal) qismlari va ularning pöstloq osti yadrolari bilan aloqalari", "Dasturlaş, nazorat, işçi xotira, ijro funksiyalari", "DYGSda ijro funksiyalari va tormozlanişning buzilişi"], ["Miya ustunining retikulyar formatsiyasi", "Bedorlik va pöstloq faolligini taʼminlaş", "Diqqatning beqarorligi, tez çarçaş"], ["Ikkinçi signal sistemasi (nutq)", "Xulq-atvorni söz orqali boşqariş", "Bola öz nutqining boşqaruvçi funksiyasining yetişmasligi"]], "notes": ["Şartsiz reflekslar tuğma böladi, şartli reflekslar esa hayot davomida vaqtinçalik boğlaniş asosida orttiriladi.", "Içki tormozlaniş (sönuvçi, differensirovkali, keçikuvçi) — ixtiyoriy xulq-atvorning fiziologik asosi.", "Diqqat yetişmasligi va giperaktivlik sindromi (DYGS) — asosida peşona-pöstloq osti boşqaruv tizimlarining disfunksiyasi yotadigan neyrorivojlaniş buzilişi.", "DYGS taşxisini şifokor (psixiatr, nevrolog) qöyadi. Defektolog pedagogik kuzatuv ötkazadi va işni xulosani hisobga olgan holda quradi.", "Tuzilmalaştirilgan kuzatuv xulq-atvorni umumiy taassurotlar bilan emas, oldindan belgilangan belgilar va vaqt oraliqlari böyiça qayd etadi."], "health": "Işning qisqa bosqiçlari, faoliyat turlarini almaştiriş, harakat tanaffuslari va oldindan maʼlum kun tartibi ortiqça yuklamani kamaytiradi. Talaba uçun ham özini taşkil etiş mantiği xuddi şunday: tanaffuslar bilan 45–60 daqiqalik bloklarda işlaş.", "read": "Qöllanma, 6.2-§ (neyrofiziologiya — korreksion işning barça yönalişlari asosi), 2.3-§ (biliş faoliyatining psixologik-pedagogik asoslari).", "l1": ["«Tormozlaniş turi — yuzaga keliş şarti — maşğulotda bola xulq-atvoridan misol» jadvalini tuzing.", "Nerv tizimining xossalarini tasvirlang va har biri öquv faoliyatida qanday namoyon bölişini körsating."], "l2": ["Raqamli diagnostika. 30 daqiqalik maşğulotda bola xulq-atvorini tuzilmalaştirilgan kuzatişning elektron varağini işlab çiqing: 5–6 ta kuzatiladigan belgi (masalan, topşiriqdan çalğiş, körsatmaga birinçi martadayoq javob beriş, motor bezovtalik), 5 daqiqalik qayd oraliqlari, hisoblaş usuli. Varaqni Google Formalar yoki jadvalda qanday rasmiylaştirişni öylab çiqing.", "Nega DYGS bölgan bola uzun oğzaki körsatmadan köra taşqi tayançlarga ega qisqa qadamlarga bölingan topşiriqni yaxşiroq bajarişini fiziologik nuqtai nazardan tuşuntiring."], "l2check": ["Kuzatuv belgilari aniq va bir maʼnoda qayd etiladi", "Vaqt oraliqlari va hisoblaş usuli közda tutilgan", "Tuşuntiriş peşona qismlari va tormozlaniş funksiyalariga tayanadi"], "test": [{"q": "Şartli refleks —", "a": ["tuğma reaksiya", "vaqtinçalik boğlaniş asosidagi orttirilgan reaksiya", "pöstloq iştirokisiz reaksiya", "orqa miya refleksi"], "c": 1, "e": "Şartli reflekslar hayot davomida hosil böladi."}, {"q": "Oliy nerv faoliyati tiplari haqidagi taʼlimotni kim yaratgan?", "a": ["I.M. Seçenov", "I.P. Pavlov", "L.S. Vigotskiy", "A.R. Luriya"], "c": 1, "e": "Tiplar nerv jarayonlarining kuçi, muvozanati va harakatçanligiga köra ajratilgan."}, {"q": "Körsatmani yodda tutiş va ortiqça reaksiyalarni bostirişning fiziologik asosi —", "a": ["taşqi tormozlaniş", "içki tormozlaniş", "şartsiz refleks", "qözğaliş"], "c": 1, "e": "Içki tormozlaniş hosil qilinadi va ixtiyoriy boşqaruvni taʼminlaydi."}, {"q": "Faoliyatni dasturlaş va nazorat qilişni nima taʼminlaydi?", "a": ["pöstloqning ensa qismlari", "pöstloqning peşona (prefrontal) qismlari", "miyaça", "orqa miya"], "c": 1, "e": "Peşona qismlari boşqalaridan keçroq yetiladi."}, {"q": "Miya ustunining retikulyar formatsiyasi nimani boşqaradi?", "a": ["körişni", "bedorlik darajasi va pöstloq faolligini", "öt ajralişini", "köz tomirlari tonusini"], "c": 1, "e": "Faollikning pasayişi diqqatning beqarorligi va tez çarçaş bilan namoyon böladi."}, {"q": "DYGS nima sifatida qaraladi?", "a": ["notöğri tarbiya oqibati", "peşona-pöstloq osti tizimlari disfunksiyasi bilan keçadigan neyrorivojlaniş buzilişi", "eşitiş buzilişi", "oqibatsiz ötib ketadigan vaqtinçalik yoş xususiyati"], "c": 1, "e": "Bu «yomon xulq» natijasi emas — buni öqituvçilar va ota-onalarga tuşuntiriş muhim."}, {"q": "DYGS taşxisini kim qöyadi?", "a": ["öqituvçi", "defektolog", "şifokor (psixiatr, nevrolog)", "ota-onalar"], "c": 2, "e": "Defektolog pedagogik kuzatuv ötkazadi va şifokor xulosasini hisobga olib işlaydi."}, {"q": "DYGS bölgan bola bilan maşğulotning salomatlikni saqlaş tamoyili —", "a": ["çidamlilikni şakllantiriş uçun uzoq tanaffussiz işlaş", "faoliyatni almaştiriş va harakat tanaffuslari bilan qisqa bosqiçlar", "faqat oğzaki körsatmalar", "çalğigani uçun jazolaş"], "c": 1, "e": "Qisqa bosqiçlar diqqatning çeklangan barqarorligiga mos keladi."}], "kase": {"title": "Jasur, 8 yoş: DYGS, aralaş tip", "norm": ["Qaysi miya bölimlari ixtiyoriy boşqaruvni taʼminlaydi va nega ular keç yetiladi?", "Köp bosqiçli körsatmani bajarişda içki tormozlaniş qanday rol öynaydi?", "Nega taşqi tayançlar (vizual reja, taymer) boşqaruv yetişmasligini kompensatsiya qiladi?"], "portrait": "Jasur ikkinçi sinfda öqiydi. Psixiatr DYGS, aralaş tip taşxisini qöygan. Bola körsatmani oxirigaça tinglamay, topşiriqni tez boşlab yuboradi, 10–15 daqiqadan söng xatolar soni keskin ortadi, u örnidan turadi, joyida tinç ötirolmaydi, qöşnilarini çalğitadi. Öqituvçi uning xulq-atvoridan şikoyat qiladi va bola «şunçaki xohlamaydi», deb hisoblaydi. Uyda Jasur doimiy baqiriqlar ostida ikki soat dars tayyorlaydi. Bola konstruktor yiğişni yaxşi biladi, harakatli öyinlarni yaxşi köradi, tuzilişi tuşunarli individual maşğulotlarda ança yaxşi işlaydi.", "task": "Marşrut fragmentini loyihalang: elektron varağingiz bilan tuzilmalaştirilgan kuzatuv rejasi (2 hafta), individual maşğulot tuzilmasi (qisqa bloklar, vizual jadval, harakat tanaffuslari) hamda öquv işini taşkil etiş böyiça öqituvçi va ota-onalarga tavsiyalar."}, "trainer": {"match": [["Şartli refleks", "Vaqtinçalik boğlaniş asosidagi orttirilgan reaksiya"], ["Içki tormozlaniş", "Söniş va differensirovka, ixtiyoriy boşqaruv asosi"], ["Retikulyar formatsiya", "Bedorlik va pöstloq faolligini taʼminlaydi"], ["Prefrontal pöstloq", "Faoliyatni dasturlaş va nazorat qiliş"], ["Ikkinçi signal sistemasi", "Xulq-atvorni söz orqali boşqariş"]], "odd": [{"items": ["sönuvçi", "differensirovkali", "keçikuvçi", "taşqi"], "odd": 3, "why": "Taşqi tormozlaniş şartsiz böladi; qolganlari — içki tormozlaniş turlari."}, {"items": ["kuç", "muvozanat", "harakatçanlik", "ötkirlik"], "odd": 3, "why": "Ötkirlik I.P. Pavlov böyiça nerv jarayonlarining xossalariga kirmaydi."}], "yesno": [["Şartsiz reflekslar tuğma böladi", true], ["DYGS taşxisini defektolog qöyadi", false], ["Oliy nerv faoliyati tiplarini I.P. Pavlov ajratgan", true], ["Pöstloqning peşona qismlari hammadan oldin yetiladi", false], ["Maşğulotning tanaffusli qisqa bosqiçlari diqqatning çeklangan barqarorligiga mos keladi", true]]}, "atlas": "IvGMA atlas-jadvallari (2012): 48–49-rasmlar (miyaning sagittal va gorizontal kesimlari)."}, {"id": "t6", "module": 2, "hours": 6, "title": "Yoş fiziologiyasi va iş qobiliyati", "goal": "Yoş rivojlanişi va iş qobiliyati dinamikasi qonuniyatlarini özlaştiriş hamda bolaning iş qobiliyati egri çiziğini tuziş va talqin qilişni örganiş.", "tool": "curve", "scheme": [["Ontogenez davrlari: yangi tuğilganlik, gödaklik, erta yoş, maktabgaça yoş, kiçik maktab yoşi, ösmirlik", "Yetakçi funksional tizimlarning almaşinişi", "Erta bosqiçdagi buziliş keyingi rivojlanişda aks etadi"], ["Sensitiv va kritik davrlar", "Muayyan taʼsirlarga yuqori sezgirlik", "Ötkazib yuborilgan muddatlar korreksiya samaradorligini pasaytiradi"], ["Yetiliş geteroxroniyasi: pöstloqning peşona qismlari hammadan keç yetiladi", "Ixtiyoriy boşqaruvning asta-sekin şakllanişi", "Yuklamaning davomiyligi va murakkabligiga oid yoş çeklovlari"], ["Iş qobiliyati dinamikasi: işga kirişiş — barqaror iş qobiliyati — çarçaş", "Yuklamani meʼyorlaş uçun asos", "Tez toliqişda — barqaror iş davri qisqa, çarçaş erta boşlanadi"], ["Maktabga yetuklik: morfofunksional va psixologik tayyorlik", "Muntazam taʼlimning muvaffaqiyatli boşlanişi", "Funksional yetilmaganlik: moslaşiş qiyinçiliklari, ortiqça yuklama"]], "notes": ["Geteroxroniya — funksional tizimlar yetilişining notekisligi: baʼzi tizimlar oldinroq, boşqalari keçroq yetiladi.", "Sensitiv davr — muayyan taʼsirlarga eng yuqori sezgirlik davri, muayyan funksiyaning rivojlanişi uçun qulay davr.", "K.S. Lebedinskaya ruhiy rivojlaniş keçikişi (RRK)ning konstitutsional, somatogen, psixogen va serebral-organik genezli variantlarini ajratgan.", "Serebral-organik genezli RRKda yuqori toliquvçanlik, past va beqaror iş qobiliyati xos.", "Iş qobiliyati egri çiziği teng vaqt oraliqlarida bajariladigan bir turdagi topşiriq (masalan, korrektura sinamasi) natijalari böyiça tuziladi: iş hajmi va xatolar soni hisobga olinadi."], "health": "Iş qobiliyati egri çiziği böyiça yuklamani meʼyorlaş: murakkab material — barqaror iş qobiliyati bosqiçida, faoliyatni almaştiriş va tanaffus — çarçaşning ilk belgilarida. Talaba uçun: bir keçaning örniga mavzu ustida 5–7 kunlik iş rejasi.", "read": "Qöllanma, 2.3-§ (biliş faoliyatining salomatlikni saqlovçi ölçami), 8.3-§ (salomatlikni saqlaş blokining psixofiziologik darajasi).", "l1": ["Motorika, nutq va xulq-atvorni boşqariş rivojlanişidagi yetakçi yutuqlar bilan yoş davrlari jadvalini tuzing.", "Iş qobiliyati dinamikasining uç bosqiçini va pedagog maşğulotda köradigan har birining belgilarini tasvirlang."], "l2": ["Raqamli diagnostika. «Meʼyor» bölimida iş qobiliyati egri çiziğini tuziş vositasi bor. Korrektura sinamasi maʼlumotlarini kiriting (oldindan 7 yoşli qizçaning beşta uç daqiqalik oraliqdagi natijalari kiritilgan), egri çiziqni tuzing va bosqiçlarni tasvirlang. Çarçaş qaysi oraliqda boşlanişini aniqlang.", "Şunday egri çiziqqa ega bola uçun maşğulot rejimini taklif qiling: bosqiçlar davomiyligi, murakkab materialning örni, tanaffus vaqti."], "l2check": ["Işga kirişiş, barqarorlik va çarçaş bosqiçlari maʼlumotlar asosida ajratilgan", "Iş hajmi ham, xatolar soni ham hisobga olingan", "Maşğulot rejimi bevosita egri çiziqdan kelib çiqadi"], "test": [{"q": "Sensitiv davr —", "a": ["kasallik davri", "muayyan taʼsirlarga yuqori sezgirlik davri", "dam oliş davri", "jinsiy yetiliş davri"], "c": 1, "e": "Sensitiv davrda funksiya eng muvaffaqiyatli rivojlanadi."}, {"q": "Iş qobiliyati bosqiçlarining töğri ketma-ketligi:", "a": ["çarçaş — işga kirişiş — barqarorlik", "işga kirişiş — barqaror iş qobiliyati — çarçaş", "barqarorlik — işga kirişiş — çarçaş", "çarçaş — barqarorlik — işga kirişiş"], "c": 1, "e": "Avval organizm işga kirişadi, söng barqaror işlaydi, keyin çarçaydi."}, {"q": "Hammadan keç yetiladigan qism —", "a": ["pöstloqning ensa qismlari", "pöstloqning peşona qismlari", "orqa miya", "miya ustuni"], "c": 1, "e": "Şuning uçun xulq-atvorni ixtiyoriy boşqariş uzoq şakllanadi."}, {"q": "RRKning etiopatogenetik tamoyil böyiça tasnifini kim taklif qilgan?", "a": ["K.S. Lebedinskaya", "N.M. Nazarova", "L.I. Plaksina", "R.Ye. Levina"], "c": 0, "e": "Variantlar: konstitutsional, somatogen, psixogen, serebral-organik genezli."}, {"q": "Serebral-organik genezli RRK uçun nima xos?", "a": ["yuqori iş qobiliyati", "yuqori toliquvçanlik va past iş qobiliyati", "çarçaşning yöqligi", "eşitiş buzilişi"], "c": 1, "e": "Aynan şuning uçun iş qobiliyati egri çiziği muhim diagnostik vosita hisoblanadi."}, {"q": "Iş qobiliyati egri çiziği nimaning natijalari böyiça tuziladi?", "a": ["bir martalik test", "teng oraliqlarda bajariladigan bir turdagi topşiriq", "ota-onalar bilan suhbat", "tibbiy karta"], "c": 1, "e": "Har bir oraliqda bajarilgan iş hajmi va xatolar soni hisobga olinadi."}, {"q": "Geteroxroniya —", "a": ["barça tizimlarning bir vaqtda yetilişi", "funksional tizimlar yetilişining notekisligi", "eşitiş buzilişi", "ösişning keçikişi"], "c": 1, "e": "Organizmning turli tizimlari turli muddatlarda yetiladi."}, {"q": "Maktabga yetuklik —", "a": ["7 yoş", "muntazam taʼlim salomatlikka zarar yetkazmaydigan morfofunksional va psixik rivojlaniş darajasi", "öqiy oliş", "böy va vaznning meʼyorda bölişi"], "c": 1, "e": "Bu şunçaki yoş emas, organizmning funksional tayyorligi."}], "kase": {"title": "Nigora, 7 yoş: serebral-organik genezli RRK", "norm": ["Nerv tizimining qaysi xususiyatlari Nigoraning yuqori toliquvçanligini tuşuntiradi?", "Nega pöstloq peşona qismlarining yetilişi birinçi sinfda muvaffaqiyatli öqiş uçun muhim?", "Qizçaning iş qobiliyati egri çiziği nimani körsatadi va bundan qanday foydalaniş mumkin?"], "portrait": "Nigora birinçi sinfda öqiydi. Psixologik-tibbiy-pedagogik komissiya serebral-organik genezli RRK taşxisini qöygan. Dars boşida qizça tirişib işlaydi, ammo 10–12 daqiqadan söng esnay boşlaydi, boşini partaga qöyadi, xatolar köpayadi. Beşta uç daqiqalik oraliq böyiça korrektura sinamasi: körib çiqilgan belgilar — 42, 48, 46, 31, 24; xatolar — 1, 1, 2, 6, 9. Onasi özlaştiriş haqida qayğuradi va uyda qizi bilan qöşimça ravişda ikki soatdan tanaffussiz şuğullanadi. Nigora rasm çiziş va qöşiq aytişni yaxşi köradi.", "task": "Öquv çoragi uçun marşrut fragmentini loyihalang: iş qobiliyati egri çiziğini talqin qiliş, individual maşğulot va öquv kuni rejimi, öqituvçiga tavsiyalar va uy yuklamasini meʼyorlaş böyiça onaga maslahat."}, "trainer": {"match": [["Geteroxroniya", "Funksional tizimlar yetilişining notekisligi"], ["Sensitiv davr", "Muayyan taʼsirlarga yuqori sezgirlik"], ["Işga kirişiş", "Iş qobiliyatining boşlanğiç bosqiçi"], ["Çarçaş", "Barqaror iş davridan keyin iş qobiliyatining pasayişi"], ["Maktabga yetuklik", "Organizmning salomatlikka zarar yetkazmagan holda muntazam taʼlimga tayyorligi"]], "odd": [{"items": ["konstitutsional", "somatogen", "psixogen", "sensonevral"], "odd": 3, "why": "Sensonevral quloq oğirligi böladi; qolganlari — K.S. Lebedinskaya böyiça RRK variantlari."}, {"items": ["işga kirişiş", "barqaror iş qobiliyati", "çarçaş", "akseleratsiya"], "odd": 3, "why": "Akseleratsiya — ösiş va rivojlanişning tezlaşuvi, iş qobiliyati bosqiçi emas."}], "yesno": [["Iş qobiliyati egri çiziği teng oraliqlarda bajariladigan bir turdagi topşiriq böyiça tuziladi", true], ["Serebral-organik genezli RRKda iş qobiliyati yuqori va barqaror", false], ["Pöstloqning peşona qismlari boşqalaridan keçroq yetiladi", true], ["RRK tasnifini K.S. Lebedinskaya taklif qilgan", true], ["Maktabga yetuklik faqat yoş bilan belgilanadi", false]]}}, {"id": "t7", "module": 3, "hours": 6, "title": "Tayanç-harakat apparati", "goal": "Skelet, böğimlar va muşaklar tuzilişini qomat va motorika şakllanişi bilan boğlaş hamda harakat rejimini loyihalaşda körsatma va qarşi körsatmalarni hisobga olişni örganiş.", "scheme": [["Fiziologik egriliklarga ega umurtqa poğonasi: böyin va bel lordozi, kökrak va dumğaza kifozi", "Tayanç, amortizatsiya, orqa miyani himoya qiliş", "Qomat buzilişlari, skolioz"], ["Böğimlar va boylam apparati", "Barqarorlikni saqlagan holda harakatçanlik", "Böğimlar gipermobilligi, beqarorlik (jumladan, atlanto-aksial)"], ["Skelet muşaklari, muşak tonusi", "Tana holati va harakatni saqlab turiş", "Muşak gipotoniyasi: motor rivojlanişning keçikişi, qomatning buzilişi"], ["Oyoq kafti gumbazi", "Yurişda tayanç va amortizatsiya", "Yassi oyoqlik"], ["Harakatlarning nerv boşqaruvi: pöstloq, miyaça, muşak va böğimlar proprioretseptorlari", "Koordinatsiya, tana holatini his qiliş", "Motor besönaqaylik, koordinatsiya buzilişi"]], "notes": ["Umurtqa poğonasining egriliklari postnatal davrda şakllanadi: böyin egriligi — bola boşini tuta boşlaganda, kökrak egriligi — ötira boşlaganda, bel egriligi — tik turib, yura boşlaganda.", "Muşak tonusi — muşaklarning tinç holatda qomatni saqlab turadigan uzoq davom etuvçi mötadil taranglaşuvi.", "Daun sindromi (21-xromosoma böyiça trisomiya) bölgan bolalar uçun muşak gipotoniyasi va böğimlar gipermobilligi xos, tuğma yurak nuqsonlari köp uçraydi.", "Daun sindromi bölgan bolalarning bir qismida atlanto-aksial beqarorlik aniqlanadi. Şifokor qaror qabul qilgunga qadar umbaloq oşiş, boşda turiş va böyinga yuklama tuşadigan maşqlar istisno qilinadi.", "Qomat buzilişlarining profilaktikasi muşak korsetini mustahkamlaş, töğri iş holati, böyiga mos mebel tanlaş va yetarli harakat faolligini öz içiga oladi.", "Suyak organ sifatida suyak, toğay va biriktiruvçi töqimalardan iborat, özining qon tomirlari va nervlariga ega. Uning relyefi — dömboqlar, qirralar, çuqurçalar, egatlar — muşaklar tortişini va qöşni organlarning tegib turişini aks ettiradi.", "Bolalarning naysimon suyaklari ilik böşliğida qizil ilik joylaşadi, u yoş ötişi bilan sariq ilik bilan almaşinadi; yassi suyaklarning ğovak moddasida qizil ilik butun umr saqlanadi.", "Suyaklarning birikişlari uzluksiz (sindesmozlar, sinxondrozlar, sinostozlar), uzlukli (böğimlar) va ötuvçi — yarim böğimlar (simfizlar) böladi. Böğimlardagi harakatlar: frontal öq atrofida — bukiş va yoziş, sagittal öq atrofida — uzoqlaştiriş va yaqinlaştiriş, vertikal öq atrofida — aylantiriş (qöl-oyoqlar uçun — pronatsiya va supinatsiya).", "Yangi tuğilgan çaqaloqda kalla qopqoği suyaklari biriktiruvçi töqimali liqildoqlar bilan birikkan, umurtqa poğonasida egriliklar deyarli yöq, köplab suyaklar alohida qismlardan iborat; skeletning suyaklanişi 20–25 yoşga kelib tugaydi."], "health": "Harakat rejimi har doim körsatma va qarşi körsatmalar hisobga olingan holda loyihalanadi hamda şifokor (ortoped, kardiolog) va moslaştirilgan jismoniy tarbiya yöriqçisi bilan kelişiladi. Talaba uçun: har 45–60 daqiqada 5–10 daqiqalik harakat tanaffuslari.", "read": "Qöllanma, 6.2-§ (tayanç-harakat apparati — harakat sohasini rivojlantiriş böyiça iş poydevori), 8.2-§ (moslaştirilgan jismoniy tarbiya bilan integratsiya), 8.3-keys. «Tayanç-harakat tizimi» amaliy maşğuloti konspekti (suyaklarning tuzilişi va tasnifi, birikişlari).", "l1": ["Umurtqa poğonasi çizmasida bölimlar va fiziologik egriliklarni belgilang hamda ularning şakllaniş yoşini körsating.", "«Qomat buzilişi turi — belgilari — profilaktika uçun maşqlar» jadvalini tuzing."], "l2": ["Bolaning harakat rejimini loyihalaşda körsatma va qarşi körsatmalarni hisobga oliş algoritmini tuzing: qanday tibbiy maʼlumotlar kerak, ularni kimdan söraş kerak, xulosa olinmagunça qaysi maşqlarni çiqarib taşlaş kerak.", "Vaziyatli masala. Yöriqçi Daun sindromi bölgan bola uçun maşğulotga umbaloq oşiş va batutda sakraşni kiritişni taklif qilmoqda, böyin qismining rentgenologik tekşiruvi ötkazilmagan. Taklifni anatomik nuqtai nazardan baholang va xavfsiz muqobil taklif qiling."], "l2check": ["Algoritm tibbiy maʼlumotlar manbalari va masʼul mutaxassislarni körsatadi", "Qarşi körsatmalar umurtqa poğonasi böyin qismi va böğimlarning tuzilişi bilan asoslangan", "Taklif qilingan muqobillar maşqlarning rivojlantiruvçi maqsadini saqlaydi"], "test": [{"q": "Umurtqa poğonasining fiziologik lordozlari —", "a": ["kökrak va dumğaza", "böyin va bel", "böyin va kökrak", "faqat bel"], "c": 1, "e": "Lordoz — oldinga, kifoz — orqaga egiliş."}, {"q": "Umurtqa poğonasining böyin egriligi qaçon şakllanadi?", "a": ["bola yura boşlaganda", "bola boşini tuta boşlaganda", "bola ötira boşlaganda", "bola tuğilganda"], "c": 1, "e": "Kökrak egriligi — ötirganda, bel egriligi — tik turiş va yurişda şakllanadi."}, {"q": "Skolioz —", "a": ["umurtqa poğonasining oldinga qiyşayişi", "umurtqa poğonasining yon tomonga qiyşayişi", "oyoq kaftining yassilanişi", "kökrak kifozining kattalaşuvi"], "c": 1, "e": "Skolioz — frontal tekislikdagi qiyşayiş."}, {"q": "Muşak tonusi —", "a": ["muşakning maksimal kuçi", "muşaklarning tinç holatda qomatni saqlab turadigan uzoq mötadil taranglaşuvi", "qisqariş tezligi", "muşak hajmi"], "c": 1, "e": "Gipotoniyada bolaga tana holatini saqlaş qiyinroq."}, {"q": "Daun sindromi bölgan bolalar uçun nima xos?", "a": ["spastiklik va reflekslarning oşişi", "muşak gipotoniyasi va böğimlar gipermobilligi", "oyoq muşaklari atrofiyasi", "barça bolalarda skolioz"], "c": 1, "e": "Bu motor rivojlaniş va qomat xususiyatlarini belgilaydi."}, {"q": "Atlanto-aksial beqarorlik xavfi bölganda şifokor xulosasigaça nima istisno qilinadi?", "a": ["yuriş", "umbaloq oşiş, boşda turiş va böyinga yuklama tuşadigan maşqlar", "nafas maşqlari", "ötirgan holda töp öyinlari"], "c": 1, "e": "Birinçi va ikkinçi böyin umurtqalari birikmasining beqarorligi orqa miya ezilişi xavfini tuğdiradi."}, {"q": "Yassi oyoqlik —", "a": ["oyoq kafti gumbazlarining yassilanişi", "boldirning qiyşayişi", "oyoq kaftining qisqarişi", "oyoq kaftining çiqişi"], "c": 0, "e": "Oyoq kafti gumbazlari yurişda amortizatsiyani taʼminlaydi."}, {"q": "Qomat buzilişlarining profilaktikasi nimani öz içiga oladi?", "a": ["faqat korset taqiş", "muşak korsetini mustahkamlaş, töğri iş holati va harakat faolligi", "harakatlarni çeklaş", "yumşoq töşakda uxlaş"], "c": 1, "e": "Bu bitta vosita emas, çora-tadbirlar majmuasi."}], "kase": {"title": "Behzod, 7 yoş: Daun sindromi, muşak gipotoniyasi", "norm": ["Muşak gipotoniyasi va böğimlar gipermobilligi qomat va motorikaga qanday taʼsir qiladi?", "Nega Daun sindromida umurtqa poğonasining böyin qismiga tuşadigan yuklama bilan ehtiyot böliş kerak?", "Harakat rejimini tuzişdan oldin sizga qanday tibbiy maʼlumotlar kerak?"], "portrait": "Behzodda Daun sindromi bor. Erta yoşida unga bölmaçalararo tösiq nuqsoni böyiça operatsiya qilingan, kardiolog mötadil jismoniy yuklamalarga ruxsat bergan. Muşak gipotoniyasi, yassi oyoqlik, bukçayiş kuzatiladi, ötirganda bola tez «çökib» qoladi. Umurtqa poğonasining böyin qismi rentgenologik tekşiruvdan ötkazilmagan. Behzod xuşmuomala, musiqani yaxşi köradi va kattalarga taqlid qiladi, intellektual rivojlanişi past. U inklyuziv sinfga qatnaydi, jismoniy tarbiya yöriqçisi uni umbaloq oşiş maşqlari bor umumiy maşğulotlarga qöşişni taklif qilmoqda.", "task": "Körsatma va qarşi körsatmalarni hisobga olgan holda Behzodning harakat sohasini rivojlantiriş va qomatini şakllantiriş böyiça marşrut fragmentini loyihalang: maşğulotlar boşlanişidan oldin nima qiliş kerak, qaysi maşq va öyinlarni kiritiş kerak, sinfda iş joyini qanday taşkil etiş kerak, yöriqçi, kardiolog va ortoped bilan rollarni qanday taqsimlaş kerak."}, "trainer": {"match": [["Osteon", "Suyak ziç moddasining tuzilmaviy-funksional birligi"], ["Suyak usti pardasi", "Suyakning yöğonlaşib ösişi va tiklanişini taʼminlaydi"], ["Diafiz", "Naysimon suyakning tanasi"], ["Epifiz", "Naysimon suyakning böğim hosil qilişda iştirok etuvçi uçi"], ["Sindesmoz", "Suyaklarning ziç biriktiruvçi töqima orqali birikişi"]], "odd": [{"items": ["böyin lordozi", "kökrak kifozi", "bel lordozi", "skolioz"], "odd": 3, "why": "Skolioz — yon tomonga qiyşayiş, fiziologik egrilik emas."}, {"items": ["boylamlar", "böğim disklari", "sinovial xaltalar", "muşak paylari"], "odd": 3, "why": "Muşak paylari böğimning yordamçi apparatiga kirmaydi."}], "yesno": [["Böyin egriligi bola boşini tuta boşlaganda şakllanadi", true], ["Kalla suyagi çoklari sindesmozlarga kiradi", true], ["Skolioz — umurtqa poğonasining oldinga qiyşayişi", false], ["Umurtqa poğonasining eng harakatçan qismi — böyin qismi", true], ["Bukiş va yoziş sagittal öq atrofida sodir böladi", false]]}, "schemes": ["bone", "joint", "spine"], "atlas": "IvGMA atlas-jadvallari (2012): 1–17, 19–20-rasmlar (öqlar va tekisliklar, suyak tuzilişi, skelet, umurtqa poğonasi, böğimlar, birikişlar, muşaklar)."}, {"id": "t8", "module": 3, "hours": 6, "title": "Vestibulyar analizator va sensorlararo özaro taʼsir", "goal": "Vestibulyar, köriş va proprioseptiv tizimlar muvozanatni birgalikda qanday taʼminlaşini tuşuniş hamda qöşma buzilişda marşrut loyihalaş.", "scheme": [["Dahliz: otolit apparatiga ega ellipssimon va şarsimon xaltaçalar", "Boş holati va töğri çiziqli tezlanişlarni idrok etiş", "Statik muvozanat buzilişlari"], ["Özaro perpendikulyar uç tekislikda joylaşgan uçta yarim doira kanal", "Burçak tezlanişlarini (boşning aylanişini) idrok etiş", "Boş aylanişi, nistagm; ikki tomonlama yöqolişda — beqarorlik"], ["VIII juftning vestibulyar qismi, miya ustunining vestibulyar yadrolari, ularning miyaça, közni harakatlantiruvçi yadrolar va orqa miya bilan aloqalari", "Vestibulo-okulyar va vestibulo-spinal reflekslar", "Harakatda nigohni barqarorlaştirişning buzilişi, tana holatining buzilişi"], ["Sensorlararo özaro taʼsir: vestibulyar, köriş va proprioseptiv tizimlar", "Muvozanat va fazoda möljal olişni birgalikda taʼminlaş", "Bitta tizim işdan çiqqanda boşqalari hisobiga kompensatsiya; ikkitasi işdan çiqqanda — muvozanatning qöpol buzilişi"]], "notes": ["Vestibulyar apparat va çiğanoq içki quloqda joylaşgan va bitta — dahliz-çiğanoq nervi orqali innervatsiya qilinadi, şuning uçun eşitiş va muvozanat bir vaqtda zararlanişi mumkin.", "Vestibulo-okulyar refleks boş harakatlanganda tasvirni tör pardada uşlab turadi.", "Nistagm — köz olmalarining ritmik ixtiyorsiz harakatlari.", "Vestibulyar funksiyasi ikki tomonlama yöqolgan bolaga qoronğida va notekis yuzada muvozanatni saqlaş ayniqsa qiyin: unda faqat propriotseptsiyaga tayaniş qoladi.", "Bakterial meningit içki quloqni şikastlaşi mumkin. Undan keyin eşitişni zudlik bilan baholaş kerak: çiğanoqning suyaklanişi ehtimoli bor, bu esa koxlear implantatsiyani qiyinlaştiradi."], "health": "Muvozanati buzilgan bola uçun xavfsiz muhit: yaxşi yoritiş, zinapoyada tutqiçlar, sirpanmaydigan qoplama, tösiqlarning yöqligi. Muvozanat maşqlari suğurta bilan va oddiydan murakkabga qarab bajariladi.", "read": "Qöllanma, 6.2-§ (vestibulyar analizator va uning köriş hamda proprioseptiv analizatorlar bilan özaro taʼsiri), 7.2-§ (inklyuziv muhitda biliş faoliyati).", "l1": ["Içki quloq modelida dahliz, yarim doira kanallar va çiğanoqni toping. Har bir tuzilma qaysi taʼsirlovçini idrok etişini yozing.", "«Muvozanatning uç tizimi» çizmasini çizing va har biri qanday maʼlumot berişini körsating."], "l2": ["Vaziyatli masala. Nega ikki tomonlama vestibulyar arefleksiyasi bor bola kunduzi deyarli işonç bilan yuradi, keçqurun esa yarim qoronği yölakda yiqiladi? Sensorlararo özaro taʼsir orqali tuşuntiring va muhitni özgartirişni taklif qiling.", "Köriş va propriotseptsiyaga tayangan holda, oddiydan murakkabga qarab, suğurtasini körsatib, muvozanatni rivojlantirişga qaratilgan 6–8 ta maşqdan iborat ketma-ketlik tuzing."], "l2check": ["Tuşuntirişda muvozanatning uçala tizimi va ularning hissasi nomlangan", "Maşqlar murakkabligi ortib boriş tartibida tuzilgan va xavfsiz", "Muhitdagi özgarişlar bevosita buziliş mexanizmidan kelib çiqadi"], "test": [{"q": "Vestibulyar apparat qayerda joylaşgan?", "a": ["örta quloqda", "içki quloqda", "miyaçada", "taşqi quloqda"], "c": 1, "e": "U içki quloqda çiğanoq yonida joylaşgan."}, {"q": "Yarim doira kanallar nimani idrok etadi?", "a": ["tovuşni", "burçak tezlanişlarini (boşning aylanişini)", "yoruğlikni", "oyoq kaftiga bosimni"], "c": 1, "e": "Kanallar özaro perpendikulyar uç tekislikda joylaşgan."}, {"q": "Dahlizning otolit apparati nimani idrok etadi?", "a": ["boş holati va töğri çiziqli tezlanişlarni", "aylanişni", "tovuş balandligini", "rangni"], "c": 0, "e": "Otolitlar oğirlik kuçi va tezlaniş taʼsirida siljiydi."}, {"q": "Vestibulo-okulyar refleks nimani taʼminlaydi?", "a": ["köz qoraçiğining torayişini", "boş harakatlanganda nigohning barqarorligini", "köz yoşi ajralişini", "akkomodatsiyani"], "c": 1, "e": "Usiz yurganda olam köz oldida «sakraydi»."}, {"q": "Muvozanat qaysi tizimlarning özaro taʼsiri bilan taʼminlanadi?", "a": ["eşitiş va taʼm biliş tizimlari", "vestibulyar, köriş va proprioseptiv tizimlar", "faqat vestibulyar tizim", "hid biliş va köriş tizimlari"], "c": 1, "e": "Bitta tizimning işdan çiqişi qisman boşqalari hisobiga kompensatsiya qilinadi."}, {"q": "Vestibulyar funksiyasi ikki tomonlama yöqolgan bolaga muvozanatni saqlaş qaçon ayniqsa qiyin?", "a": ["kunduzi tekis polda", "qoronğida va notekis yuzada", "partada ötirganda", "öqiyotganda"], "c": 1, "e": "Qoronğida köriş işlamaydi, notekis yuzada propriotseptsiya buziladi."}, {"q": "Bakterial meningitdan keyin eşitişni zudlik bilan baholaş nega muhim?", "a": ["eşitiş har doim öz-özidan tiklanadi", "koxlear implantatsiyani qiyinlaştiradigan çiğanoq suyaklanişi ehtimoli bor", "bu maktab talabi", "körişni tekşiriş kerak"], "c": 1, "e": "Bu holatda implantatsiya muddatlari hal qiluvçi ahamiyatga ega."}, {"q": "Nistagm —", "a": ["ğilaylik", "köz olmalarining ritmik ixtiyorsiz harakatlari", "gavharning xiralaşişi", "boş oğriği"], "c": 1, "e": "Nistagm köpinça vestibulyar buzilişlarga hamroh böladi."}], "kase": {"title": "Şerzod, 6 yoş: meningitdan keyingi karlik va vestibulyar buzilişlar", "norm": ["Nega meningit bir vaqtning özida eşitiş va muvozanatni şikastladi?", "Şerzodda muvozanatning qaysi tizimlari saqlangan va ularga qanday tayaniş mumkin?", "Keç kar bölib qolgan bolaning eşitiş-nutq reabilitatsiyasi tuğilganidan eşitmagan bola bilan işlaşdan nimasi bilan farq qiladi?"], "portrait": "Sakkiz oy oldin Şerzod bakterial meningitni boşidan ötkazgan. Ikki tomonlama karlik rivojlangan, tört oy oldin öng tomondan koxlear implantatsiya qilingan. Tekşiruv vestibulyar funksiyaning ikki tomonlama yöqolganini aniqlagan. Kasallikdan oldin bolaning nutqi yoşiga mos bölgan. Hozir u oyoqlarini keng qöyib, işonçsiz yuradi, notekis yuzada yiqiladi, zinapoya va qoronği xonalardan qörqadi, tengdoşlari bilan harakatli öyinlardan boş tortadi. Nutqi saqlangan, ammo baland va kamroq aniq bölib qolgan. Ota-onasi sarosimada va öğlini haddan taşqari ehtiyot qiladi.", "task": "Marşrutning kompleks fragmentini loyihalang: saqlangan nutqqa tayangan holda implantatsiyadan keyingi eşitiş-nutq işi, köriş va propriotseptsiyaga tayangan holda muvozanatni rivojlantiriş, uyda va bolalar boğçasida xavfsiz muhit, oilani psixologik qöllab-quvvatlaş, mutaxassislar jamoasida rollarni taqsimlaş."}, "trainer": {"match": [["Yarim doira kanallar", "Burçak tezlanişlarini idrok etadi"], ["Otolit apparati", "Boş holati va töğri çiziqli tezlanişlarni idrok etadi"], ["Vestibulo-okulyar refleks", "Boş harakatlanganda nigohni barqarorlaştiradi"], ["Propriotseptsiya", "Tana qismlarining holati va harakatini his qiliş"], ["Nistagm", "Közlarning ritmik ixtiyorsiz harakatlari"]], "odd": [{"items": ["vestibulyar tizim", "körişni", "propriotseptsiya", "hid biliş"], "odd": 3, "why": "Hid biliş muvozanatni saqlaşda iştirok etmaydi."}, {"items": ["ellipssimon xaltaça", "şarsimon xaltaça", "yarim doira kanallar", "noğora parda"], "odd": 3, "why": "Noğora parda eşitiş organiga, qolganlari esa vestibulyar apparatga kiradi."}], "yesno": [["Vestibulyar apparat örta quloqda joylaşgan", false], ["Qoronğida vestibulyar arefleksiyasi bor bolaga muvozanatni saqlaş qiyinroq", true], ["Çiğanoq va vestibulyar apparatni boş miya nervlarining bitta jufti innervatsiya qiladi", true], ["Yarim doira kanallar tovuşni idrok etadi", false], ["Bakterial meningitdan keyin eşitişni zudlik bilan baholaş kerak", true]]}, "schemes": ["ear"], "atlas": "IvGMA atlas-jadvallari (2012): 53, 55-rasmlar (eşitiş va muvozanat organi, suyak labirint)."}, {"id": "t9", "module": 3, "hours": 8, "final": true, "title": "Yakuniy loyiha: individual korreksion marşrut", "goal": "«Tuziliş — funksiya — buziliş» umumiy usulini bolaning töliq marşrutiga qöllaş va kurs portfoliosini yiğiş.", "scheme": [], "notes": ["Kursdagi portretlardan birini (1–8-keyslar) yoki öqituvçi taklif qilgan portretni tanlang.", "1–8-mavzular keyslaridan farqli ölaroq, bu yerda töliq marşrut loyihalanadi: maqsad, bosqiçlar, barça mutaxassislarning iş yönalişlari, rejim, monitoring.", "Yakuniy test kurs bankidagi 15 ta savoldan tasodifiy tuziladi. Qayta urinişda yangi töplam şakllanadi.", "Kurs portfoliosi «Natijalarim va hisobot» bölimida şakllanadi: test natijalari, keys yeçimlari, kundalik."], "health": "Yakuniy loyiha 7–10 kun içida bajariladi. Işni oxirgi keçaga emas, kunlarga taqsimlang: bu kurs talabi, şunçaki istak emas.", "read": "Qöllanma, 4.3-§ (keys tuzilmasi), 6.3-§ (salomatlikni saqlaş kompetensiyasi), 7.1–7.3-§§ (inklyuziv kontekst).", "l1": ["Keyslar böyiça yeçimlaringizni qayta öqing va har birida nima anatomik-fiziologik material bilan asoslangan-u, nima asoslanmaganini belgilang."], "l2": ["Tanlangan bola uçun mutaxassislar xaritasini tuzing: kim iştirok etadi, nima uçun javob beradi, siz ular bilan qançalik tez-tez hamkorlik qilasiz."], "l2check": ["Xarita tibbiyot mutaxassislari, pedagoglar va oilani qamrab oladi", "Har bir mutaxassis uçun masʼuliyat sohasi belgilangan"], "test": [], "kase": {"title": "Töliq individual korreksion marşrut", "norm": ["Tanlangan bolada qaysi tizimning qaysi böğini buzilgan va bundan barça iş yönalişlari uçun nima kelib çiqadi?", "Rejimda soğliqning qanday hamroh çeklovlarini hisobga oliş kerak?"], "portrait": "", "task": "Tanlangan bolaning öquv yili uçun töliq individual korreksion marşrutini loyihalang: maqsad, bosqiçlar, iş yönalişlari va vazifalar, usullar, salomatlikni saqlovçi rejim, monitoring mezonlari va muddatlari, mutaxassislar va oila bilan hamkorlik. Guruhda muhokama qiliş uçun 7 daqiqalik nutq tayyorlang."}}], "anatomyGlossary": [["Akkomodatsiya", "Közning gavhar egriligini özgartiriş hisobiga turli masofadagi narsalarga fokuslaniş qobiliyati."], ["Ataksiya", "Muşak kuçi saqlangan holda harakatlar koordinatsiyasining buzilişi; miyaça şikastlanişi uçun xos."], ["Afferent neyron", "Qözğalişni retseptordan markaziy nerv tizimiga ötkazuvçi sezuvçi neyron."], ["Geteroxroniya", "Ontogenezda organizm funksional tizimlari yetilişining notekisligi."], ["Muşak gipotoniyasi", "Muşak tonusining pasayişi; tana holatini saqlaşni qiyinlaştiradi va motor rivojlanişni sekinlaştiradi."], ["Dizartriya", "Nutq apparati innervatsiyasining yetişmasligi oqibatida nutqning talaffuz tomonining buzilişi."], ["Broka sohasi", "Dominant yarim şar pastki peşona puştasining orqa qismlari; nutqning motor taşkil etilişini taʼminlaydi."], ["Vernike sohasi", "Dominant yarim şar yuqori çakka puştasining orqa qismlari; nutqni tuşunişni taʼminlaydi."], ["Korti organi", "Çiğanoqning tovuş tebranişlarini nerv impulsiga aylantiruvçi tukli hujayralarga ega retseptor apparati."], ["Nistagm", "Köz olmalarining ritmik ixtiyorsiz harakatlari."], ["Piramida yöli", "Markaz oldi puştasidan orqa miya motoneyronlarigaça boruvçi ixtiyoriy harakatlarning pöstloq-orqa miya yöli."], ["Miya plastikligi", "Nerv tizimining tajriba va taʼlim taʼsirida tuzilişi va funksiyalarini özgartiriş qobiliyati; erta yoşda eng yuqori böladi."], ["Propriotseptsiya", "Muşaklar, paylar va böğimlar retseptorlari taʼminlaydigan tana qismlarining holati va harakatini his qiliş."], ["Refleks yoyi", "Qözğalişning retseptordan markaziy nerv tizimi orqali işçi organgaça bölgan yöli."], ["Sensonevral quloq oğirligi", "Içki quloq yoki eşitiş nervining şikastlanişi oqibatida eşitişning pasayişi."], ["Konduktiv quloq oğirligi", "Taşqi yoki örta quloqda tovuş ötkazilişining buzilişi oqibatida eşitişning pasayişi."], ["Spastiklik", "Markaziy harakat yöllari şikastlanganda muşak tonusining oşişi."], ["Xiazma", "Köruv nervlari tolalarining kesişişi; unda tör pardalarning içki yarmidan keladigan tolalar qarama-qarşi tomonga ötadi."], ["Iş qobiliyati egri çiziği", "Teng vaqt oraliqlarida iş hajmi va sifati dinamikasining grafik tasviri."], ["Atlanto-aksial beqarorlik", "Birinçi va ikkinçi böyin umurtqalari birikmasidagi ortiqça harakatçanlik; böyinga tuşadigan yuklamalarni çeklaşni talab qiladi."]], "pedGlossaryKeep": ["Biliş faoliyatini faollaştiriş", "Harakatning darajalangan möljal asosi", "Defektologning salomatlikni saqlaş kompetensiyasi", "Korreksion-biliş keysi", "Fanlararo integratsiya", "Biliş faoliyati", "Öz-özini öqitiş", "Mustaqil iş", "Mustaqil t
