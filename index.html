<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анатомия и физиология — курс самостоятельной работы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#1D2A31; --muted:#56656C; --line:#D3DAD8; --soft:#E8EDEB;
  --l1:#2E5A88; --l2:#9A6B0F; --l3:#A3302A;
  --l1-bg:#E6EEF6; --l2-bg:#F6EEDC; --l3-bg:#F7E5E3;
  --ok:#2F6B47; --focus:#2E5A88;
  --serif:"PT Serif", Georgia, "Times New Roman", serif;
  --sans:"PT Sans", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11181C; --surface:#172126; --ink:#E4EAE8; --muted:#9AA8AE; --line:#2B3940; --soft:#1E2A30;
    --l1:#86AEDB; --l2:#D9AE52; --l3:#E58A80;
    --l1-bg:#1B2B3B; --l2-bg:#2F2714; --l3-bg:#35201E;
    --ok:#7CC49A; --focus:#86AEDB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11181C; --surface:#172126; --ink:#E4EAE8; --muted:#9AA8AE; --line:#2B3940; --soft:#1E2A30;
  --l1:#86AEDB; --l2:#D9AE52; --l3:#E58A80;
  --l1-bg:#1B2B3B; --l2-bg:#2F2714; --l3-bg:#35201E;
  --ok:#7CC49A; --focus:#86AEDB; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--l1)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
h1{font-size:clamp(1.7rem,3.2vw,2.4rem)}
h2{font-size:1.45rem}
h3{font-size:1.12rem}
p{margin:.5em 0}

/* ---------- каркас ---------- */
.top{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:700;font-size:1.1rem}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.82rem;color:var(--muted)}
.timer{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.timer b{font-variant-numeric:tabular-nums;color:var(--ink)}
.topright{display:flex;align-items:center;gap:14px}
.langsw{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;flex:none}
.langsw button{background:transparent;border:0;padding:5px 10px;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--ink);min-width:2.6em}
.langsw button+button{border-left:1.5px solid var(--ink)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.langsw button:focus-visible{outline-offset:-4px}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 64px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 40px}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:980px;width:100%}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.navbtn:hover{background:var(--soft)}
.navbtn[aria-current="page"]{background:var(--soft);font-weight:700}
.modlabel{font-size:.8rem;color:var(--muted);margin:18px 10px 4px}
.navsep{border:0;border-top:1px solid var(--line);margin:14px 6px}
.mobile-nav{display:none}

/* ---------- лестница уровней (фирменный элемент) ---------- */
.ladder{display:inline-flex;align-items:flex-end;gap:3px;flex:none}
.ladder i{display:block;width:7px;border:1.5px solid;border-radius:1px}
.ladder i:nth-child(1){height:8px;border-color:var(--l1)}
.ladder i:nth-child(2){height:13px;border-color:var(--l2)}
.ladder i:nth-child(3){height:18px;border-color:var(--l3)}
.ladder i.on:nth-child(1){background:var(--l1)}
.ladder i.on:nth-child(2){background:var(--l2)}
.ladder i.on:nth-child(3){background:var(--l3)}

.stairs{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:0;margin:26px 0 8px}
.step{padding:16px 18px 18px;border-top:6px solid;background:var(--surface)}
.step:nth-child(1){min-height:150px;border-color:var(--l1);background:var(--l1-bg)}
.step:nth-child(2){min-height:200px;border-color:var(--l2);background:var(--l2-bg)}
.step:nth-child(3){min-height:250px;border-color:var(--l3);background:var(--l3-bg)}
.step h3{margin-bottom:6px}
.step:nth-child(1) h3{color:var(--l1)} .step:nth-child(2) h3{color:var(--l2)} .step:nth-child(3) h3{color:var(--l3)}
.step p{font-size:.95rem;margin:0}
.stairs.small{margin:14px 0 4px}
.stairs.small .step{padding:10px 12px;min-height:0}
.stairs.small .step:nth-child(1){min-height:54px} .stairs.small .step:nth-child(2){min-height:72px} .stairs.small .step:nth-child(3){min-height:90px}
.stairs.small .step p{font-size:.85rem}
.step.locked{opacity:.55}

/* ---------- содержимое ---------- */
.lead{font-family:var(--serif);font-size:1.15rem;max-width:68ch}
.meta{color:var(--muted);font-size:.92rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin:22px 0 22px}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:700}
.tab .lock{font-size:.8rem}
.block{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 22px;margin:0 0 18px}
.block.l1{border-left:6px solid var(--l1)} .block.l2{border-left:6px solid var(--l2)} .block.l3{border-left:6px solid var(--l3)}
.block h3{margin-bottom:10px}
.lvtag{font-size:.85rem;font-weight:700}
.l1 .lvtag{color:var(--l1)} .l2 .lvtag{color:var(--l2)} .l3 .lvtag{color:var(--l3)}
.scroll{overflow-x:auto}
table.scheme{border-collapse:collapse;width:100%;min-width:640px;font-size:.95rem}
table.scheme th{text-align:left;font-family:var(--sans);font-size:.88rem;padding:10px 12px;border-bottom:2px solid var(--ink)}
table.scheme td{vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
table.scheme td:first-child{font-family:var(--serif);font-weight:700;width:34%}
.arrowcol{color:var(--muted)}
ul.notes{padding-left:1.2em;max-width:72ch} ul.notes li{margin:.45em 0}
.health{background:var(--l1-bg);border-radius:4px;padding:14px 18px;max-width:72ch}
.task{margin:0 0 18px}
.task p{margin:0 0 8px;max-width:72ch}
textarea{width:100%;min-height:96px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
input[type=text],input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
label.field{display:block;font-weight:700;margin:14px 0 4px}
.hint{display:block;font-weight:400;font-size:.88rem;color:var(--muted)}
.btn{display:inline-block;border:1.5px solid var(--ink);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:4px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lockbox{border:1.5px dashed var(--line);border-radius:4px;padding:18px 20px;color:var(--muted)}
.checks label{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.checks input{margin-top:5px}
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q legend{font-weight:700;margin-bottom:6px;padding:0}
.q fieldset{border:0;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:4px}
.opt input{margin-top:5px}
.opt.right{background:var(--l1-bg)} .opt.wrong{background:var(--l3-bg)}
.expl{font-size:.92rem;color:var(--muted);margin:6px 8px 0}
.score{font-family:var(--serif);font-size:1.3rem;font-weight:700}
.ok{color:var(--ok)}
.portrait{font-family:var(--serif);font-size:1.05rem;line-height:1.6;max-width:70ch}
.comp{font-size:.85rem;color:var(--muted);font-weight:700}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate label{border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.rate input{margin-right:6px}
table.prog{border-collapse:collapse;width:100%;min-width:560px}
table.prog th,table.prog td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.prog th{font-size:.88rem;border-bottom:2px solid var(--ink)}
.gl dt{font-family:var(--serif);font-weight:700;margin-top:14px}
.gl dd{margin:2px 0 0;max-width:72ch}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:360px;background:var(--ink);color:var(--surface);padding:14px 16px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20}
.toast p{margin:0 0 10px}
.toast .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);padding:6px 12px}
.toast .btn.ghost{background:transparent;color:var(--surface)}
.curve svg{width:100%;height:auto;max-width:640px;display:block}
.curve table input{width:70px}
.curve table td,.curve table th{padding:4px 8px;text-align:center}
.small{font-size:.9rem}
.warn{color:var(--l3);font-weight:700}
.trrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 10px;border-radius:4px;border-bottom:1px solid var(--line)}
.trrow.right{background:var(--l1-bg)} .trrow.wrong{background:var(--l3-bg)}
.trterm{flex:1 1 240px}
.trrow select{flex:1 1 280px;max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.trchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:4px 10px;margin:2px 4px 2px 0;cursor:pointer;background:var(--surface)}
.trfix{flex-basis:100%;font-size:.88rem;color:var(--muted)}
.trainer h4{font-family:var(--serif);font-size:1.02rem;margin:18px 0 6px}
.trainer fieldset{border:0;padding:0;margin:0}
.sr{position:absolute;left:-9999px}
.schemewrap{overflow-x:auto} .schemewrap svg{width:100%;min-width:420px;height:auto;max-width:660px;display:block;margin:0 auto 12px}
.schemegrid .num{font-weight:700;min-width:1.6em}
.pbadge{font-size:.8rem;color:var(--muted)}
.tech dt{font-family:var(--serif);font-weight:700;margin-top:12px}
.tech dd{margin:2px 0 0;max-width:72ch}
.mt{margin-top:18px}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  main{min-width:0}
  .trrow select{flex-basis:100%}
  nav.side{display:none}
  .mobile-nav{display:block;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px}
  .mobile-nav select{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
  .stairs{grid-template-columns:1fr;gap:6px}
  .step:nth-child(n){min-height:0}
  .top{padding:10px 16px}
  .timer .lbl{display:none}
}
@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .25s ease-out} @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span id="brandname">Анатомия и физиология</span><small id="brandsub">Курс самостоятельной работы для будущих дефектологов</small></div>
  <div class="topright">
    <div class="langsw" id="langsw" role="group" aria-label="Язык курса"><button type="button" data-lang="ru" lang="ru" aria-label="Русский" title="Русский" aria-pressed="true">RU</button><button type="button" data-lang="uz" lang="uz-Latn" aria-label="Özbekça" title="Özbekça" aria-pressed="false">UZ</button></div>
    <div class="timer" id="timer"></div>
  </div>
</header>
<div class="mobile-nav"><label class="hint" for="mnav" id="mnavlbl">Раздел курса</label><select id="mnav"></select></div>
<div class="wrap">
  <nav class="side" id="side" aria-label="Содержание курса"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toastbox" aria-live="polite"></div>
<script>
const COURSE_RU = {"title":"Анатомия и физиология","subtitle":"Электронный курс самостоятельной работы для будущих дефектологов","author":"Миркамалов Ф.Р.","modules":[{"n":1,"title":"Анатомо-физиологические основы дефектологии"},{"n":2,"title":"Профессиональная диагностика в условиях цифровой среды"},{"n":3,"title":"Проектирование индивидуальных коррекционных маршрутов"}],"levels":[{"n":1,"name":"Репродуктивный","ood":"Схема анализа дана в готовом виде. Вы работаете по образцу и проверяете себя тестом."},{"n":2,"name":"Продуктивный","ood":"Схему анализа вы частично строите сами по образцу. Открывается, когда тест темы сдан на 6 из 8 и выше."},{"n":3,"name":"Творческий","ood":"Вы сами применяете общий метод «строение — функция — нарушение» к случаю ребёнка. Открывается после заданий второго уровня."}],"projectFields":[{"k":"dir","label":"Обоснование направления коррекции","hint":"Опирайтесь на анатомо-физиологический норматив: какое звено нарушено и что из этого следует для работы."},{"k":"tasks","label":"Коррекционные задачи (3–4)","hint":"Конкретные, проверяемые, сформулированные от лица педагога."},{"k":"methods","label":"Методы и формы работы с обоснованием","hint":"Почему именно эти методы подходят при данном механизме нарушения."},{"k":"lesson","label":"Фрагмент занятия","hint":"Этапы, длительность, чередование видов деятельности, паузы."},{"k":"forecast","label":"Прогноз и критерии результата","hint":"Что изменится через 2–3 месяца и как вы это увидите."},{"k":"team","label":"Взаимодействие со специалистами и семьёй","hint":"Кто ещё участвует и что вы предложите родителям."}],"reflectionFields":[{"k":"strong","label":"Сильные стороны моего решения"},{"k":"risks","label":"Ограничения и риски"},{"k":"questions","label":"Вопросы для дальнейшей профессиональной работы"},{"k":"health","label":"Насколько решение согласуется с принципом здоровьесбережения"}],"diaryFields":[{"k":"understood","label":"Что я понял(а) по теме"},{"k":"difficult","label":"Что вызвало затруднение и как я с ним справился(ась)"},{"k":"ai_h","label":"ИИ, шаг 1. Моя гипотеза до обращения к модели","ai":true},{"k":"ai_q","label":"ИИ, шаг 2. Мой вопрос модели","ai":true},{"k":"ai_v","label":"ИИ, шаг 3. Что я проверил(а) по учебнику или атласу и какие нашёл(ла) расхождения","ai":true},{"k":"ai_r","label":"ИИ, шаг 4. Что изменилось в моём понимании","ai":true},{"k":"load","label":"Нагрузка: сколько дней и минут заняла тема, соблюдались ли перерывы"}],"rubric":["Решение опирается на анатомо-физиологический норматив, механизм нарушения назван верно","Коррекционные задачи конкретны, проверяемы и вытекают из механизма нарушения","Методы и формы обоснованы и соответствуют возрасту и состоянию ребёнка","Занятие организовано здоровьесберегающе: дозировка, чередование, паузы, противопоказания","Прогноз реалистичен, критерии результата наблюдаемы","Предусмотрено взаимодействие со специалистами и семьёй"],"literature":["Миркамалов Ф.Р. Активизация познавательной деятельности будущих дефектологов в процессе их самостоятельного образования: учебное пособие. — Ташкент, 2026.","Сапин М.Р., Сивоглазов В.И. Анатомия и физиология человека (с возрастными особенностями детского организма).","Нейман Л.В., Богомильский М.Р. Анатомия, физиология и патология органов слуха и речи.","Обреимова Н.И., Петрухин А.С. Основы анатомии, физиологии и гигиены детей и подростков.","Бадалян Л.О. Невропатология.","Безруких М.М., Сонькин В.Д., Фарбер Д.А. Возрастная физиология (физиология развития ребёнка).","Миркамалов Ф.Р., Шахмурова Г.А. Анатомия человека: учебно-методические рекомендации по самостоятельным работам. — Ташкент: ТГПУ им. Низами, 2012.","Анатомия человека: учебное пособие для иностранных учащихся довузовского этапа обучения. Таблицы. Приложение 1 / С.И. Катаев, Е.В. Орлова, Н.В. Черненко, Т.В. Лазоренко; под ред. Е.В. Орловой. — Иваново: ИвГМА, 2012. — 39 с.","Ткаченко Т.А. Логопедическая энциклопедия. — М.: Мир книги, 2008. — 248 с.","Галеева Н.Л. Сто приёмов учебного успеха ученика на уроках биологии: методическое пособие для учителя. — М.: 5 за знания, 2006.","Тамарская Н.В., Семёнова И.О. Старшекласснику — будущему педагогу об управлении: учебное пособие. — Калининград: Изд-во КГУ, 2003. — 167 с."],"themes":[{"id":"t1","module":1,"hours":6,"title":"Нервная система и рефлекторный принцип","goal":"Понять, как строение нервной системы определяет движения и поведение ребёнка и почему поражение разных её звеньев даёт разные двигательные нарушения.","scheme":[["Нейрон: тело, дендриты, аксон, синапс","Приём, проведение и передача возбуждения","Гибель нейронов, нарушение миелинизации: выпадение функций, замедление проведения"],["Рефлекторная дуга: рецептор, афферентный, вставочный, эфферентный нейрон, эффектор","Рефлекторный ответ на раздражение","Поражение любого звена: выпадение или извращение рефлекса"],["Спинной мозг","Рефлекторная и проводниковая функции","Нарушение движений и чувствительности ниже уровня поражения"],["Пирамидный (корково-спинномозговой) путь: прецентральная извилина — перекрёст в продолговатом мозге — мотонейроны передних рогов","Произвольные движения","Центральный (спастический) парез: повышение тонуса и сухожильных рефлексов, патологические рефлексы"],["Мозжечок","Координация движений, равновесие, регуляция тонуса","Атаксия, неустойчивость, интенционное дрожание"],["Подкорковые (базальные) ядра","Автоматизированные движения, регуляция тонуса","Гиперкинезы, колебания тонуса"],["Доли коры больших полушарий","Лобная — программирование и контроль, моторная кора; теменная — кожно-мышечная чувствительность; височная — слух; затылочная — зрение","Специфические нарушения в зависимости от зоны поражения"]],"notes":["Центральную нервную систему образуют головной и спинной мозг, периферическую — нервы и нервные узлы. По функции выделяют соматическую и вегетативную нервную систему.","Рефлекс — ответная реакция организма на раздражение при участии нервной системы. Материальная основа рефлекса — рефлекторная дуга.","Миелинизация нервных волокон продолжается в течение детства и подросткового возраста, поэтому скорость и точность движений у детей возрастают постепенно.","Пластичность мозга наиболее высока в раннем возрасте. Это физиологическое основание раннего начала коррекционной работы.","Детский церебральный паралич — группа непрогрессирующих двигательных нарушений, вызванных поражением развивающегося мозга во внутриутробном, родовом или раннем постнатальном периоде.","Спастическая диплегия — частая форма ДЦП у недоношенных детей. Её типичная причина — перивентрикулярная лейкомаляция: повреждение белого вещества около боковых желудочков, где проходят волокна к нижним конечностям. Поэтому ноги страдают сильнее рук."],"health":"Психогигиена учебного труда: нервная система ребёнка и студента нуждается в чередовании нагрузки и отдыха. Для ребёнка с ДЦП резкие и чрезмерные усилия, холод и эмоциональное напряжение усиливают спастичность, поэтому занятия строятся в спокойном темпе, с правильным положением тела и паузами.","read":"Пособие, § 6.2 (нейроанатомия как фундамент компетенций), § 8.2 (интеграция с адаптивной физической культурой).","l1":["Изучите ориентировочную схему темы и найдите в атласе или трёхмерной модели все названные структуры. Подпишите на контурном рисунке головного мозга доли коры, мозжечок, ствол и прецентральную извилину.","Начертите рефлекторную дугу коленного рефлекса и подпишите все её звенья. Укажите, какое звено нарушено, если рефлекс отсутствует при сохранной мышце.","Составьте глоссарий темы из 10 терминов с краткими определениями."],"l2":["Ситуационная задача «уровень поражения — проявление нарушения». Сравните два случая: у одного ребёнка повышен тонус мышц ног и усилены коленные рефлексы, у другого — шаткая походка, промахивание при пальце-носовой пробе, тонус снижен. Определите, какое звено двигательной системы предположительно поражено в каждом случае, и обоснуйте вывод схемой темы.","Обобщите понятия темы: постройте схему функциональной системы произвольного движения от замысла в лобной коре до сокращения мышцы, включив мозжечок и подкорковые ядра как звенья регуляции."],"l2check":["Каждое проявление нарушения соотнесено с конкретной структурой","Вывод обоснован строением пути или функцией структуры, а не только названием болезни","Схема функциональной системы включает звенья программирования, исполнения и контроля"],"test":[{"q":"Структурно-функциональная единица нервной системы — это","a":["нейрон","нефрон","синапс","миелиновая оболочка"],"c":0,"e":"Нейрон принимает, проводит и передаёт возбуждение. Синапс — место контакта нейронов, а не самостоятельная единица."},{"q":"Возбуждение от рецептора в центральную нервную систему передаёт","a":["эфферентный (двигательный) нейрон","афферентный (чувствительный) нейрон","вставочный нейрон","эффектор"],"c":1,"e":"Афферентный нейрон проводит возбуждение к центру, эфферентный — от центра к рабочему органу."},{"q":"Произвольные движения обеспечивает","a":["пирамидный (корково-спинномозговой) путь","зрительный путь","ретикулярная формация","блуждающий нерв"],"c":0,"e":"Пирамидный путь начинается в прецентральной извилине и заканчивается на мотонейронах передних рогов спинного мозга."},{"q":"Для центрального (спастического) пареза характерно","a":["снижение тонуса и отсутствие рефлексов","повышение тонуса и сухожильных рефлексов","атрофия мышц и подёргивания волокон","нарушение только чувствительности"],"c":1,"e":"При поражении пирамидного пути спинальные рефлексы освобождаются от коркового контроля: тонус и рефлексы повышаются."},{"q":"Координацию движений и равновесие обеспечивает прежде всего","a":["продолговатый мозг","мозжечок","затылочная доля","гипофиз"],"c":1,"e":"Поражение мозжечка вызывает атаксию: шаткость, неточность и несоразмерность движений."},{"q":"Двигательная (моторная) зона коры расположена в","a":["постцентральной извилине","прецентральной извилине лобной доли","верхней височной извилине","шпорной борозде"],"c":1,"e":"Постцентральная извилина — зона кожно-мышечной чувствительности, верхняя височная — слуховая, шпорная борозда — зрительная."},{"q":"При спастической диплегии у недоношенных детей типично поражение","a":["перивентрикулярного белого вещества","мозжечка","периферических нервов ног","мышц ног"],"c":0,"e":"Перивентрикулярная лейкомаляция затрагивает волокна к нижним конечностям, поэтому ноги страдают сильнее рук."},{"q":"Физиологическое основание раннего начала коррекционной работы —","a":["завершённая миелинизация к рождению","высокая пластичность мозга в раннем возрасте","отсутствие рефлексов у новорождённого","раннее созревание лобных долей"],"c":1,"e":"Миелинизация у ребёнка не завершена, а пластичность мозга в раннем возрасте наибольшая."}],"kase":{"title":"Азиз, 6 лет: спастическая диплегия","norm":["Проследите ход пирамидного пути и объясните, почему при его поражении тонус мышц повышается.","Почему при перивентрикулярной лейкомаляции ноги страдают сильнее рук?","Какие условия усиливают спастичность и как это учитывать на занятии?"],"portrait":"Азиз родился на 32-й неделе беременности. По данным нейросонографии — перивентрикулярная лейкомаляция, невролог установил ДЦП, форма спастическая диплегия. Сейчас мальчику 6 лет, он посещает подготовительную группу инклюзивного детского сада. Ходит с опорой на руку взрослого: на носках, с перекрёстом ног. Руки участвуют в действиях, но мелкие движения (застёгивание пуговиц, работа карандашом) неловкие и медленные. Интеллектуальное развитие близко к возрастной норме, в речи — лёгкие дизартрические проявления. К середине занятия Азиз устаёт, начинает отвлекаться. Мама очень активна и просит «научить его ходить за лето». Ребёнок занимается с инструктором лечебной физкультуры.","task":"Спроектируйте фрагмент индивидуального маршрута по развитию двигательной сферы и бытовой самостоятельности Азиза на 2–3 месяца, согласованный с работой инструктора лечебной физкультуры. Отдельно продумайте, как объяснить маме реалистичные цели."},"trainer":{"match":[["Нейрон","Структурно-функциональная единица нервной системы"],["Синапс","Место контакта нейронов, где передаётся возбуждение"],["Афферентный нейрон","Проводит возбуждение от рецептора в ЦНС"],["Эфферентный нейрон","Проводит возбуждение от ЦНС к рабочему органу"],["Мозжечок","Координация движений и равновесие"]],"odd":[{"items":["лобная доля","теменная доля","мозжечок","затылочная доля"],"odd":2,"why":"Мозжечок не является долей коры больших полушарий."},{"items":["рецептор","афферентный нейрон","эффектор","гипофиз"],"odd":3,"why":"Гипофиз - эндокринная железа, а не звено рефлекторной дуги."}],"yesno":[["Центральную нервную систему образуют головной и спинной мозг",true],["Пирамидный путь перекрещивается в продолговатом мозге",true],["При поражении мозжечка развивается спастический парез",false],["Миелинизация нервных волокон завершается к рождению",false],["Двигательная кора расположена в прецентральной извилине",true]]},"schemes":["reflex","brain"],"atlas":"атлас-таблицы ИвГМА (2012): рис. 45–51 (рефлекторная дуга, спинной мозг, разрезы головного мозга, черепные нервы, сплетения)."},{"id":"t2","module":1,"hours":6,"title":"Слуховой анализатор","goal":"Связать строение отделов уха и слухового пути с видами нарушений слуха и выбором направлений сурдопедагогической работы.","scheme":[["Наружное ухо: ушная раковина, наружный слуховой проход","Улавливание и проведение звуковых волн","Серная пробка, атрезия прохода: кондуктивное снижение слуха"],["Среднее ухо: барабанная перепонка, молоточек, наковальня, стремечко; слуховая (евстахиева) труба","Проведение и усиление звуковых колебаний, выравнивание давления","Отит, экссудат, повреждение перепонки: кондуктивная тугоухость"],["Внутреннее ухо: улитка, кортиев орган с волосковыми клетками","Преобразование механических колебаний в нервный импульс","Повреждение волосковых клеток: сенсоневральная тугоухость"],["Улитковая часть преддверно-улиткового нерва (VIII пара), слуховые пути ствола","Проведение импульса в мозг","Слуховая нейропатия, ретрокохлеарные нарушения"],["Височная доля: поперечные извилины (первичная слуховая кора), зона Вернике","Анализ звуков, понимание речи","Нарушение понимания речи при сохранном слухе"]],"notes":["Человек воспринимает звуки частотой примерно от 16 до 20 000 Гц. Для понимания речи особенно важен диапазон примерно 500–4000 Гц.","Степени тугоухости по средней потере слуха в речевом диапазоне: I — 26–40 дБ, II — 41–55 дБ, III — 56–70 дБ, IV — 71–90 дБ, более 90 дБ — глухота.","Кондуктивная тугоухость связана с нарушением проведения звука в наружном или среднем ухе и часто поддаётся лечению. Сенсоневральная связана с поражением внутреннего уха или слухового нерва и обычно необратима.","Слуховой аппарат усиливает звук. Кохлеарный имплант электрически стимулирует волокна слухового нерва, минуя повреждённые волосковые клетки.","Ранее выявление нарушения слуха (аудиологический скрининг новорождённых) и ранняя слухопротезная помощь определяют возможности развития речи."],"health":"Гигиена слуха: защита от шума, громкость наушников не выше 60% и не дольше 60 минут подряд, своевременное лечение отитов, осторожность с ототоксическими препаратами (только по назначению врача). Для самого дефектолога работа с детьми с нарушением слуха означает высокую голосовую нагрузку.","read":"Пособие, § 4.3 (образец кейса «Слуховой анализатор»), § 8.3 (интегративный здоровьесберегающий блок на примере слухового анализатора).","l1":["По трёхмерной модели или атласу проследите путь звука от ушной раковины до коры. Запишите последовательность из 8–10 звеньев.","Заполните таблицу «отдел уха — структуры — функция» по образцу ориентировочной схемы.","Составьте мнемоническую фразу для запоминания слуховых косточек в порядке передачи колебаний."],"l2":["Ситуационная задача. Ребёнок 1: потеря слуха 35 дБ, частые отиты, после лечения слух улучшается. Ребёнок 2: потеря слуха 65 дБ с рождения, костное и воздушное проведение снижены одинаково. Определите тип и степень нарушения слуха у каждого и звено слухового анализатора, которое предположительно поражено.","Объясните, почему ребёнку с сенсоневральной тугоухостью III степени недостаточно говорить громче, и какие технические средства и педагогические приёмы нужны вместо этого."],"l2check":["Тип нарушения определён через звено анализатора (проведение или восприятие)","Степень нарушения определена по классификации в децибелах","Педагогические выводы следуют из механизма, а не названы произвольно"],"test":[{"q":"Звуковые колебания преобразуются в нервный импульс в","a":["барабанной перепонке","слуховых косточках","волосковых клетках кортиева органа","слуховой трубе"],"c":2,"e":"Волосковые клетки кортиева органа — рецепторы слухового анализатора."},{"q":"Слуховые косточки находятся в","a":["наружном ухе","среднем ухе","внутреннем ухе","височной доле"],"c":1,"e":"Молоточек, наковальня и стремечко передают колебания от барабанной перепонки к окну преддверия."},{"q":"При кондуктивной тугоухости нарушено","a":["проведение звука в наружном или среднем ухе","работа волосковых клеток","проведение по слуховому нерву","анализ звуков в коре"],"c":0,"e":"Кондуктивная — от слова «проводить»: звук плохо доходит до внутреннего уха."},{"q":"Сенсоневральная тугоухость связана прежде всего с","a":["серной пробкой","поражением волосковых клеток или слухового нерва","воспалением среднего уха","перфорацией перепонки"],"c":1,"e":"Нарушено звуковосприятие, поэтому простое усиление звука не восстанавливает его разборчивость полностью."},{"q":"Первичная слуховая кора расположена в","a":["затылочной доле","височной доле","прецентральной извилине","мозжечке"],"c":1,"e":"Это поперечные височные извилины в глубине латеральной борозды."},{"q":"Тугоухость III степени соответствует потере слуха","a":["26–40 дБ","41–55 дБ","56–70 дБ","более 90 дБ"],"c":2,"e":"I — 26–40, II — 41–55, III — 56–70, IV — 71–90 дБ, более 90 дБ — глухота."},{"q":"Кохлеарный имплант","a":["усиливает звук в наружном слуховом проходе","заменяет слуховые косточки","электрически стимулирует волокна слухового нерва","восстанавливает волосковые клетки"],"c":2,"e":"Имплант обходит повреждённые волосковые клетки и передаёт сигнал прямо на слуховой нерв."},{"q":"Рекомендация по профилактике шумовой тугоухости:","a":["громкость наушников не выше 60% и не дольше 60 минут подряд","использовать наушники только ночью","прочищать слуховой проход ватной палочкой ежедневно","закапывать капли для профилактики"],"c":0,"e":"Правило «60/60» снижает шумовую нагрузку на волосковые клетки."}],"kase":{"title":"Камила, 5 лет: сенсоневральная тугоухость III степени","norm":["Какие структуры повреждены при сенсоневральной тугоухости и почему это нарушение необратимо?","Какой частотный диапазон важен для понимания речи и что ребёнок теряет при потере слуха 60 дБ?","Чем помощь слухового аппарата отличается от помощи кохлеарного импланта?"],"portrait":"У Камилы двусторонняя сенсоневральная тугоухость III степени (по данным аудиометрии — около 65 дБ на оба уха). Нарушение выявили поздно, слуховые аппараты девочка носит с 3 лет, иногда снимает их, когда устаёт. В речи — отдельные слова и короткие фразы, обращённую речь понимает с опорой на чтение с губ и ситуацию. С девочкой в основном занимается бабушка, родители работают. Камила общительна, любит рисовать, но при неудаче в общении быстро расстраивается. Семья спрашивает, нужна ли кохлеарная имплантация.","task":"Спроектируйте фрагмент коррекционного маршрута по развитию слухоречевого восприятия и формированию произносительных навыков Камилы. Подготовьте также понятное объяснение для бабушки: что именно «не работает» в ухе и зачем ребёнку носить аппараты постоянно."},"trainer":{"match":[["Барабанная перепонка","Отделяет наружное ухо от среднего и передаёт колебания косточкам"],["Слуховая труба","Соединяет среднее ухо с носоглоткой и выравнивает давление"],["Улитка","Содержит кортиев орган"],["Волосковые клетки","Рецепторы слухового анализатора"],["Поперечные височные извилины","Первичная слуховая кора"]],"odd":[{"items":["молоточек","наковальня","стремечко","улитка"],"odd":3,"why":"Улитка - часть внутреннего уха, остальные - слуховые косточки."},{"items":["кондуктивная тугоухость","сенсоневральная тугоухость","смешанная тугоухость","катаракта"],"odd":3,"why":"Катаракта - помутнение хрусталика, это нарушение зрения."}],"yesno":[["Слуховые косточки находятся во внутреннем ухе",false],["Тугоухость III степени соответствует потере слуха 56–70 дБ",true],["Кохлеарный имплант заменяет слуховые косточки",false],["Сенсоневральная тугоухость обычно необратима",true],["Для понимания речи особенно важен диапазон 500–4000 Гц",true]]},"schemes":["ear"],"atlas":"атлас-таблицы ИвГМА (2012): рис. 53–56 (орган слуха и равновесия, слуховые косточки, лабиринт, передача звуковых колебаний)."},{"id":"t3","module":1,"hours":6,"title":"Зрительный анализатор","goal":"Связать строение оптической системы, сетчатки и зрительного пути с видами нарушений зрения и требованиями к зрительной среде ребёнка.","scheme":[["Роговица, хрусталик, ресничная мышца, стекловидное тело","Преломление света и фокусировка изображения на сетчатке, аккомодация","Близорукость, дальнозоркость, астигматизм; катаракта — помутнение хрусталика"],["Сетчатка: палочки и колбочки, жёлтое пятно с центральной ямкой","Фоторецепция: колбочки — острота и цвет, палочки — сумеречное зрение","Дистрофии сетчатки, ретинопатия недоношенных, нарушения цветоощущения"],["Зрительный нерв, хиазма (частичный перекрёст волокон), зрительный тракт","Проведение импульса","Атрофия зрительного нерва: снижение остроты, сужение полей зрения"],["Затылочная доля (область шпорной борозды)","Анализ зрительного изображения","Церебральные (корковые) нарушения зрения"],["Наружные мышцы глаза (иннервация: III, IV, VI пары черепных нервов)","Согласованные движения глаз, бинокулярное зрение","Косоглазие, амблиопия"]],"notes":["Острота зрения в норме — 1,0. В тифлопедагогике слабовидящими считают детей с остротой зрения 0,05–0,2 на лучше видящем глазу с коррекцией (до 0,4 при осложнённых и прогрессирующих формах), слепыми — от 0 до 0,04.","Острота зрения — не единственный показатель: при атрофии зрительного нерва и глаукоме важно сужение полей зрения, которое затрудняет ориентировку.","Зрительная система созревает в раннем детстве. Амблиопию наиболее успешно корригируют в раннем и дошкольном возрасте.","При миопии изображение фокусируется перед сетчаткой, при гиперметропии — за ней.","Освещённость рабочего места должна быть не менее 300 люкс, без бликов; для слабовидящих детей важны контраст и размер объектов."],"health":"Гигиена зрения: правило «20-20-20» при работе с экраном (каждые 20 минут смотреть 20 секунд на предмет на расстоянии около 6 м), расстояние до книги 30–35 см, гимнастика для глаз, пребывание на дневном свете, которое снижает риск развития близорукости у детей.","read":"Пособие, § 6.2 (зрительный анализатор как фундамент тифлопедагогики), § 5.3 (гигиена зрения при работе с экраном).","l1":["По модели глаза проследите путь луча света от роговицы до сетчатки, затем путь импульса до затылочной доли. Запишите последовательность звеньев.","Нарисуйте схему зрительного пути с хиазмой и отметьте, какие волокна перекрещиваются.","Выполните комплекс гимнастики для глаз и опишите, на какие структуры глаза направлено каждое упражнение."],"l2":["Ситуационная задача. Ребёнок 1: острота зрения 0,1 обоих глаз, поля зрения сужены. Ребёнок 2: острота 0,6 обоих глаз, плохо видит вдаль, после подбора очков — 1,0. Определите, какое звено зрительного анализатора нарушено в каждом случае, и сделайте педагогические выводы.","Сравните требования к зрительной среде для ребёнка с остаточным центральным зрением и для ребёнка с сужением полей зрения: размещение в классе, освещение, размер и контраст материала."],"l2check":["Нарушение соотнесено с конкретным звеном (оптика, сетчатка, проводящий путь, кора)","Учтены и острота, и поля зрения","Требования к среде вытекают из механизма нарушения"],"test":[{"q":"Аккомодация обеспечивается изменением кривизны","a":["роговицы","хрусталика","сетчатки","стекловидного тела"],"c":1,"e":"Ресничная мышца изменяет кривизну хрусталика, и глаз фокусируется на близких или далёких предметах."},{"q":"Наибольшая острота зрения обеспечивается в","a":["слепом пятне","центральной ямке жёлтого пятна","периферии сетчатки","хиазме"],"c":1,"e":"В центральной ямке сосредоточены колбочки."},{"q":"Палочки сетчатки обеспечивают","a":["цветовое зрение","сумеречное зрение","аккомодацию","бинокулярное зрение"],"c":1,"e":"Палочки высокочувствительны к слабому свету, но не различают цвета."},{"q":"При близорукости (миопии) изображение фокусируется","a":["на сетчатке","перед сетчаткой","за сетчаткой","в хрусталике"],"c":1,"e":"Поэтому далёкие предметы видны нечётко; коррекция — рассеивающие линзы."},{"q":"Первичная зрительная кора расположена в","a":["лобной доле","височной доле","затылочной доле","теменной доле"],"c":2,"e":"Область шпорной борозды затылочной доли."},{"q":"Частичный перекрёст волокон зрительных нервов происходит в","a":["сетчатке","хиазме","зрительной коре","хрусталике"],"c":1,"e":"В хиазме перекрещиваются волокна от внутренних (носовых) половин сетчаток."},{"q":"Острота зрения слабовидящего ребёнка (лучше видящий глаз, с коррекцией) составляет","a":["0,5–0,8","0,05–0,2 (до 0,4 при осложнённых формах)","0–0,04","1,0"],"c":1,"e":"От 0 до 0,04 — слепота, 0,05–0,2 — слабовидение."},{"q":"Амблиопию наиболее успешно корригируют","a":["в подростковом возрасте","в раннем и дошкольном возрасте","у взрослых","в любом возрасте одинаково"],"c":1,"e":"Это период созревания зрительной системы."}],"kase":{"title":"Мадина, 7 лет: частичная атрофия зрительных нервов","norm":["Какое звено зрительного анализатора поражено при атрофии зрительного нерва и почему очки не возвращают нормальную остроту?","Как сужение полей зрения влияет на ориентировку и чтение?","Какие гигиенические требования к зрительной нагрузке особенно важны для Мадины?"],"portrait":"У Мадины частичная атрофия зрительных нервов вследствие перинатальной гипоксии. Острота зрения обоих глаз с коррекцией — 0,1, поля зрения сужены. Девочка поступила в первый класс инклюзивной школы. Она читает крупный шрифт, близко поднося текст к глазам, быстро устаёт, трёт глаза, к концу урока начинает ошибаться. В новом помещении передвигается неуверенно, натыкается на предметы сбоку. Мадина старательна и самолюбива, не любит просить о помощи. Учитель класса впервые работает со слабовидящим ребёнком.","task":"Спроектируйте фрагмент коррекционного маршрута Мадины на первую четверть: организация зрительной среды и рабочего места, режим зрительной нагрузки, развитие зрительного восприятия и ориентировки, рекомендации учителю класса."},"trainer":{"match":[["Роговица","Прозрачная передняя часть наружной оболочки глаза"],["Хрусталик","Меняет кривизну при аккомодации"],["Колбочки","Обеспечивают цветовое зрение и остроту"],["Палочки","Обеспечивают сумеречное зрение"],["Хиазма","Место частичного перекрёста зрительных нервов"]],"odd":[{"items":["роговица","хрусталик","стекловидное тело","зрительный нерв"],"odd":3,"why":"Зрительный нерв проводит импульсы и не относится к светопреломляющим средам глаза."},{"items":["миопия","гиперметропия","астигматизм","амблиопия"],"odd":3,"why":"Амблиопия - функциональное снижение зрения, а не аномалия рефракции."}],"yesno":[["Слепое пятно - место выхода зрительного нерва, где нет фоторецепторов",true],["Зрительная кора расположена в височной доле",false],["При миопии изображение фокусируется за сетчаткой",false],["Острота зрения в норме равна 1,0",true],["Палочки различают цвета",false]]},"schemes":["eye"],"atlas":"атлас-таблицы ИвГМА (2012): рис. 52 (строение глазного яблока)."},{"id":"t4","module":2,"hours":6,"title":"Речевой аппарат и центральные механизмы речи","goal":"Научиться обосновывать логопедические упражнения строением и иннервацией речевого аппарата и составлять протокол обследования с цифровой фиксацией.","scheme":[["Дыхательный отдел: лёгкие, бронхи, диафрагма, межрёберные мышцы","Речевое дыхание: короткий вдох, удлинённый плавный выдох","Поверхностное дыхание, короткий речевой выдох"],["Фонационный отдел: гортань, голосовые складки","Голосообразование","Нарушения голоса (дисфонии); узелки голосовых складок при перегрузке"],["Артикуляционный отдел: язык, губы, мягкое нёбо, нижняя челюсть","Образование звуков речи","Дислалия при сохранной иннервации; ринолалия при расщелине нёба"],["Черепные нервы: V (жевательные мышцы), VII (мимические мышцы, губы), IX и X (нёбо, глотка, гортань), XII (язык)","Иннервация артикуляционных мышц","Поражение ядер ствола — бульбарная дизартрия; поражение корково-ядерных путей — псевдобульбарная"],["Зона Брока (задние отделы нижней лобной извилины), зона Вернике (задние отделы верхней височной извилины), дугообразный пучок; доминантное полушарие","Моторная организация речи; понимание речи","Моторные и сенсорные нарушения речи (афазии; у детей с ранним поражением — алалия)"]],"notes":["Речевой аппарат состоит из центрального (речевые зоны коры, подкорковые ядра, проводящие пути, ядра ствола) и периферического (дыхательный, фонационный, артикуляционный отделы) звеньев.","Дизартрия — нарушение произносительной стороны речи вследствие недостаточной иннервации речевого аппарата.","При псевдобульбарной дизартрии тонус артикуляционных мышц обычно повышен (спастичность), глоточный рефлекс сохранён или усилен, часто наблюдается слюнотечение.","При бульбарной дизартрии — периферический парез: тонус снижен, мышцы атрофируются, рефлексы угасают.","У большинства правшей речевые зоны расположены в левом полушарии.","В коррекции звукопроизношения выделяют подготовительный этап, постановку (вызывание) звука, его автоматизацию - последовательно в слогах, словах, предложениях и связной речи - и дифференциацию со сходными звуками. На этапе автоматизации регулярные занятия родителей с ребёнком необходимы.","Чаще всего дети искажают звуки основного ряда: Ль, С, Сь, З, Зь, Ц, Ш, Ж, Ч, Щ, Л, Р, Рь. Базовыми считают С, Ш, Л, Р: их артикуляция служит исходной для целых групп звуков, поэтому они формируются дольше всего.","Звуки смешиваются либо и на слух, и в произношении (Р - Л, С - Ш, З - Ж), либо только на слух (Ш - Ж, С - Сь, Р - Рь). От этого зависит объём работы по дифференциации."],"health":"Гигиена голоса для ребёнка и для дефектолога: не кричать и не шептать с напряжением, пить воду при длительной речевой нагрузке, делать голосовые паузы. Перед артикуляционной гимнастикой у ребёнка со спастичностью нужна нормализация тонуса, иначе упражнения через силу закрепляют неправильные движения. Ежедневная тренировка голоса дефектолога: спокойный вдох носом и плавный удлиняющийся выдох на звук [с] или [ш]; мягкая атака звука на гласных; мычание с ощущением вибрации в области носа и губ; медленное и чёткое проговаривание скороговорок. Цель - опора на дыхание вместо напряжения гортани.","read":"Пособие, § 6.2 (центральные и периферические механизмы речи), § 8.2 (интеграция с логопедией), кейсы 6.2 и 8.1. Ткаченко Т.А. Логопедическая энциклопедия (2008): этапы коррекции звукопроизношения, базовые звуки, дифференциация.","l1":["Подпишите на схеме отделы речевого аппарата и назовите функцию каждого.","Составьте таблицу «мышца или орган артикуляции — иннервирующий черепной нерв» для языка, губ, мягкого нёба и нижней челюсти.","Найдите на модели мозга зоны Брока и Вернике и дугообразный пучок."],"l2":["Цифровая диагностика. Составьте протокол обследования артикуляционной моторики (8–10 проб: губы, язык, мягкое нёбо, нижняя челюсть) с видеофиксацией. Для каждой пробы укажите, что фиксирует запись и по какому признаку вы оцените выполнение. Добавьте пункт о письменном согласии родителей на видеозапись и о хранении записей.","Ситуационная задача. У ребёнка 1 язык напряжён, движения ограничены, глоточный рефлекс усилен; у ребёнка 2 язык вялый, истончён, глоточный рефлекс снижен. Определите форму дизартрии и уровень поражения в каждом случае.","Составьте последовательность работы над звуком Р у Тимура: от подготовительного этапа до дифференциации Р - Л. Объясните с опорой на иннервацию, почему подготовительный этап при дизартрии длиннее, чем при дислалии."],"l2check":["Каждая проба протокола связана с конкретной мышцей и её иннервацией","Критерии оценки наблюдаемы на видеозаписи","Учтены согласие родителей и защита персональных данных"],"test":[{"q":"Голосовые складки находятся в","a":["глотке","гортани","трахее","полости носа"],"c":1,"e":"Гортань — фонационный отдел речевого аппарата."},{"q":"Мышцы языка иннервирует","a":["лицевой нерв (VII)","тройничный нерв (V)","подъязычный нерв (XII)","зрительный нерв (II)"],"c":2,"e":"Подъязычный нерв — двигательный нерв языка."},{"q":"Зона Брока расположена в","a":["задних отделах нижней лобной извилины","верхней височной извилине","затылочной доле","мозжечке"],"c":0,"e":"Она отвечает за моторную организацию речи; обычно в левом полушарии."},{"q":"Нарушение понимания речи при сохранном слухе связано с поражением","a":["зоны Брока","зоны Вернике","подъязычного нерва","голосовых складок"],"c":1,"e":"Зона Вернике обеспечивает анализ речевых звуков и понимание речи."},{"q":"Дизартрия — это","a":["нарушение темпа речи","нарушение произносительной стороны речи из-за недостаточной иннервации речевого аппарата","нарушение звукопроизношения при нормальной иннервации","отсутствие речи при сохранном слухе"],"c":1,"e":"Нарушения звукопроизношения при нормальной иннервации называют дислалией."},{"q":"Для псевдобульбарной дизартрии характерны","a":["спастичность артикуляционных мышц и сохранённый или усиленный глоточный рефлекс","атрофия языка и угасание рефлексов","только нарушение понимания речи","нормальный тонус и нарушение темпа"],"c":0,"e":"Поражены корково-ядерные пути, поэтому развивается центральный (спастический) парез."},{"q":"Речевое дыхание характеризуется","a":["длинным вдохом и коротким выдохом","коротким вдохом и удлинённым плавным выдохом","равными вдохом и выдохом","дыханием только через нос"],"c":1,"e":"Речь строится на выдохе, поэтому он удлинён."},{"q":"Ринолалия связана с","a":["поражением зоны Вернике","анатомическими дефектами нёба и нарушением нёбно-глоточного смыкания","снижением слуха","поражением мозжечка"],"c":1,"e":"Например, при расщелине нёба воздух уходит в нос, речь приобретает носовой оттенок."}],"kase":{"title":"Тимур, 6 лет: псевдобульбарная дизартрия","norm":["Какой уровень иннервации поражён при псевдобульбарной дизартрии и чем это проявляется в артикуляционной моторике?","Какие черепные нервы иннервируют мышцы, которые вы будете тренировать?","Почему перед артикуляционной гимнастикой нужно нормализовать тонус?"],"portrait":"У Тимура в анамнезе перинатальное поражение центральной нервной системы, выраженных двигательных нарушений нет. Невролог и логопед отмечают псевдобульбарную дизартрию средней степени. Язык напряжён, оттянут назад, движения ограничены, при попытке поднять язык вверх появляется дрожание. Отмечается слюнотечение, речь смазанная, с носовым оттенком. Нарушено произношение свистящих, шипящих и сонорных звуков. Через 10 минут занятия речь становится ещё менее разборчивой. Логопед просит студента обосновать выбор упражнений анатомией и иннервацией, а также предложить способ фиксировать динамику.","task":"Спроектируйте фрагмент маршрута подготовительного этапа логопедической работы: нормализация тонуса, дыхательные и артикуляционные упражнения с обоснованием по иннервации. Включите план цифровой фиксации динамики (видеозапись проб раз в 3–4 недели по вашему протоколу)."},"trainer":{"match":[["Гортань","Голосообразование"],["Подъязычный нерв (XII)","Иннервирует мышцы языка"],["Лицевой нерв (VII)","Иннервирует мимические мышцы и мышцы губ"],["Зона Брока","Моторная организация речи"],["Зона Вернике","Понимание речи"]],"odd":[{"items":["губы","язык","мягкое нёбо","трахея"],"odd":3,"why":"Трахея относится к дыхательному отделу, а не к артикуляционному."},{"items":["дислалия","дизартрия","ринолалия","миопия"],"odd":3,"why":"Миопия - нарушение зрения, остальные - нарушения произносительной стороны речи."}],"yesno":[["Речь строится на выдохе",true],["Голосовые складки находятся в глотке",false],["При бульбарной дизартрии тонус артикуляционных мышц снижен",true],["Зона Брока расположена в височной доле",false],["Базовыми звуками групп считают С, Ш, Л, Р",true]]},"schemes":["brain"],"atlas":"атлас-таблицы ИвГМА (2012): рис. 23, 28, 29–31 (полость рта и глотка, нёбо, дыхательные пути, гортань), рис. 50 (черепные нервы)."},{"id":"t5","module":2,"hours":6,"title":"Высшая нервная деятельность и регуляция поведения","goal":"Понять физиологические основы внимания, торможения и произвольной регуляции и научиться организовывать структурированное педагогическое наблюдение.","scheme":[["Условный рефлекс (И.П. Павлов)","Образование временной связи — основа научения и навыков","Трудности выработки и закрепления навыков при истощаемости нервной системы"],["Процессы возбуждения и торможения; внутреннее (условное) торможение","Дифференцировка, угасание ненужных реакций, удержание инструкции","Слабость торможения: импульсивность, отвлекаемость"],["Свойства нервной системы: сила, уравновешенность, подвижность; типы высшей нервной деятельности","Индивидуальный темп, выносливость к нагрузке","Необходимость дифференцированной нагрузки и темпа"],["Лобные (префронтальные) отделы коры и их связи с подкорковыми ядрами","Программирование, контроль, рабочая память, исполнительные функции","Нарушения исполнительных функций и торможения при СДВГ"],["Ретикулярная формация ствола","Поддержание бодрствования и активации коры","Колебания внимания, быстрая утомляемость"],["Вторая сигнальная система (речь)","Регуляция поведения словом","Недостаточная регулирующая функция собственной речи ребёнка"]],"notes":["Безусловные рефлексы врождённые, условные приобретаются при жизни на основе временной связи.","Внутреннее торможение (угасательное, дифференцировочное, запаздывательное) — физиологическая основа произвольного поведения.","Синдром дефицита внимания и гиперактивности (СДВГ) — нарушение нейроразвития, в основе которого лежит дисфункция лобно-подкорковых систем регуляции.","Диагноз СДВГ ставит врач (психиатр, невролог). Дефектолог проводит педагогическое наблюдение и строит работу с учётом заключения.","Структурированное наблюдение фиксирует поведение по заранее заданным признакам и интервалам времени, а не общими впечатлениями."],"health":"Короткие этапы работы, смена видов деятельности, двигательные паузы и предсказуемый распорядок снижают перегрузку. Для студента: та же логика самоорганизации — работа блоками по 45–60 минут с перерывами.","read":"Пособие, § 6.2 (нейрофизиология как основа всех направлений коррекционной работы), § 2.3 (психолого-педагогические основы познавательной деятельности).","l1":["Составьте таблицу «вид торможения — условие возникновения — пример из поведения ребёнка на занятии».","Опишите свойства нервной системы и укажите, как каждое проявляется в учебной деятельности."],"l2":["Цифровая диагностика. Разработайте электронный лист структурированного наблюдения за поведением ребёнка на 30-минутном занятии: 5–6 наблюдаемых признаков (например, выход из задания, реакция на инструкцию с первого раза, моторное беспокойство), интервалы фиксации по 5 минут, способ подсчёта. Продумайте, как оформить лист в Google Формах или таблице.","Объясните с физиологических позиций, почему ребёнок с СДВГ лучше выполняет задание, разбитое на короткие шаги с внешними опорами, чем длинную устную инструкцию."],"l2check":["Признаки наблюдения конкретны и однозначно фиксируются","Предусмотрены интервалы времени и способ подсчёта","Объяснение опирается на функции лобных отделов и торможения"],"test":[{"q":"Условный рефлекс —","a":["врождённая реакция","приобретённая реакция на основе временной связи","реакция без участия коры","рефлекс спинного мозга"],"c":1,"e":"Условные рефлексы вырабатываются при жизни."},{"q":"Учение о типах высшей нервной деятельности создал","a":["И.М. Сеченов","И.П. Павлов","Л.С. Выготский","А.Р. Лурия
